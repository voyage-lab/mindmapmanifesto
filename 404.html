<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | MindMapManifesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --ink: #0d0d0d; --char: #1a1918; --paper: #e9e3d6; --paper-dim: #c2bbad; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100svh; display: grid; place-items: center; padding: 16px;
    text-align: center;
    background: var(--ink); color: var(--paper);
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 1.3rem; line-height: 1.5;
  }
  main { max-width: 28rem; }
  h1 { font-family: "Caveat", cursive; font-weight: 700; font-size: clamp(3rem, 12vw, 4.4rem); line-height: 1; margin-bottom: .8rem; }
  p { color: var(--paper-dim); }
  a {
    display: block; margin-top: 1.5rem; padding: .55rem 1.2rem;
    font-family: "Caveat", cursive; font-weight: 700; font-size: 1.85rem;
    text-decoration: none; color: var(--char); background: var(--paper); border-radius: 2px;
  }
</style>
</head>
<body>
<main>
  <h1>this page isn’t here anymore</h1>
  <p>If you came from a reel, what you’re looking for is on the front page.</p>
  <a href="/">Go to the front page</a>
</main>
</body>
</html>
