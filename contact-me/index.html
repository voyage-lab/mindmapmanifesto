<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — MindMapManifesto</title>
<meta name="description" content="Send a note under the glass. Contact MindMapManifesto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0d0d;
    --char: #1a1918;
    --paper: #e9e3d6;
    --paper-dim: #b9b2a3;
    --glass: rgba(220, 235, 240, .55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100svh;
    background: var(--ink);
    color: var(--paper);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 20px;
    line-height: 1.6;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }
  .bg {
    position: fixed; inset: 0; z-index: -2;
    background: url("../Gemini_Generated_Image_9y8q49y8q49y8q49.jpg") center / cover no-repeat;
    filter: grayscale(.35) contrast(1.05) brightness(.45) blur(2px);
    transform: scale(1.04);
  }
  .bg::after {
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.25) 20%, rgba(0,0,0,.9) 100%);
  }

  nav { padding: 20px 16px; }
  nav a {
    font-family: "Caveat", cursive; font-size: 1.5rem;
    color: var(--paper-dim); text-decoration: none;
  }
  nav a:hover { color: var(--paper); }

  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 1rem 16px 4rem;
  }
  h1 {
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: clamp(3rem, 10vw, 6rem);
    line-height: 1;
    text-align: center;
    text-shadow: 0 4px 30px rgba(0,0,0,.8);
  }
  .sub {
    text-align: center;
    margin: .6rem 0 2.5rem;
    font-size: clamp(.85rem, 2vw, 1.1rem);
    letter-spacing: .5em;
    text-transform: uppercase;
    color: var(--paper-dim);
  }

  /* torn paper note */
  .note {
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    color: var(--char);
    padding: 2.2rem clamp(1.2rem, 4vw, 2.4rem) 2rem;
    border-radius: 2px;
    box-shadow: 0 30px 80px rgba(0,0,0,.75);
    transform: rotate(-.8deg);
    position: relative;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(120,100,70,.12), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(90,75,55,.15), transparent 45%);
  }
  .note::before { /* tape */
    content: ""; position: absolute; top: -14px; left: 50%;
    width: 120px; height: 28px; transform: translateX(-50%) rotate(2deg);
    background: var(--glass);
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .note h2 { font-family: "Caveat", cursive; font-size: 2.2rem; line-height: 1.1; margin-bottom: 1.2rem; }

  label { display: block; font-family: "Caveat", cursive; font-size: 1.45rem; margin-top: 1rem; }
  input, textarea {
    width: 100%;
    font: inherit; font-size: 1.1rem;
    color: var(--char);
    background: transparent;
    border: 0;
    border-bottom: 1.5px solid rgba(26,25,24,.45);
    padding: .3rem .1rem;
    outline: none;
  }
  textarea {
    min-height: 150px; resize: vertical;
    border: 1.5px solid rgba(26,25,24,.3);
    padding: .5rem .6rem;
    background-image: repeating-linear-gradient(transparent 0 31px, rgba(26,25,24,.12) 31px 32px);
    line-height: 32px;
  }
  input:focus, textarea:focus { border-color: var(--char); }

  button {
    margin-top: 1.8rem;
    width: 100%;
    padding: .7rem 2rem;
    font-family: "Caveat", cursive; font-size: 1.7rem;
    color: var(--paper);
    background: var(--char);
    border: 1px solid var(--char);
    cursor: pointer;
    transition: transform .3s, background .3s;
  }
  button:hover { transform: translateY(-2px); background: #000; }
  button:disabled { opacity: .6; cursor: wait; transform: none; }
  .status { margin-top: 1rem; text-align: center; font-family: "Caveat", cursive; font-size: 1.4rem; min-height: 1.4em; }
  .status a { color: inherit; }

  .alt { text-align: center; margin-top: 2.5rem; color: var(--paper-dim); font-style: italic; }
  .alt a { color: var(--paper); }

  footer {
    text-align: center;
    padding: 2rem 16px;
    border-top: 1px solid #2a2a2a;
    color: var(--paper-dim);
    font-size: 1rem;
    background: rgba(0,0,0,.6);
  }
  footer .hand { font-family: "Caveat", cursive; font-size: 1.5rem; color: var(--paper); }

  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<nav><a href="../index.html">← back to the map</a></nav>

<main>
  <div>
    <h1>break the glass</h1>
    <p class="sub">— contact me —</p>

    <form class="note" id="contact">
      <h2>leave a note on the map…</h2>
      <label for="name">your name</label>
      <input id="name" name="name" autocomplete="name" required>
      <label for="email">where can I reach you</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="msg">the message</label>
      <textarea id="msg" name="message" required></textarea>
      <button type="submit">send it through the glass →</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="alt">Everything on the map points back here. <em>I am</em> listening.</p>
  </div>
</main>

<footer>
  <p class="hand">— under the glass —</p>
  <p>© <span id="yr"></span> MindMapManifesto · mindmapmanifesto.com</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  // EmailJS IDs (dashboard → Account / Email Services / Email Templates).
  // These are public by design; lock them to mindmapmanifesto.com under Account → Security.
  const EMAILJS_PUBLIC_KEY  = "G56MGzauq9Ld23k-K";
  const EMAILJS_SERVICE_ID  = "service_hycm9y6";
  const EMAILJS_TEMPLATE_ID = "template_h6e76de";
  // Fallback if EmailJS fails: open the visitor's mail app pre-filled.
  const CONTACT_EMAIL = "nazkorch@gmail.com";

  const hasEmailJS = typeof emailjs !== 'undefined';
  if (hasEmailJS) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

  document.getElementById('yr').textContent = new Date().getFullYear();
  document.getElementById('contact').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    const btn = f.querySelector('button');
    const status = document.getElementById('status');
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'sending…';
    status.textContent = '';
    try {
      if (!hasEmailJS) throw new Error('EmailJS not loaded');
      // Template variables: {{name}}, {{email}}, {{message}}
      await emailjs.sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, f);
      f.reset();
      status.textContent = 'received. it’s under the glass now.';
    } catch (err) {
      console.error('EmailJS error', err);
      const subject = `Note from ${f.name.value}`;
      const body = `${f.message.value}\n\n— ${f.name.value} (${f.email.value})`;
      status.innerHTML = `the glass didn’t break. <a href="mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}">send it by email instead</a>.`;
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  });
</script>
</body>
</html>
