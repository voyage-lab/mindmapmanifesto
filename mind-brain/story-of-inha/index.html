<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Story of Inha — MindMapManifesto</title>
  <meta name="description" content="A real-world case study: one night at the bar, and the seven levels of self-sabotage playing out in perfect sequence."/>
  <meta property="og:title" content="The Story of Inha"/>
  <meta property="og:description" content="A real-world case study: one night at the bar, and the seven levels of self-sabotage playing out in perfect sequence."/>
  <meta property="og:image" content="../../Gemini_Generated_Image_9y8q49y8q49y8q49.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050507; color: #e8e8ed; overflow-x: hidden; }
    @keyframes mmm-reveal { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes mmm-fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes mmm-blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    @keyframes waveExpand { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../theme-app.css"/>
</head>
<body>
  <nav class="mb-nav" aria-label="Series navigation"><a href="../index.html">← back to mind x brain</a></nav>
  <p class="mb-hint" aria-hidden="true">← → keys or swipe</p>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SERIES = 'The Story of Inha';
    const ACCENT = '#a78bfa';
    const NUMBERS = ['Zero','One','Two','Three','Four','Five','Six','Seven'];
    const LEVELS = ['The Surface Appeal','The Con Man Emerges','Fear Takes the Wheel','The Defense Wall','The Self-Saboteur’s Performance','The Ultimate Deception','The Observer Awakens'];

    /* ── Shared Components ───────────────────────────────────────── */

    function ProgressBar({ pct }) {
      return (
        <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, height:3, background:'#14141c' }}>
          <div style={{ height:'100%', width:`${pct}%`, background:ACCENT, transition:'width 0.5s ease' }}/>
        </div>
      );
    }

    function Eyebrow({ children }) {
      return (
        <div style={{ fontSize:'0.7rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:16, display:'flex', alignItems:'center', gap:10, fontWeight:500 }}>
          <span style={{ width:28, height:1, background:ACCENT, opacity:0.5, flexShrink:0, display:'block' }}/>
          {children}
        </div>
      );
    }

    function StepIndicator({ current, total }) {
      return (
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.2em', textTransform:'uppercase', color:'#8888a0' }}>
          Part <span style={{ color:ACCENT, fontWeight:600 }}>{current}</span> of {total}
        </div>
      );
    }

    function ArrowRight({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>);
    }

    function ArrowLeft({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>);
    }

    function BackBtn({ onClick }) {
      return (
        <button onClick={onClick} style={{ display:'flex', alignItems:'center', gap:6, color:'#8888a0', background:'none', border:'none', cursor:'pointer', fontSize:'0.82rem' }}>
          <ArrowLeft size={15}/> Back
        </button>
      );
    }

    function BottomNav({ onBack, onNext, nextLabel = 'Continue' }) {
      return (
        <div style={{ display:'flex', justifyContent: onBack ? 'space-between' : 'flex-end', alignItems:'center', gap:16, marginTop:64, paddingTop:32, borderTop:'1px solid #1e1e2a' }}>
          {onBack && <BackBtn onClick={onBack}/>}
          <button onClick={onNext}
            style={{ display:'inline-flex', alignItems:'center', gap:9, padding:'13px 26px', borderRadius:12, fontSize:'0.875rem', fontWeight:600, border:'none', cursor:'pointer', background:`linear-gradient(135deg,${ACCENT},#7c3aed)`, color:'#fff', textAlign:'left' }}>
            {nextLabel} <ArrowRight/>
          </button>
        </div>
      );
    }

    function InsightCard({ label = 'Key Insight', children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}33`, borderRadius:18, padding:34, marginBottom:36, position:'relative' }}>
          <div style={{ fontSize:'0.68rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:14, fontWeight:600 }}>{label}</div>
          <p style={{ fontSize:'clamp(1.05rem,2.4vw,1.3rem)', lineHeight:1.72, color:'#e8e8ed', position:'relative' }}>{children}</p>
        </div>
      );
    }

    function Footer() { return <footer style={{ textAlign:'center', marginTop:56, color:'#8888a0', fontSize:'0.75rem' }}>© 2026 MindMapManifesto.com</footer>; }
    function PageWrapper({ children, maxWidth = 820 }) { return <div style={{ position:'relative', zIndex:1, maxWidth, margin:'0 auto', padding:'60px 24px 100px' }}>{children}</div>; }

    function Prose({ children }) {
      return <p style={{ fontSize:'clamp(0.95rem,2.1vw,1.1rem)', lineHeight:1.88, color:'rgba(220,215,240,0.72)', marginBottom:22 }}>{children}</p>;
    }

    function PullQuote({ children }) {
      return (
        <div style={{ borderLeft:`2px solid ${ACCENT}40`, paddingLeft:24, marginBottom:30, marginTop:4 }}>
          <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.2vw,1.18rem)', lineHeight:1.78, color:`${ACCENT}a0` }}>{children}</p>
        </div>
      );
    }

    /* the seven levels, current one in full ink */
    function LevelTrack({ current }) {
      return (
        <div role="img" aria-label={`Level ${current} of 7`} style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:32 }}>
          {LEVELS.map((_, i) => (
            <div key={i} style={{ width:32, height:32, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', border:`1px solid ${ACCENT}66`, color:ACCENT, fontSize:'0.8rem', opacity: i + 1 === current ? 1 : 0.3 }}>{i + 1}</div>
          ))}
        </div>
      );
    }

    function Chapter({ children, n, label, title, nextLabel, onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <ProgressBar pct={n / PARTS.length * 100}/>
          <PageWrapper>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:56 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={n} total={PARTS.length}/>
            </nav>
            <div style={{ marginBottom:36, animation:'mmm-fadeUp 0.7s ease-out' }}>
              <Eyebrow>{label}</Eyebrow>
              <h1 style={{ fontSize:'clamp(1.9rem,4.6vw,2.95rem)', fontWeight:700, lineHeight:1.18, marginBottom:8, color:'#e8e8ed' }}>{title}</h1>
            </div>
            {children}
            <BottomNav onBack={onBack} onNext={onNext} nextLabel={nextLabel}/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 0: Landing ───────────────────────────────────────── */
    function LandingScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:820, display:'flex', flexDirection:'column', alignItems:'center', gap:36, animation:'mmm-reveal 1.5s cubic-bezier(0.16,1,0.3,1) forwards' }}>
            <div style={{ fontSize:'0.65rem', letterSpacing:'0.6em', color:'rgba(167,139,250,0.5)', textTransform:'uppercase', fontWeight:700 }}>A Real-World Case Study</div>
            <div>
              <h1 style={{ fontSize:'clamp(2.8rem,10vw,6rem)', fontWeight:700, letterSpacing:'-0.02em', color:'white', marginBottom:10 }}>The Story of Inha</h1>
              <div style={{ fontSize:'clamp(0.9rem,2.2vw,1.3rem)', fontWeight:300, color:'rgba(255,255,255,0.4)', letterSpacing:'0.1em' }}>Seven Levels of Self-Sabotage, One Night at the Bar</div>
            </div>
            <div style={{ maxWidth:600, borderLeft:'2px solid rgba(167,139,250,0.3)', paddingLeft:26, textAlign:'left' }}>
              <p style={{ fontStyle:'italic', fontSize:'clamp(0.95rem,1.9vw,1.13rem)', lineHeight:1.8, color:'rgba(255,255,255,0.55)' }}>
                “I had been working on my framework about the seven psychological levels of self-sabotage, developing this theory about how the mind creates its own prison. Little did I know I was about to witness it unfold in real time.”
              </p>
            </div>
            <button onClick={onNext}
              style={{ background:'rgba(167,139,250,0.08)', border:'1px solid rgba(167,139,250,0.28)', borderRadius:9999, padding:'18px 52px', fontSize:'0.8rem', fontWeight:700, letterSpacing:'0.4em', textTransform:'uppercase', color:'white', cursor:'pointer' }}>
              Begin
            </button>
          </div>
        </div>
      );
    }

    /* ── Parts ───────────────────────────────────────────────────── */
    const level = n => `Level ${NUMBERS[n]} · ${SERIES}`;

    const PARTS = [
      {
        label: `Before · ${SERIES}`, title: 'The Setting',
        body: <>
          <Prose>It was just another night at the bar. I had been working on my framework about the seven psychological levels of self-sabotage, developing this theory about how the mind creates its own prison. Little did I know I was about to witness it unfold in real time.</Prose>
          <Prose>Inha was beautiful—the kind of beautiful that knows its power. Funny, charming, with an intuitive understanding of human psychology that comes from dealing with thousands of men as clients. She knew about oxytocin, about how to make people feel authenticity even when the interaction was transactional.</Prose>
          <PullQuote>She had seen me at the bar a few times before. She knew I was a spender.</PullQuote>
          <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'26px 28px', marginBottom:30 }}>
            <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:`${ACCENT}99`, marginBottom:16, fontWeight:600 }}>The seven levels, in the order they played out</div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {LEVELS.map((t, i) => (
                <div key={i} style={{ display:'flex', gap:14, alignItems:'center' }}>
                  <div style={{ width:28, height:28, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, border:`1px solid ${ACCENT}55`, fontSize:'0.78rem' }}>{i + 1}</div>
                  <p style={{ fontSize:'1rem', lineHeight:1.5 }}>{t}</p>
                </div>
              ))}
            </div>
          </div>
        </>,
      },
      {
        label: level(1), title: LEVELS[0], track: 1,
        body: <>
          <Prose>When she invited me to sit with her, it felt natural. She was always immaculate—makeup perfect, constantly posting selfies, even had a picture of herself on her own phone. This was someone who lived in the world of appearance and status.</Prose>
          <Prose>I had yellow glasses that day. When she tried them on, she immediately reached for her phone to take a picture. “They’re sexy,” she said, “make me look like a pornstar.”</Prose>
          <InsightCard label="Level 1 · The conscious mind">The conscious mind level—status obsessed, constantly comparing, using <em>appearance as currency.</em></InsightCard>
          <PullQuote>She offered me a deal on hookah for 500. The surface dance had begun.</PullQuote>
        </>,
      },
      {
        label: level(2), title: LEVELS[1], track: 2,
        body: <>
          <Prose>When pure charm wasn’t enough, the calculation started. She moved closer, rubbing my shoulder, using physical touch strategically. Her whole approach shifted to direct manipulation—leveraging her looks and proximity to influence my spending.</Prose>
          <PullQuote>I told her honestly: “Look, I’m just chilling, not spending much, don’t need to spend.”</PullQuote>
          <Prose>She said okay, and we chilled for a bit. But I could sense the gears turning.</Prose>
          <InsightCard label="Level 2 · The con man">The con man level—always looking for angles, <em>using people as objects</em> for personal gain.</InsightCard>
        </>,
      },
      {
        label: level(3), title: LEVELS[2], track: 3,
        body: <>
          <Prose>When straightforward manipulation failed, the stakes escalated. Suddenly it was about survival.</Prose>
          <PullQuote>“My documents to stay in the country are expiring next week,” she said, using those puppy eyes that had probably melted a thousand wallets. “I need money or they will kick me out of the country.”</PullQuote>
          <Prose>The fear-driven level had activated. She needed 25,000 more, though she already had 15,000. She suggested going to a tattoo artist where I could pay with card.</Prose>
          <InsightCard label="Level 3 · Fear">Terror of appearing weak, panic about not having enough—all the classic fear responses <em>disguised as desperation.</em></InsightCard>
          <Prose>I told her I was sorry but couldn’t help. Then I asked the obvious question: “How much do you currently have?”</Prose>
        </>,
      },
      {
        label: level(4), title: LEVELS[3], track: 4,
        body: <>
          <Prose>I offered her a practical solution. “I already tried to help you—I found good contacts for your documents. My contact charges 10,000-16,000, so you should have enough.”</Prose>
          <PullQuote>Her response was immediate and absolute: “No… it won’t work. No… it won’t work.”</PullQuote>
          <Prose>Zero details. Zero consideration. She admitted she never even called them.</Prose>
          <InsightCard label="Level 4 · Ego defense">The ego defense level had taken over—cannot admit mistakes, cannot accept help that doesn’t fit the narrative. It wasn’t about solving the problem anymore; it was about <em>maintaining control of the story.</em></InsightCard>
        </>,
      },
      {
        label: level(5), title: LEVELS[4], track: 5,
        body: <>
          <Prose>The conversation shifted again. Now she was sick, working nights “like a dog,” popping cold and flu medicine but pushing through anyway. She looked genuinely tired, genuinely struggling.</Prose>
          <InsightCard label="Level 5 · The self-saboteur">This was the self-saboteur level—risking everything rather than face humiliation, <em>self-destruction before accepting limits.</em></InsightCard>
          <Prose>Even as the manager complained in Turkish about her and the other girls just sitting there smoking instead of generating revenue, she continued down this path.</Prose>
          <PullQuote>She was literally destroying her health, her job performance, her situation—but she couldn’t stop the pattern.</PullQuote>
        </>,
      },
      {
        label: level(6), title: LEVELS[5], track: 6,
        body: <>
          <Prose>As I prepared to leave, having finished my third beer, she played her final card.</Prose>
          <PullQuote>“Hey, remember that night your phone died and you had a shot of raki? You forgot to pay… it’s 450.”</PullQuote>
          <Prose>I looked at her directly. “No, I paid for that. If I’m at the bar, I pay for it.”</Prose>
          <Prose>I reminded her that we had all left together to go eat, she was there when I paid everything. But she persisted: “No no, you didn’t pay, there’s a bill for 450. The bartender told me, but you know what, I’ll just cancel it.”</Prose>
          <InsightCard label="Level 6 · The ego itself">This was the ego itself—the true enemy creating completely false obligations, <em>manufacturing reality</em> to justify taking what it wanted.</InsightCard>
        </>,
      },
      {
        label: level(7), title: LEVELS[6], track: 7,
        body: <>
          <Prose>Throughout this entire progression, I maintained awareness. I could see each level activating, each fallback position being deployed exactly as my framework predicted. It was like watching a live demonstration of everything I had been studying.</Prose>
          <PullQuote>I finished my beer, paid my actual bill, and walked away.</PullQuote>
          <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'26px 28px', marginBottom:30 }}>
            <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:`${ACCENT}99`, marginBottom:16, fontWeight:600 }}>What the observer saw</div>
            <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
              {[
                ['The surface appeal', 'Selfies, yellow glasses, a deal on hookah. Appearance as currency.'],
                ['The con man', 'Moving closer, a hand on the shoulder. Looks and proximity as leverage.'],
                ['Fear takes the wheel', 'The documents, the deadline, 25,000 more. Survival as the pitch.'],
                ['The defense wall', '“No… it won’t work.” A real solution, never even called.'],
                ['The self-saboteur', 'Sick, working nights “like a dog,” still pushing through.'],
                ['The ultimate deception', 'A 450 bill for a shot that was already paid.'],
                ['The observer', 'Awareness the whole way through. The actual bill paid. Walking away.'],
              ].map(([t, d], i) => (
                <div key={i} style={{ borderLeft:`2px solid ${ACCENT}4d`, paddingLeft:14 }}>
                  <div style={{ fontWeight:700, fontSize:'1.1rem', color:'#e8e8ed', marginBottom:2 }}>{i + 1} · {t}</div>
                  <p style={{ fontSize:'0.9rem', color:'#8888a0', lineHeight:1.6 }}>{d}</p>
                </div>
              ))}
            </div>
          </div>
        </>,
      },
      {
        label: `After · ${SERIES}`, title: 'The Aftermath',
        body: <>
          <Prose>Later, I blocked her across all social media platforms. But I did it all with a polite goodbye, a hug, and a smile.</Prose>
          <PullQuote>No drama, no anger—just clear boundaries and decisive action.</PullQuote>
          <InsightCard label="The timing">The remarkable thing was the timing. This happened right after I had developed my framework about the seven states of consciousness. And here was Inha, unconsciously demonstrating <em>every single level in perfect sequence.</em></InsightCard>
        </>,
      },
      {
        label: `After · ${SERIES}`, title: 'The Deeper Truth',
        body: <>
          <Prose>The more I reflected on it, the more I realized something profound: she was being completely honest. Not honest about the facts—the unpaid bill was clearly fabricated—but honest about herself and her situation.</Prose>
          <Prose>She really was sick. She probably did owe money. Her documents might actually have been an issue.</Prose>
          <InsightCard label="Not schemes">The manipulation tactics weren’t calculated schemes; they were <em>unconscious responses</em> emerging from her genuine circumstances combined with her self-concept and survival needs.</InsightCard>
          <PullQuote>She was never meant to be a case study. We were just close enough to see the patterns unfold.</PullQuote>
        </>,
      },
      {
        label: `After · ${SERIES}`, title: 'The Human Element',
        body: <>
          <Prose>Despite everything, there had been real connection. The laughter was genuine. The chemistry was real. The oxytocin she knew how to generate? It actually worked because underneath the patterns, there was a real person dealing with real problems the only way she knew how.</Prose>
          <Prose>I never lived a day in her shoes, and she never lived a day in mine. Maybe we have, but we don’t know. What I do know is that she laughed at my jokes. Maybe because I’m stupid, or maybe because they were actually funny.</Prose>
          <PullQuote>If I was in her shoes—beautiful, working nights in a bar, dealing with document issues, genuinely sick but needing to keep working—I would probably do the exact same thing.</PullQuote>
        </>,
      },
      {
        label: `After · ${SERIES}`, title: 'The Perfect Synchronicity',
        body: <>
          <Prose>The stars had aligned in the strangest way. I had spent months developing a theoretical framework about psychological patterns, and life delivered the perfect real-world demonstration.</Prose>
          <InsightCard label="An unwitting teacher">Inha became an unwitting teacher, showing me that human psychology follows predictable patterns even when—<em>especially when</em>—people are being their most authentic selves.</InsightCard>
          <PullQuote>She felt so divine she became conceited, which gave her the right to divide my assets and conquer them. But even that followed the framework perfectly.</PullQuote>
        </>,
      },
      {
        label: `After · ${SERIES}`, title: 'The Lesson',
        body: <>
          <Prose>This wasn’t a story about manipulation or deception. It was a story about how human psychology operates under pressure, how ancient survival mechanisms play out in modern contexts, and how awareness can protect us from patterns that might otherwise ensnare us.</Prose>
          <InsightCard label="The lesson">Inha was honest with me, and she was honest with herself. That’s what made the whole experience <em>so beautifully, terribly human.</em></InsightCard>
          <PullQuote>And that’s why I decided to write her this chapter.</PullQuote>
        </>,
      },
    ];

    /* ── Completion Screen ──────────────────────────────────────── */
    function CompletionScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', position:'relative', overflow:'hidden' }} onClick={onNext}>
          {[0, 1, 2].map(i => (<div key={i} style={{ position:'absolute', top:'50%', left:'50%', width:100+i*90, height:100+i*90, borderRadius:'50%', border:`1px solid ${['rgba(167,139,250,0.35)','rgba(129,140,248,0.25)','rgba(6,182,212,0.18)'][i]}`, animation:`waveExpand 5s ease-out ${i*1.6}s infinite` }}/>))}
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:760 }}>
            <div style={{ fontSize:'0.62rem', letterSpacing:'0.5em', textTransform:'uppercase', color:'rgba(167,139,250,0.4)', marginBottom:36 }}>Complete · Level Seven</div>
            <h1 style={{ fontSize:'clamp(2.2rem,8vw,5rem)', fontWeight:700, color:'#e8e8ed', letterSpacing:1, marginBottom:32, animation:'mmm-reveal 2s ease-out 0.5s both', lineHeight:1.1 }}>THE OBSERVER<br/>AWAKENS</h1>
            <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.4vw,1.25rem)', color:'rgba(210,200,255,0.55)', lineHeight:1.8, marginBottom:44, animation:'mmm-fadeUp 1.5s ease-out 1.5s both' }}>Seven levels, in perfect sequence.<br/>Awareness the whole way through.<br/>A polite goodbye, a hug, and a smile.</p>
            <div style={{ background:'rgba(167,139,250,0.06)', border:'1px solid rgba(167,139,250,0.15)', borderRadius:16, padding:'26px 36px', maxWidth:600, margin:'0 auto 48px', animation:'mmm-fadeUp 1.5s ease-out 2.2s both' }}>
              <p style={{ fontStyle:'italic', fontSize:'1.05rem', color:'rgba(220,200,255,0.72)', lineHeight:1.8 }}>“Human psychology follows predictable patterns even when—especially when—people are being their most authentic selves.”</p>
            </div>
            <div style={{ fontSize:'0.72rem', letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(255,255,255,0.18)', animation:'mmm-blink 2.5s ease-in-out 3.5s infinite' }}>*click anywhere to restart*</div>
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────────── */
    function App() {
      const [screen, setScreen] = useState(0);
      const go = n => setScreen(n);
      useEffect(() => { window.scrollTo(0, 0); }, [screen]);

      if (screen === 0) return <LandingScreen onNext={() => go(1)}/>;
      if (screen > PARTS.length) return <CompletionScreen onNext={() => go(0)}/>;
      const part = PARTS[screen - 1];
      const next = PARTS[screen];
      return (
        <Chapter key={screen} n={screen} label={part.label} title={part.title} nextLabel={next ? next.title : 'Finish'} onBack={() => go(screen - 1)} onNext={() => go(screen + 1)}>
          {part.track && <LevelTrack current={part.track}/>}
          {part.body}
        </Chapter>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script src="../app-nav.js"></script>
</body>
</html>
