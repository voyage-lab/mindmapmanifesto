<body>
  <nav class="mb-nav" aria-label="Series navigation"><a href="../index.html">← back to mind x brain</a></nav>

  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SERIES = 'Alex Hormozi';
    const ACCENT = '#fbbf24';
    const ONES = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
    const TENS = ['', '', 'Twenty', 'Thirty'];
    const spell = n => n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');

    /* ── Shared Components ───────────────────────────────────────── */

    function ProgressBar({ pct }) {
      return (
        <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, height:3, background:'#14141c' }}>
          <div style={{ height:'100%', width:`${pct}%`, background:ACCENT, transition:'width 0.5s ease' }}/>
        </div>
      );
    }

    function Eyebrow({ children }) {
      return (
        <div style={{ fontSize:'0.7rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:16, display:'flex', alignItems:'center', gap:10, fontWeight:500 }}>
          <span style={{ width:28, height:1, background:ACCENT, opacity:0.5, flexShrink:0, display:'block' }}/>
          {children}
        </div>
      );
    }

    function StepIndicator({ current, total }) {
      return (
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.2em', textTransform:'uppercase', color:'#8888a0' }}>
          Part <span style={{ color:ACCENT, fontWeight:600 }}>{current}</span> of {total}
        </div>
      );
    }

    function ArrowRight({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>);
    }

    function ArrowLeft({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>);
    }

    function BackBtn({ onClick }) {
      return (
        <button onClick={onClick} style={{ display:'flex', alignItems:'center', gap:6, color:'#8888a0', background:'none', border:'none', cursor:'pointer', fontSize:'0.82rem' }}>
          <ArrowLeft size={15}/> Back
        </button>
      );
    }

    function BottomNav({ onBack, onNext, nextLabel = 'Continue' }) {
      return (
        <div style={{ display:'flex', justifyContent: onBack ? 'space-between' : 'flex-end', alignItems:'center', gap:16, marginTop:64, paddingTop:32, borderTop:'1px solid #1e1e2a' }}>
          {onBack && <BackBtn onClick={onBack}/>}
          <button onClick={onNext}
            style={{ display:'inline-flex', alignItems:'center', gap:9, padding:'13px 26px', borderRadius:12, fontSize:'0.875rem', fontWeight:600, border:'none', cursor:'pointer', background:`linear-gradient(135deg,${ACCENT},#d97706)`, color:'#fff', textAlign:'left' }}>
            {nextLabel} <ArrowRight/>
          </button>
        </div>
      );
    }

    function InsightCard({ label = 'Key Insight', children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}33`, borderRadius:18, padding:34, marginBottom:36, position:'relative' }}>
          <div style={{ fontSize:'0.68rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:14, fontWeight:600 }}>{label}</div>
          <p style={{ fontSize:'clamp(1.05rem,2.4vw,1.3rem)', lineHeight:1.72, color:'#e8e8ed', position:'relative' }}>{children}</p>
        </div>
      );
    }

    function Footer() { return <footer style={{ textAlign:'center', marginTop:56, color:'#8888a0', fontSize:'0.75rem' }}>© 2026 MindMapManifesto.com</footer>; }
    function PageWrapper({ children, maxWidth = 820 }) { return <div style={{ position:'relative', zIndex:1, maxWidth, margin:'0 auto', padding:'60px 24px 100px' }}>{children}</div>; }

    function Prose({ children }) {
      return <p style={{ fontSize:'clamp(0.95rem,2.1vw,1.1rem)', lineHeight:1.88, color:'rgba(220,215,240,0.72)', marginBottom:22 }}>{children}</p>;
    }

    function PullQuote({ children }) {
      return (
        <div style={{ borderLeft:`2px solid ${ACCENT}40`, paddingLeft:24, marginBottom:30, marginTop:4 }}>
          <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.2vw,1.18rem)', lineHeight:1.78, color:`${ACCENT}a0` }}>{children}</p>
        </div>
      );
    }

    /* a paper note with an optional label, title, intro line and closing line */
    function Card({ label, title, intro, outro, children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'26px 28px', marginBottom:30 }}>
          {label && <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:`${ACCENT}99`, marginBottom: title ? 8 : 16, fontWeight:600 }}>{label}</div>}
          {title && <h3 style={{ fontSize:'1.35rem', fontWeight:700, color:'#e8e8ed', marginBottom:14 }}>{title}</h3>}
          {intro && <p style={{ fontSize:'1rem', lineHeight:1.65, color:'#b8b8c8', marginBottom: children ? 16 : 0 }}>{intro}</p>}
          {children}
          {outro && <p style={{ fontSize:'1rem', lineHeight:1.65, color:'#b8b8c8', marginTop:16 }}>{outro}</p>}
        </div>
      );
    }

    function Points({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {items.map((t, i) => (
            <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
              <div style={{ width:5, height:5, borderRadius:'50%', background:ACCENT, flexShrink:0, opacity:0.6, marginTop:12 }}/>
              <p style={{ fontSize:'1rem', lineHeight:1.65, color:'rgba(220,215,240,0.78)' }}>{t}</p>
            </div>
          ))}
        </div>
      );
    }

    function Steps({ items, start = 1 }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {items.map((t, i) => (
            <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
              <div style={{ width:28, height:28, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, border:`1px solid ${ACCENT}55`, fontSize:'0.78rem', marginTop:1 }}>{i + start}</div>
              <p style={{ fontSize:'1rem', lineHeight:1.65, color:'rgba(220,215,240,0.78)' }}>{t}</p>
            </div>
          ))}
        </div>
      );
    }

    function Terms({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {items.map(([t, d], i) => (
            <div key={i} style={{ borderLeft:`2px solid ${ACCENT}4d`, paddingLeft:14 }}>
              <div style={{ fontWeight:700, fontSize:'1.1rem', color:'#e8e8ed', marginBottom:2 }}>{t}</div>
              <p style={{ fontSize:'0.95rem', color:'#8888a0', lineHeight:1.6 }}>{d}</p>
            </div>
          ))}
        </div>
      );
    }

    function Chapter({ children, n, label, title, nextLabel, onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <ProgressBar pct={n / PARTS.length * 100}/>
          <PageWrapper>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:56 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={n} total={PARTS.length}/>
            </nav>
            <div style={{ marginBottom:36, animation:'mmm-fadeUp 0.7s ease-out' }}>
              <Eyebrow>{label}</Eyebrow>
              <h1 style={{ fontSize:'clamp(1.9rem,4.6vw,2.95rem)', fontWeight:700, lineHeight:1.18, marginBottom:8, color:'#e8e8ed' }}>{title}</h1>
            </div>
            {children}
            <BottomNav onBack={onBack} onNext={onNext} nextLabel={nextLabel}/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 0: Landing ───────────────────────────────────────── */
    function LandingScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:820, display:'flex', flexDirection:'column', alignItems:'center', gap:36, animation:'mmm-reveal 1.5s cubic-bezier(0.16,1,0.3,1) forwards' }}>
            <div style={{ fontSize:'0.65rem', letterSpacing:'0.6em', color:'rgba(251,191,36,0.5)', textTransform:'uppercase', fontWeight:700 }}>On The Diary of a CEO</div>
            <div>
              <h1 style={{ fontSize:'clamp(2.8rem,10vw,6rem)', fontWeight:700, letterSpacing:'-0.02em', color:'white', marginBottom:10 }}>Alex Hormozi</h1>
              <div style={{ fontSize:'clamp(0.9rem,2.2vw,1.3rem)', fontWeight:300, color:'rgba(255,255,255,0.4)', letterSpacing:'0.1em' }}>Courage, Leverage, People · Thirty-Two Parts</div>
            </div>
            <div style={{ maxWidth:600, borderLeft:'2px solid rgba(251,191,36,0.3)', paddingLeft:26, textAlign:'left' }}>
              <p style={{ fontStyle:'italic', fontSize:'clamp(0.95rem,1.9vw,1.13rem)', lineHeight:1.8, color:'rgba(255,255,255,0.55)' }}>
                “I’d rather be a failure than a coward.” What beginners actually need, how to pick one thing and stay in it, how to build a team of A-players, and why hard work is the goal.
              </p>
            </div>
            <button onClick={onNext}
              style={{ background:'rgba(251,191,36,0.08)', border:'1px solid rgba(251,191,36,0.28)', borderRadius:9999, padding:'18px 52px', fontSize:'0.8rem', fontWeight:700, letterSpacing:'0.4em', textTransform:'uppercase', color:'white', cursor:'pointer' }}>
              Begin
            </button>
          </div>
        </div>
      );
    }

    /* ── Parts ───────────────────────────────────────────────────── */
    const PARTS = [
      {
        title: 'Courage, Not Tactics',
        body: <>
          <Prose>Acquisition.com’s books, videos and conversations are aimed at three groups: people getting a business off the ground (0 → 1), people scaling from $1M to $10M, and people getting from $10M to $100M, or exiting along the way. Hormozi’s pitch: some frameworks apply at all three stages, “deep and wide,” and if even one applies to your business, it could pull your career five years forward.</Prose>
          <Card label="What beginners need">
            <Terms items={[
              ['What they think they want', 'A tactic that gets the business started right away.'],
              ['What they actually need', 'The courage to be wrong, and to accept the shame of failing in front of people whose opinions they care about.'],
            ]}/>
          </Card>
          <InsightCard label="The upside of the prison">The harder it is for you to break out of your mental prison, real or imagined, <em>the more compelling your story is once you do,</em> because it resonates with more people.</InsightCard>
          <Prose>He wasn’t a natural entrepreneur: no lemonade stand, no failing at school. He graduated from Vanderbilt in three years, had a white-collar consulting job, and scored above Harvard’s median on the GMAT. The plan was a top business school, then consulting or investment banking, then private equity, with everyone’s approval along the way. But he looked at the people 20 years ahead of him on that path and didn’t want their lives.</Prose>
          <Prose>At 22 he had a paid-off condo overlooking the city, and for a period he hoped every night not to wake up the next day (he says he doesn’t mean that melodramatically). That was when his father was proudest of him. Living out his father’s dream had made him feel like he didn’t want to be alive.</Prose>
          <PullQuote>“His dream has to die in order for mine to live.”</PullQuote>
          <Prose>He was so afraid of his father’s judgment that he drove halfway across the country before calling to say he’d left. His father invited him to lunch to “talk about it,” and he had to say he was already gone. The relationship struggled for years. He took a minimum-wage job as a personal trainer, cleaning floors, to learn the gym business, and had to accept a possible future in which his father never spoke to him again. Not everyone gets to say “thank you, Mom and Dad, for always supporting me” at the Oscars. You might not either, and that’s not a reason not to do it.</Prose>
        </>,
      },
      {
        title: 'Fear, Cowardice and Courage',
        body: <>
          <Prose>Back then he read lots of business books but couldn’t use any of them, because he was too afraid.</Prose>
          <InsightCard label="A mile wide and an inch deep">That’s how his wife Leila describes fear. It looks like an ocean, but once you step in there’s <em>ground underneath,</em> other people on your path, and new friends to replace the ones you lose.</InsightCard>
          <Prose>He thinks that in about 90% of the universes where Alex Hormozi exists, he’s just a consultant somewhere. His big decisions often came when a parent died, which, he says, may make him “a coward” for needing death to decide. Realizing that has helped him make needed decisions faster.</Prose>
          <PullQuote>“You won’t die, and you might just live.”</PullQuote>
          <Card label="Fear, cowardice and courage">
            <Points items={[
              'People blame lacking X or Y, but it’s emotional. Humans are allergic to uncertainty and often prefer a certain misery.',
              'He uses the word “coward” on purpose. Being afraid only makes you a coward if you let the fear change your behavior away from what you want.',
              'Courage is acting despite fear, not without it.',
            ]}/>
          </Card>
          <PullQuote>“I’d rather be a failure than a coward.”</PullQuote>
        </>,
      },
      {
        title: 'When to Quit',
        body: <>
          <Card label="The math version">
            <Steps items={[
              'Save 3–6 months of personal expenses.',
              'Start something on the side that, in your limited spare time, matches your current income.',
              'Keep that up for 3–6 months.',
            ]}/>
          </Card>
          <Prose>That’s reasonable, but it’s almost never the real reason people don’t quit.</Prose>
          <Card label="Bartlett’s two reasons people quit">
            <Terms items={[
              ['It’s hard', 'Not a good enough reason.'],
              ['It isn’t moving you toward a meaningful goal', 'Running a marathon for a charity you care about: don’t quit. Running one for no reason: consider quitting.'],
            ]}/>
          </Card>
          <InsightCard label="Guaranteed bad vs. chance at good">Your current path guarantees an outcome you don’t want, just later. The new path at least has a chance. <em>Look at the alternate path you aren’t choosing.</em></InsightCard>
          <Card label="Fear lives in the vague" title="Play it out">
            <Terms items={[
              ['The vague version', '“I quit, it fails, I’m a failure, everyone hates me, I die.”'],
              ['The specific version', '“If the business fails, I’ll have a compelling story for business school. I can use the experience to get an equal or better job. The real loss is my savings, which isn’t a meaningful amount compared with what I want to earn. Worst case, I move back in with my parents or sleep on a friend’s couch or in a garage. My actual worst case is a cool story and some self-inflicted shame, because nobody else really cares.”'],
            ]}/>
          </Card>
          <Prose>Bartlett: the first version comes from the amygdala, the second from the prefrontal cortex. Hormozi: getting specific turns the amygdala off, because it can’t follow a chain of cause and effect. Later you’ll remember couch-surfing while chasing your dream as “the good old days.” Embarrassing things become funny with enough time, so you might as well let them be funny now. It works for any fear, like delivering bad news: play it out. Will they flip the table, cry, shout? You’ll find you’re ready for most outcomes.</Prose>
          <InsightCard label="Delay discounting works both ways">You set a 5 a.m. alarm at night because the pain is far away, and you put off quitting until “tomorrow” for 20 years. We massively discount <em>what a whole lifetime of misery would cost.</em></InsightCard>
        </>,
      },
      {
        title: 'Time and Leverage',
        body: <>
          <Prose>Andrew Wilkinson tweeted that every entrepreneur says “here’s the winning number for my lottery ticket,” but that drawing already happened. You can’t copy Apple or SpaceX. “First principles” gets said more than it gets understood: there are foundational truths of business, conditions change, and you apply the truths to your current conditions.</Prose>
          <InsightCard label="Time is the primary currency">Everyone trades time for dollars; some people are just more efficient at it. Even exchanges not priced in time happen over time. <em>The goal is the highest return on your time.</em></InsightCard>
          <Card label="Every business must do three things" outro="You want as much leverage as possible in each.">
            <Steps items={['Attract attention.', 'Convert attention.', 'Deliver.']}/>
          </Card>
          <Prose>The Acquisition.com logo is a triangle: a fulcrum for leverage, with supply and demand inside it. Supply and demand make a business, and leverage gets the most out of it. Assets include skills and resources. If you have nothing, you still have your brain, your hands and your time, which is why he’s a big fan of skill acquisition: informal, very tactical self-education.</Prose>
          <Card label="Leverage at each step">
            <Terms items={[
              ['Offer', 'Software or media is “make once, sell a thousand times.”'],
              ['Conversion', 'An automated checkout or video sales letter is more leverage than a salesperson on the phone.'],
              ['Advertising', 'One piece of content seen by a million people is more leverage than one-on-one outreach.'],
            ]}/>
          </Card>
          <PullQuote>Over time you go from low leverage to high leverage: the same input, far more output.</PullQuote>
        </>,
      },
      {
        title: 'The Three P’s',
        body: <>
          <Card label="Where business ideas come from">
            <Terms items={[
              ['Pain', 'A problem you’re experiencing.'],
              ['Past profession', 'A skill from a job. The most proven route, because the economy has already shown people will pay for it.'],
              ['Passion', 'Something you’d spend time on anyway.'],
            ]}/>
          </Card>
          <Prose>Every business can be broken into jobs (sales, marketing, customer success, support, product, design, web pages), and each one can be done fractionally. Learn one and you have a skill you can trade for money without a boss.</Prose>
          <InsightCard label="Why pain is an advantage">Exceptional products need deep knowledge of the customer. You get it through heavy research, or by <em>being the customer.</em> If you have a food allergy and can’t find pancakes you can eat, you make great allergy-friendly pancakes.</InsightCard>
          <Prose>Hormozi has had trouble breathing at night since eighth grade. He has tried every nasal product for a month at a time, including foreign ones and ones fans send him, and none has solved it, so he has a strong hypothesis about what’s wrong. As a kid he learned to fall asleep with his hand holding a nostril open.</Prose>
          <Card label="The kernel of popcorn" intro="An investor backed the founder of Regal Cinemas, who had one theater while cinemas were in decline, because he knew everything about the business, down to the cost of a kernel of popcorn. “This guy can’t fail.”"/>
          <Prose>Passion gives you deep understanding because you spend your free time on it. Profession is a shortcut: it’s economically proven, but if you quit because you didn’t like the work, you’re now doing it for yourself. Pain and passion are less proven, but sometimes have more upside.</Prose>
        </>,
      },
      {
        title: 'Missionaries, Not Mercenaries',
        body: <>
          <Prose>“20% more durable nasal strips” is far less compelling than the story of a kid who couldn’t breathe. That story is the TikTok and Instagram campaign for the next five years, Bartlett says. On Dragons’ Den, “I had ADHD, energy drinks made me crash, so I solved it myself” is almost impossible to argue with.</Prose>
          <Card label="Two kinds of founder">
            <Terms items={[
              ['Mercenaries', 'Use logic: market trends, surveys, timing. Some do make it work.'],
              ['Missionaries', 'Felt the problem themselves and don’t want anyone else to have it. They tend to make the most money.'],
            ]}/>
          </Card>
          <InsightCard label="Everyone wants to see obsession">A demonstration or a model is always more compelling than anything else, so building your narrative of why you care <em>is</em> the pitch. An investor might not care about kitchen utensils, but will see that the founder does, and assume others do too. Obsession is looked down on more in the UK than the US, he says, but the obsessed change the world, or at least their world.</InsightCard>
          <Prose>An Olympic nutritionist friend told him champions don’t have something others lack; they lack something others have: an off button. Everything in their life points toward one goal.</Prose>
          <Card label="Goals and scope">
            <Points items={[
              'All three P’s is ideal and makes failure very unlikely. You only need one.',
              'Passion can be anything, like model cars: make them, race-tune them, collect and flip them, make media about them.',
              'Be clear about what you want. A Mozi Tank guest, an IT worker who loves Dungeons & Dragons, just wants it to earn enough to quit IT. He won’t be a billionaire, and that isn’t the goal.',
              'The bigger the goal, the narrower the path. $10M is possible in almost any business, and $100M in almost any business given enough time. A trillion means some kind of tech, probably AI.',
              'Past about $100M there’s little you can’t do except buy bigger things. Around $25M covers the best restaurants, hotels and cars.',
            ]}/>
          </Card>
        </>,
      },
      {
        title: 'Winning Attention',
        body: <>
          <Prose>The question: how does a personal trainer win attention in 2025? First, don’t try to out-science the science people. A PhD who is already jacked is making content.</Prose>
          <InsightCard label="Your fingerprint">Your fingerprint is unique, and so are your life and experiences. There’s real advantage, real alpha, in leaning into being you. <em>You won’t beat Alex at being Alex, but you’ll beat him at being you.</em></InsightCard>
          <Prose>His own mix: philosophy, business (marketing, sales, conversion), a light sprinkle of fitness from his gym background, Leila, and dry or dark humor from consuming lots of comedy. The buckets are unique, and so are their proportions.</Prose>
          <Card label="Most products and services are commodities">
            <Points items={[
              'You probably aren’t much better than other trainers, but you are different. A brand premium makes people want to buy from you.',
              'The Prime drink example: if two products are basically equal and you like the creator better, you’ll buy theirs as long as prices are comparable.',
              'For a trainer: build content for the long term, and in the short term reach out to people you know with a compelling offer.',
            ]}/>
          </Card>
          <Card label="The courage to be yourself">
            <Points items={[
              'Bartlett’s favorite creators all have it. His own early posts were clichés (“everything happens for a reason”), and it took years to relax into being himself.',
              'When Alex took flak for an X post, Leila told him: “Never dilute yourself.” Far more people need the message than hate it. If you’re going to make a big difference, an equal and opposing force will reject it; that comes with the territory.',
              'A diluted version becomes everyone else’s content.',
              'Being unique means there’s no blueprint, so the risks and upside are unknown, which is why people copy instead. And once your audience knows your values, anything that departs from them feels less true.',
            ]}/>
          </Card>
        </>,
      },
      {
        title: 'Your Brand Is a Mosaic',
        body: <>
          <Prose>Mercy vs. justice, variety vs. consistency, respecting values vs. innovating: all are ideals, and they conflict. Whichever side you pick, the other side attacks you, and it feels terrible because they’re also right. “How much” is the real question, which is basically what politics is.</Prose>

              'You’ll change, so your brand will change. His first podcast was in July 2017, 90 days after he lost everything, so the whole journey from zero to a billion is documented. Episode 8 was “Stop Branding,” and his views have since changed. You’re allowed to learn; it just has to be gradual, and it will be if you’re always yourself.',

          <Prose>A mentor’s arc: in his 20s it was about the destination, in his 30s the journey, and in his 40s the company, meaning the people you do it with.</Prose>
          <InsightCard label="Combined horsepower">A company’s potential equals the combined intellectual horsepower of everyone in it. If you’re the smartest person and can do every job best, the company is capped at one person’s horsepower and one lifetime of experience. The proof: the richest people own small stakes in their companies, like Jensen Huang with about 4% of NVIDIA, Bezos with 7–9% of Amazon and Elon with about 20% of Tesla. <em>“It takes a lot of horses to pull a chariot to the moon.”</em></InsightCard>

              ['Price’s law (paraphrased)', 'The square root of headcount does about 50% of the work. In a 100-person company, 10 people create half the value.'],

            ]}/>
          </Card>
          <Prose>Building enterprise value means building the organization’s collective consciousness: its skills and how they work together toward an outcome. Standards rise over time, and some lessons (“it’s all about the people, stupid”) everyone seems to have to learn personally. He thinks it can be taught; he just hasn’t cracked it.</Prose>

          <Prose>For first-time founders these are unknown unknowns. Bartlett hired a friend from Prada as an accountant, and a man he met at a rap battle, a 30-year-old professional gamer, as marketing director. Three or four years in, he accidentally hired someone great and saw the impact.</Prose>

          <Prose>This is why bootstrapped founders often know more about more things: they had to learn them in order to teach them.</Prose>
          <InsightCard label="A-players hire A-players">Bartlett’s star hire, Casey, hired 10 people and nine became the best in the company. A C-player hired 10 and all were fired. <em>The higher the hire, the bigger the risk and reward.</em> A leader who lacks the skill or the culture fit can rot a whole branch, and you may have to cut out three-quarters of what’s underneath them.</InsightCard>

          </Card>
          <InsightCard label="Chris Rock’s process">Via David Perell: at small clubs, a full hour gets maybe five good minutes. He moves those to the front and tries 55 new minutes, and repeats, until it’s 60 straight minutes of laughs at Madison Square Garden, <em>and everyone calls it talent.</em> Writers work the same way.</InsightCard>
          <Prose>It’s usually many small things that add up to big returns. He apologizes for preaching, and says he gets “violent about skill acquisition.”</Prose>
        </>,
      },
      {
        title: 'Buy Back Your Time',
        body: <>
          <Prose>A founder came to Bartlett on track for a $30–50M business with no executive team, about to quit after posting on social media in tears, because she handled every problem herself. Founders in the $1–3M stage think the pain lasts forever. Bartlett calls the other side “the promised land”: once he accidentally hired someone great who took over the chaos (“Jenny in the office is mad at Dave about Saturday night”), he could think again.</Prose>
          <Card label="The time audit">
            <Steps items={[
              'Make a Google Sheet in 15-minute slots from about 5 a.m. to midnight.',
              'Set a kitchen timer for every 15 minutes and write one or two words about what you did. It’s usually the most productive week of your life, just from the awareness.',
              'After a week: “40% of my time goes to X. I can hire someone for that, and with 40% of my time back I could double the business.” Then look at the next 15%: delegate it, build a process, or keep doing it until it adds up to a full-time role.',
            ]}/>
          </Card>
          <InsightCard label="The much-hated fractional employee">That’s the founder: you keep pulling tasks onto your plate until there’s enough to hand to a full-time person. <em>Entrepreneurship is continually trading up what you trade your time for.</em> If someone else could do everything you do, you’d become an owner taking distributions; mission-driven founders then fill their plate with the next thing and repeat.</InsightCard>
          <Card label="“No one can do what I do”" intro="You won’t find a unicorn. But you can find a white horse, a rhinoceros for the horn, and fireflies for the sparkle. Three people focused on their own pieces can beat you doing all of it, and it’s less overwhelming emotionally."/>
        </>,
      },
      {
        title: 'More, Better, New',
        body: <>
          <Prose>Success traps us in the past. The blog guy didn’t want to move headcount away from what paid the bills. Today’s content will get old too, and we’ll become the dinosaurs if we don’t adapt.</Prose>
          <Card label="Google’s 70/20/10" intro="70% to the core business, 20% to adjacent bets, 10% to moonshots. (Hormozi credits Sergey with proving it mathematically.)"/>
          <Card label="The core four ways to advertise" intro="From $100M Leads. First, do more of them; small businesses do far less than they think.">
            <Steps items={['Post content.', 'Run ads.', 'Reach out to strangers.', 'Reach out to people you know.']}/>
          </Card>
          <InsightCard label="The flyer story">A mentor with 20 gyms used flyers. Hormozi put out 300, nothing happened, and he called, upset. “What was your test size?” Theirs was <em>5,000 flyers per test, then 5,000 a day</em> once they had a winner: about 150,000 a month against his 300.</InsightCard>
          <Prose>Small businesses mistake low volume for volatility. One sale here, another two weeks later, and it feels random; competitors doing a sale a day do in one day what you do in a month. “I want a personal brand.” “How much do you post?” “One or two a week.” His team posts about 450 pieces a week. People can’t imagine others putting out 2x, 10x or 1,000x more, but that’s usually why they get 1,000x more.</Prose>
          <Card label="The progression">
            <Terms items={[
              ['More', 'You hand out the flyers yourself, then pay two people to.'],
              ['Better', 'Improve the flyer, or the offer.'],
              ['New', 'Start Facebook ads: the 10%.'],
            ]}/>
          </Card>
          <Card label="Every business has three strategic buckets">
            <Steps items={[
              'Get more customers.',
              'Increase lifetime gross profit per customer.',
              'Reduce risk: anything that might stop 1 and 2.',
            ]}/>
          </Card>
          <Card label="Placing new bets">
            <Points items={[
              'New bets are often insurance (bucket 3). If YouTube becomes legacy TV and something like VR takes over, put 10–20% of profit into building a team for it while keeping the core running.',
              'Don’t move the stars running your core onto the new thing, or you’ll lose the core before the new thing works. Hire people who can build it.',
              'The CEO is the “flex player”: parachute into whichever department has the hardest problem, using your power to decide and spend on the spot. It’s unfair to expect your team to move as fast; you can write checks and say yes without a committee.',
            ]}/>
          </Card>
          <PullQuote>Strategy is just prioritization: unlimited opportunities, limited resources.</PullQuote>
        </>,
      },
      {
        title: 'Test Instead of Guessing',
        body: <>
          <Prose>A portfolio company with display slots in 400 supermarkets asked Bartlett which design to use. His answer: “I don’t know, and neither do you.” Make 100 versions, run them as Facebook ads, and win on your rate of experimentation, not on creative guesses. Creatives trained to be right struggle with this.</Prose>
          <Card label="Two kinds of questions not to ask other people">
            <Terms items={[
              ['Questions a spreadsheet can answer', 'About 30% of what he’s asked, like “Which product should I sell?”, is math: compare LTV to CAC and put resources where the ratio is highest.'],
              ['Questions a test can answer', 'Run the test.'],
            ]}/>
          </Card>
          <InsightCard label="Naming $100M Leads">He ran Instagram story polls for a week or two. “Promotions” vs. “advertising”: advertising won. “Advertising” vs. “marketing”: advertising. “Advertising” vs. “leads”: leads won, and kept winning. He tested the cover and subtitle the same way, and the book shows all the results. <em>People want the hole in the wall, not the drill:</em> leads, not advertising.</InsightCard>
          <Card label="The brick-and-mortar expansion trick" intro="Pick five candidate markets, spend about $1,000 running your best current promotion in each, and open where the cost per lead is lowest. Don’t spend $250k on studies and a buildout only to find leads are expensive there. It’s the best $5–10k you’ll spend, and a risk-bucket move."/>
        </>,
      },
      {
        title: 'Models, Not Mentors',
        body: <>
          <Prose>You don’t need a mentor, but certain behaviors raise your odds of success, and doing them sooner raises your odds of winning faster. Humanity stands on its ancestors’ shoulders: he doesn’t know how light bulbs or the internet work; he picks up the baton where others left it.</Prose>
          <InsightCard label="Think in models">What can you copy about their behavior? <em>Everything comes down to behavior.</em> In training, it’s changing what employees do. In advertising, it’s getting a stranger to take the desired action. That clears away a lot of fluff.</InsightCard>
          <Prose>On manifestation: a podcast host who said they “manifested this meeting” had actually made content consistently, and their assistant contacted his assistant. Take away the vibes and he’d still show up; take away the content and outreach and he wouldn’t. So one of these works and one doesn’t. He consumes as much Elon, Bezos and Zuckerberg as he can, to understand how they make decisions and apply it to his own situation.</Prose>
          <Card label="Seven Figure Sam" intro="After quitting, he drove across the country and showed up unannounced at the gym of a “gym guru” he’d found on Google: “I’m here to be mentored.” Sam said maybe tomorrow, and asked where he was staying. “I don’t know, that’s my car with all my stuff.” Sam let him stay at his house that night. Within weeks there was a paid meetup of gym owners using Sam’s system, and when the 22-year-old shared his plan, they corrected nearly everything:" outro="He opened his first gym on the back of their mistakes. How much was that worth? Years. He has always been willing to pay in whatever currency is required for knowledge he lacks, and it’s often free now; YouTube and Instagram were barely around then.">
            <Points items={[
              'Buy equipment secondhand, not retail: a tenth of the price.',
              'Skip the equipment people would fall off. Use sandbags: cheap, replaceable, good for hundreds of exercises.',
              'Halve the square footage.',
              'Never pay more than $1.50 per square foot (he’d planned $2).',
            ]}/>
          </Card>
          <InsightCard label="The $1M whiteboard">A conference speaker wrote $1,000,000 on a whiteboard, asked a woman her salary ($50,000), and subtracted: not knowing how to make $1M a year was costing her <em>$950,000 a year.</em> The value of a skill is the gap between where you are and where it would take you. If people valued that gap, in what they’d earn or the time they’d have, rather than by their current wallet, far more would invest in education.</InsightCard>
        </>,
      },
      {
        title: 'Parrots vs. Practitioners',
        body: <>
          <Card label="Two kinds of knowledge">
            <Terms items={[
              ['Declarative', 'Knowing about something: you can explain private equity.'],
              ['Procedural', 'Knowing how: you’ve done a deal. A hundred sales books teach less about selling than your first hundred sales calls.'],
            ]}/>
          </Card>
          <Prose>Get your 100 reps in fast, suck 100 times, find the 10 that sucked least, and repeat until you’re good. Entertainers hold attention; educators change behavior. Education sells time (“I spent all this time learning these four things so you don’t have to”), and it’s the only way to buy time: to time-warp into your future using other people’s experience. People pay in the currency they value least. Rich people value time more than money, so they pay money; poor people drive to 10 gas stations to save 10 cents.</Prose>
          <InsightCard label="Certainty comes from volume">Do so much volume that <em>it would be unreasonable for you to still be bad.</em> Write down the number: how many speeches before you couldn’t possibly suck? 10, 100, 1,000? Then focus everything on that, and review the top 10–20% every 10–20 reps. Volume without a feedback loop isn’t enough.</InsightCard>
          <Card label="The devil in the details" intro="A review of his YouTube videos showed the best ones opened with proof, promise and plan in the first 30 seconds. Then outliers added a picture (a visual of the plan), and then pain (the problem being solved). One sentence can cover several. That’s the difference between a 10k-view and a 1M-view video. When one flops, an expert says “it didn’t work because we did three of the five,” not “videos don’t work.” You only meet the devil in the details by doing an unreasonable amount of work."/>
          <Prose>If you can’t explain why you believe something, it isn’t your belief; it’s someone else’s. Most of what people say is parroted, which is fine (it’s how a 5-year-old learns), but a parrot doesn’t know what to do when conditions change. That’s “founder mode,” in Brian Chesky’s phrase: the founder knows why things were built, under what conditions each rule was made, and when to bend or break it. Later hires are parroting.</Prose>
          <InsightCard label="Distillation only works one way">Bartlett’s girlfriend’s book-summary app reduced a law from his book (the Feynman technique: learn, simplify for a 10-year-old, teach, go back if they don’t get it) to “writing is the best way to learn.” Without the story and the reasoning, you can’t apply it to new situations, so she deleted the app. <em>Feynman can break something down for a child, but a child can’t rebuild what Feynman did.</em></InsightCard>
        </>,
      },
      {
        title: 'When Competitors Copy You',
        body: <>
          <Prose>Copiers see your step 5, not steps 1–4, so they can’t predict step 6. Bartlett’s team says that if the thumbnail or the trailer is what makes them special, they’re screwed anyway: 99% of what they do is the invisible part of the iceberg, like culture and systems. Hormozi’s 56-minute “Mozi Tank” video took a huge amount of unseen work.</Prose>
          <Card label="How he got over it">
            <Steps items={[
              'The alternative is nobody copying you because nobody cares. Being copied comes with success.',
              'Copiers are, by definition, second. To lead, you can’t look at anyone else; you keep working out step 6.',
              'The moment you copy, you’ve admitted defeat and handed someone else the baton. In a winner-take-all attention economy, first place gets the spoils.',
            ]}/>
          </Card>
        </>,
      },
      {
        title: 'Hard Work Is the Goal',
        body: <>
          <Prose>Gym Launch had paid out about $40M in distributions before its sale. During the sale year you can’t change the company or start something new (no red dress), so he had almost nothing to do. It was one of the most miserable years of his life. Looking back at his favorite days, he had worked out, produced something, and done both with people he liked, and almost always worked many hours.</Prose>
          <InsightCard label="His thesis">“Work hard so that…” is still destination-driven. <em>Hard work is the goal.</em> Work hard on things worth doing, and then die.</InsightCard>
          <PullQuote>“My life is not a sermon, it’s a documentary.” Live however you want, and try this if you’re dissatisfied.</PullQuote>
          <Card label="How he works">
            <Points items={[
              'Writing books makes him happiest. It isn’t happy in the moment (rubbing his forehead, discarding frameworks because “some kid in Afghanistan will get stuck on this step”), but the challenge roughly matches his skill, and when it clicks: “That’s it, fight me.”',
              'No seven-day calendar or fixed hours. He works until his output drops sharply from fatigue, sleeps, and after 9, 20 or 30 straight days, if he has no gas, takes the whole day off, whatever day it is.',
              'Jesse Itzler has a photo of his kid finishing a race holding up a zero: nothing left in the tank. From 300: “Come back with your shield or on it.” He can’t imagine a better way to go than doing what he loves.',
              'His heroes: Warren Buffett, and Charlie Munger, who worked until the day he died.',
            ]}/>
          </Card>
          <InsightCard label="Absolute freedom means 100% responsibility">Wherever you point the blame is where the power goes. Blame your parents or your boss and they have power over your life; <em>blame yourself and at least you can change it.</em></InsightCard>
          <Prose>For him, love, happiness and work are all one life, and he likes it that way. If his priorities change, he’ll change. If you want to spend all your time with family and not care much about work, congratulations, you won; just don’t assume everyone wins the same way. The message is for people like him who were told something was wrong with them. If “wrong” means “not normal,” then yes. Being different is okay, and accepting that opens up a whole new range of possibility.</Prose>
        </>,
      },
      {
        title: 'Drop the “Should”',
        body: <>
          <Prose>From 18 to 22 he was very depressed and looked into religion and much else. His mantra became “f*** happiness.” Chasing happiness kept it outside him, a carrot he could never reach. Once he just worked and did what he wanted, years later he looked up and realized he liked his life.</Prose>
          <InsightCard label="“Should” is the root of all pain">The big human problem is expecting life to be different than it is: the gap between what we think should happen and what does. He tries to get rid of unconditional shoulds, for himself and for others (“he should have kids,” “she should work less”). <em>According to what?</em> Conditional advice, like “if you want more money, consider X,” is different.</InsightCard>
          <Prose>He got out of a relationship over work. When he started dating Leila, he said he wasn’t willing to change how he works: his relationship with his work and goals is the most satisfying and sacred one he has, because it’s a relationship with himself. (“Sweetie, you’ve been working too much.” According to what?) First date: four hours talking business. Second date: “I’ll be working all day; it’d be cool if you worked next to me.” She worked on her own thing beside him, and eventually joined his.</Prose>
          <Card label="Good days in a row" intro="A former boss’s line: the key to happiness is living as many days in a row like your good weekend as you can. What are my good days, and how do I string them together? He gets attacked for not enjoying vacations. During a Christmas week in Mexico, when no one works and vendors stop, his conclusion was: “This is for other people, not me, and that’s okay.”"/>
          <Card label="“Why do you think life needs to be meaningful?”" intro="He asked someone who had sold a company for hundreds of millions how they find meaning, and got that question back. It shook him: he’d had an unspoken demand of the universe that life should be meaningful and he should be happy. History forgets almost everyone within a century or a millennium, so he focuses on what he can control: doing his best to make other people’s lives better, and his own along the way, as a choice rather than a demand. Trying to drop the demand is when he first experienced meaning and joy. He keeps them out of his head so he can be inside them instead of chasing them."/>
          <PullQuote>We question all our beliefs except the ones we truly believe, and those we never think to question. (His favorite quote, a version of Orson Scott Card, and maybe his epitaph.)</PullQuote>
          <Prose>Bartlett’s takeaway: great content comes from the courage to be yourself, and happiness takes the same courage. Your path to happiness will be as unique as you are, and you have to withstand everyone else’s “shoulds.” Hearing Alex say he’s different (he doesn’t enjoy holidays, he works obsessively) made Bartlett’s own differences feel acceptable and eased his guilt about loving his work. He asked Alex to keep having the courage to be himself for the “weirdos” who feel they don’t fit. “I make it for them.”</Prose>
        </>,
      },
      {
        title: 'The Meaning of Life',
        body: <>
          <Prose>Asked the closing question, he jokes: “42.” His real answer is learning. Learning is being exposed to new conditions that change your behavior over time; you’re different now than 10 years ago because of it. A business’s meaning is its output (for SpaceX, people reaching Mars), and the output of human experience is learning. It happens whether you want it or not.</Prose>
          <InsightCard label="The real question">Whether you’re <em>learning the things you want.</em></InsightCard>
          <Card label="In one paragraph" intro="Get past the fear by making it specific. Pick one idea from pain, profession or passion, and stay in it through the valley of despair, because restarting resets a 10-year clock. Spend your time on the highest-leverage things: hire and train A-players (barrels), give fast and specific feedback (kind, not nice), and have hard conversations early. Do far more volume than seems reasonable, learn from the top 10% of your reps, and test instead of guessing. Model people who are ahead of you and buy back time through education. And define success and happiness for yourself, without other people’s “shoulds.”"/>
          <Card label="Mentioned">
            <Points items={[
              'His YouTube video “Building a $1 Million Business for a Stranger in 56 Minutes,” the Mozi Tank format: a more actionable Shark Tank.',
              'His books $100M Offers and $100M Leads, with volume 3 coming.',
              'Acquisition.com.',
            ]}/>
          </Card>
        </>,
      },
    ].map((p, i) => ({ ...p, label: `Part ${spell(i + 1)} · ${SERIES}` }));

    /* ── Completion Screen ──────────────────────────────────────── */
    function CompletionScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', position:'relative', overflow:'hidden' }} onClick={onNext}>
          {[0, 1, 2].map(i => (<div key={i} style={{ position:'absolute', top:'50%', left:'50%', width:100+i*90, height:100+i*90, borderRadius:'50%', border:`1px solid ${['rgba(251,191,36,0.35)','rgba(244,114,182,0.25)','rgba(6,182,212,0.18)'][i]}`, animation:`waveExpand 5s ease-out ${i*1.6}s infinite` }}/>))}
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:760 }}>
            <div style={{ fontSize:'0.62rem', letterSpacing:'0.5em', textTransform:'uppercase', color:'rgba(251,191,36,0.4)', marginBottom:36 }}>Complete · Alex Hormozi</div>
            <h1 style={{ fontSize:'clamp(2.2rem,8vw,5rem)', fontWeight:700, color:'#e8e8ed', letterSpacing:1, marginBottom:32, animation:'mmm-reveal 2s ease-out 0.5s both', lineHeight:1.1 }}>MORE OF THE SAME,<br/>AND BETTER</h1>
            <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.4vw,1.25rem)', color:'rgba(210,200,255,0.55)', lineHeight:1.8, marginBottom:44, animation:'mmm-fadeUp 1.5s ease-out 1.5s both' }}>Make the fear specific.<br/>Pick one thing and stay through the valley.<br/>Do an unreasonable number of reps.</p>
            <div style={{ background:'rgba(251,191,36,0.06)', border:'1px solid rgba(251,191,36,0.15)', borderRadius:16, padding:'26px 36px', maxWidth:600, margin:'0 auto 48px', animation:'mmm-fadeUp 1.5s ease-out 2.2s both' }}>
              <p style={{ fontStyle:'italic', fontSize:'1.05rem', color:'rgba(220,200,255,0.72)', lineHeight:1.8 }}>“You won’t die, and you might just live.”</p>
              <div style={{ fontSize:'0.6rem', letterSpacing:'0.25em', textTransform:'uppercase', color:'rgba(251,191,36,0.3)', marginTop:12 }}>Alex Hormozi · The Diary of a CEO</div>
            </div>
            <div style={{ fontSize:'0.72rem', letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(255,255,255,0.18)', animation:'mmm-blink 2.5s ease-in-out 3.5s infinite' }}>*click anywhere to restart*</div>
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────────── */
    function App() {
      const [screen, setScreen] = useState(0);
      const go = n => setScreen(n);
      useEffect(() => { window.scrollTo(0, 0); }, [screen]);

      if (screen === 0) return <LandingScreen onNext={() => go(1)}/>;
      if (screen > PARTS.length) return <CompletionScreen onNext={() => go(0)}/>;
      const part = PARTS[screen - 1];
      const next = PARTS[screen];
      return (
        <Chapter key={screen} n={screen} label={part.label} title={part.title} nextLabel={next ? next.title : 'Finish'} onBack={() => go(screen - 1)} onNext={() => go(screen + 1)}>
          {part.body}
        </Chapter>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script src="../app-nav.js"></script>
