<body>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SERIES = 'Da Vinci';
    const ACCENT = '#d6a35c';
    const NUMBERS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty','Twenty-One','Twenty-Two'];

    /* ── Shared Components ───────────────────────────────────────── */

    function ProgressBar({ pct }) {
      return (
        <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, height:3, background:'#14141c' }}>
          <div style={{ height:'100%', width:`${pct}%`, background:ACCENT, transition:'width 0.5s ease' }}/>
        </div>
      );
    }

    function Eyebrow({ children }) {
      return (
        <div style={{ fontSize:'0.7rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:16, display:'flex', alignItems:'center', gap:10, fontWeight:500 }}>
          <span style={{ width:28, height:1, background:ACCENT, opacity:0.5, flexShrink:0, display:'block' }}/>
          {children}
        </div>
      );
    }

    function StepIndicator({ current, total }) {
      return (
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.2em', textTransform:'uppercase', color:'#8888a0' }}>
          Part <span style={{ color:ACCENT, fontWeight:600 }}>{current}</span> of {total}
        </div>
      );
    }

    function ArrowRight({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>);
    }

    function ArrowLeft({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>);
    }

    function BackBtn({ onClick }) {
      return (
        <button onClick={onClick} style={{ display:'flex', alignItems:'center', gap:6, color:'#8888a0', background:'none', border:'none', cursor:'pointer', fontSize:'0.82rem' }}>
          <ArrowLeft size={15}/> Back
        </button>
      );
    }

    function BottomNav({ onBack, onNext, nextLabel = 'Continue' }) {
      return (
        <div style={{ display:'flex', justifyContent: onBack ? 'space-between' : 'flex-end', alignItems:'center', gap:16, marginTop:64, paddingTop:32, borderTop:'1px solid #1e1e2a' }}>
          {onBack && <BackBtn onClick={onBack}/>}
          <button onClick={onNext}
            style={{ display:'inline-flex', alignItems:'center', gap:9, padding:'13px 26px', borderRadius:12, fontSize:'0.875rem', fontWeight:600, border:'none', cursor:'pointer', background:`linear-gradient(135deg,${ACCENT},#9a6b2f)`, color:'#fff', textAlign:'left' }}>
            {nextLabel} <ArrowRight/>
          </button>
        </div>
      );
    }

    function InsightCard({ label = 'Key Insight', children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}33`, borderRadius:18, padding:34, marginBottom:36, position:'relative' }}>
          <div style={{ fontSize:'0.68rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:14, fontWeight:600 }}>{label}</div>
          <p style={{ fontSize:'clamp(1.05rem,2.4vw,1.3rem)', lineHeight:1.72, color:'#e8e8ed', position:'relative' }}>{children}</p>
        </div>
      );
    }

    function Footer() { return <footer style={{ textAlign:'center', marginTop:56, color:'#8888a0', fontSize:'0.75rem' }}>© 2026 MindMapManifesto.com</footer>; }
    function PageWrapper({ children, maxWidth = 820 }) { return <div style={{ position:'relative', zIndex:1, maxWidth, margin:'0 auto', padding:'60px 24px 100px' }}>{children}</div>; }

    function Prose({ children }) {
      return <p style={{ fontSize:'clamp(0.95rem,2.1vw,1.1rem)', lineHeight:1.88, color:'rgba(220,215,240,0.72)', marginBottom:22 }}>{children}</p>;
    }

    function PullQuote({ children }) {
      return (
        <div style={{ borderLeft:`2px solid ${ACCENT}40`, paddingLeft:24, marginBottom:30, marginTop:4 }}>
          <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.2vw,1.18rem)', lineHeight:1.78, color:`${ACCENT}a0` }}>{children}</p>
        </div>
      );
    }

    /* a paper note with an optional label, title and intro line */
    function Card({ label, title, intro, children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'26px 28px', marginBottom:30 }}>
          {label && <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:`${ACCENT}99`, marginBottom: title ? 8 : 16, fontWeight:600 }}>{label}</div>}
          {title && <h3 style={{ fontSize:'1.35rem', fontWeight:700, color:'#e8e8ed', marginBottom:14 }}>{title}</h3>}
          {intro && <p style={{ fontSize:'1rem', lineHeight:1.65, color:'#b8b8c8', marginBottom: children ? 16 : 0 }}>{intro}</p>}
          {children}
        </div>
      );
    }

    function Points({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {items.map((t, i) => (
            <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
              <div style={{ width:5, height:5, borderRadius:'50%', background:ACCENT, flexShrink:0, opacity:0.6, marginTop:12 }}/>
              <p style={{ fontSize:'1rem', lineHeight:1.65, color:'rgba(220,215,240,0.78)' }}>{t}</p>
            </div>
          ))}
        </div>
      );
    }

    function Steps({ items, start = 1 }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {items.map((t, i) => (
            <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
              <div style={{ width:28, height:28, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, border:`1px solid ${ACCENT}55`, fontSize:'0.78rem', marginTop:1 }}>{i + start}</div>
              <p style={{ fontSize:'1rem', lineHeight:1.65, color:'rgba(220,215,240,0.78)' }}>{t}</p>
            </div>
          ))}
        </div>
      );
    }

    function Terms({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {items.map(([t, d], i) => (
            <div key={i} style={{ borderLeft:`2px solid ${ACCENT}4d`, paddingLeft:14 }}>
              <div style={{ fontWeight:700, fontSize:'1.1rem', color:'#e8e8ed', marginBottom:2 }}>{t}</div>
              <p style={{ fontSize:'0.95rem', color:'#8888a0', lineHeight:1.6 }}>{d}</p>
            </div>
          ))}
        </div>
      );
    }

    function Chapter({ children, n, label, title, nextLabel, onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <ProgressBar pct={n / PARTS.length * 100}/>
          <PageWrapper>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:56 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={n} total={PARTS.length}/>
            </nav>
            <div style={{ marginBottom:36, animation:'mmm-fadeUp 0.7s ease-out' }}>
              <Eyebrow>{label}</Eyebrow>
              <h1 style={{ fontSize:'clamp(1.9rem,4.6vw,2.95rem)', fontWeight:700, lineHeight:1.18, marginBottom:8, color:'#e8e8ed' }}>{title}</h1>
            </div>
            {children}
            <BottomNav onBack={onBack} onNext={onNext} nextLabel={nextLabel}/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 0: Landing ───────────────────────────────────────── */
    function LandingScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:820, display:'flex', flexDirection:'column', alignItems:'center', gap:36, animation:'mmm-reveal 1.5s cubic-bezier(0.16,1,0.3,1) forwards' }}>
            <div style={{ fontSize:'0.65rem', letterSpacing:'0.6em', color:'rgba(214,163,92,0.55)', textTransform:'uppercase', fontWeight:700 }}>The Circle · The Square · The Man</div>
            <div>
              <h1 style={{ fontSize:'clamp(2.8rem,10vw,6rem)', fontWeight:700, letterSpacing:'-0.02em', color:'white', marginBottom:10 }}>Da Vinci and the Perfect Man</h1>
              <div style={{ fontSize:'clamp(0.9rem,2.2vw,1.3rem)', fontWeight:300, color:'rgba(255,255,255,0.4)', letterSpacing:'0.1em' }}>The Vitruvian Man, the Universal Man and How to Think Like Leonardo · {PARTS.length} Parts</div>
            </div>
            <div style={{ maxWidth:600, borderLeft:'2px solid rgba(214,163,92,0.3)', paddingLeft:26, textAlign:'left' }}>
              <p style={{ fontStyle:'italic', fontSize:'clamp(0.95rem,1.9vw,1.13rem)', lineHeight:1.8, color:'rgba(255,255,255,0.55)' }}>
                One sheet of paper, one naked man, a circle and a square. Leonardo drew the perfect body, and spent his life trying to become the perfect mind.
              </p>
            </div>
            <button onClick={onNext}
              style={{ background:'rgba(214,163,92,0.08)', border:'1px solid rgba(214,163,92,0.28)', borderRadius:9999, padding:'18px 52px', fontSize:'0.8rem', fontWeight:700, letterSpacing:'0.4em', textTransform:'uppercase', color:'white', cursor:'pointer' }}>
              Begin
            </button>
          </div>
        </div>
      );
    }

    /* the circle and the square, with their two different centres */
    function CircleSquare() {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'24px 20px', marginBottom:30 }}>
          <svg viewBox="0 -30 280 310" style={{ width:'100%', maxWidth:340, display:'block', margin:'0 auto' }} role="img" aria-label="A square and a circle overlapping: the circle is centred on the navel, the square on the groin, so the circle rises above the square while both touch the ground at the feet.">
            <rect x="40" y="20" width="200" height="200" fill="none" stroke="#8a5a24" strokeWidth="2"/>
            <circle cx="140" cy="99" r="121" fill="none" stroke="#1a1918" strokeWidth="1.5"/>
            <circle cx="140" cy="99" r="4.5" fill="#1a1918"/>
            <circle cx="140" cy="120" r="4.5" fill="#8a5a24"/>
            <circle cx="30" cy="246" r="4.5" fill="#1a1918"/>
            <text x="42" y="251" fill="#1a1918" fontSize="14">navel: centre of the circle</text>
            <circle cx="30" cy="270" r="4.5" fill="#8a5a24"/>
            <text x="42" y="275" fill="#8a5a24" fontSize="14">groin: centre of the square</text>
          </svg>
        </div>
      );
    }

    /* ── Parts ───────────────────────────────────────────────────── */
    const PARTS = [
      {
        title: 'One Sheet of Paper',
        body: <>
          <Prose>Around 1490, in Milan, Leonardo da Vinci took a sheet about the size of a school notebook page, 34.6 by 25.5 centimetres, and drew a naked man in pen and ink. The man stands in two poses at once: arms straight out and feet together inside a square, arms raised and legs apart inside a circle. Above and below, Leonardo filled the page with notes in his mirror writing.</Prose>
          <Prose>He never gave it a title. We call it the <strong>Vitruvian Man</strong>, after the Roman architect whose idea it illustrates. It is kept in the Gallerie dell’Accademia in Venice, shown only rarely because light damages it, and it has become one of the most copied images on Earth: on coins, textbooks, hospital logos and gym walls.</Prose>
          <InsightCard label="The question on the page">Is there a perfect human body, and is it built from the same rules as the universe? Leonardo’s answer was a drawing. <em>The rest of his life was a longer answer.</em></InsightCard>
        </>,
      },
      {
        title: 'Vitruvius’s Riddle',
        body: <>
          <Prose>Fifteen centuries before Leonardo, the Roman architect Vitruvius wrote <em>De architectura</em>, the only full book on architecture to survive from antiquity. In Book Three, on temples, he argued that a building should have the proportions of a well-made man, because nature had designed the human body so that its parts fit the whole.</Prose>
          <PullQuote>If a man lies on his back with his hands and feet spread out, and a compass is centred on his navel, his fingers and toes will touch the circle. And the body fits a square too: from the soles of the feet to the top of the head equals the width of the outstretched arms.</PullQuote>
          <Card label="Two famous figures">
            <Terms items={[
              ['Homo ad circulum', 'Man in the circle: the body, spread out, touches a circle centred on the navel.'],
              ['Homo ad quadratum', 'Man in the square: height equals arm span, so the body fills a square.'],
            ]}/>
          </Card>
          <Prose>Renaissance artists loved the idea and kept trying to draw it. Most of their attempts look awkward: they put the circle and the square on the same centre, and the man ends up stretched, squashed or with arms of impossible length.</Prose>
        </>,
      },
      {
        title: 'Leonardo’s Solution',
        body: <>
          <Prose>Leonardo’s trick was simple and it is the reason his version is the one everybody knows: <strong>the circle and the square do not share a centre.</strong> The circle is centred on the navel. The square is centred lower, at the groin. Both touch the ground at the feet, but the circle rises above the square.</Prose>
          <CircleSquare/>
          <Prose>Then he measured real bodies instead of trusting the Roman text. Where Vitruvius’s numbers didn’t match living people, Leonardo quietly corrected them. And by drawing two poses on top of each other, he made one still image suggest movement: count the arm and leg combinations and the figure holds many positions at once.</Prose>
          <InsightCard label="The lesson in the method">Everyone before him copied the authority. Leonardo checked the authority <em>against reality</em>, and reality won. That is the whole Renaissance in one drawing.</InsightCard>
        </>,
      },
      {
        title: 'The Measures of a Man',
        body: <>
          <Prose>The mirror-written notes on the sheet are a list of ratios, all measured against the full height of the body. A few of them:</Prose>
          <Card label="From Leonardo’s notes">
            <Terms items={[
              ['Arm span', 'Equal to the height.'],
              ['Hairline to chin', 'One tenth of the height.'],
              ['Chin to the top of the head', 'One eighth.'],
              ['Width of the shoulders', 'One quarter.'],
              ['Elbow to fingertip', 'One quarter.'],
              ['The hand', 'One tenth.'],
              ['The foot', 'One seventh.'],
              ['The face', 'Divided into three equal parts: hairline to eyebrows, eyebrows to the bottom of the nose, nose to chin.'],
            ]}/>
          </Card>
          <Prose>Try the first one on yourself: stand against a wall with your arms out and have someone mark your fingertips. For most adults, arm span and height come out within a few centimetres of each other.</Prose>
          <InsightCard label="A myth to drop">You will often read that the Vitruvian Man is built on the golden ratio. It isn’t. Leonardo’s notes use simple whole-number fractions like a quarter, a seventh and a tenth. <em>The golden ratio was pinned on the drawing much later.</em></InsightCard>
        </>,
      },
      {
        title: 'The Small World',
        body: <>
          <Prose>Why a circle and a square? For a Renaissance mind they were not just shapes. The circle, with no beginning and no end, stood for the heavens and the divine. The square, with its four corners and four directions, stood for the earth and the material world.</Prose>
          <InsightCard label="Microcosm">A human being who fits both is a bridge: <em>made of earth, shaped like heaven.</em> Leonardo called the body a “cosmography of the lesser world”: the universe in miniature.</InsightCard>
          <Card label="He took the idea literally">
            <Points items={[
              'The bones are the frame of the earth, the rock.',
              'The flesh is the soil.',
              'The blood and its vessels are the rivers and the sea.',
              'The breath, rising and falling, is the tide.',
            ]}/>
          </Card>
          <Prose>It sounds poetic, but it drove real science. If the body follows the same rules as the world, then studying water teaches you about blood, and studying blood teaches you about water. Leonardo did both.</Prose>
        </>,
      },
      {
        title: 'The Universal Man',
        body: <>
          <Prose>The Renaissance had a name for the ideal person: <strong>l’uomo universale</strong>, the universal man, someone developed in every direction at once. Leonardo is the example everyone reaches for.</Prose>
          <Card label="One life">
            <Terms items={[
              ['Painter', 'The Mona Lisa, The Last Supper, and fewer than twenty surviving paintings in all.'],
              ['Engineer', 'Canals, bridges, fortifications, war machines, and designs for flying machines centuries early.'],
              ['Anatomist', 'He dissected around thirty bodies and drew the heart, the skull and the fetus in the womb with an accuracy no one matched for generations.'],
              ['Scientist', 'Water, light, optics, geology, plants, the flight of birds.'],
              ['Musician and showman', 'He played the lyre and designed stage machinery for court festivals.'],
            ]}/>
          </Card>
          <Prose>The surprising part: he had almost no formal education. He was born in 1452, the illegitimate son of a notary, in the village of Vinci. He never learned Latin properly at school and called himself <em>omo sanza lettere</em>, a man without letters. Everything else he taught himself, mostly by looking.</Prose>
          <InsightCard label="The perfect man, revised">The man in the drawing is perfect in proportion. The man who drew it was perfect in a different way: <em>not finished, but endlessly growing.</em></InsightCard>
        </>,
      },
      {
        title: 'The Notebooks',
        body: <>
          <Prose>Leonardo carried a small notebook on his belt and wrote in it constantly. More than 7,000 pages survive, probably a fraction of what he filled. Most of it is written right to left in mirror script; he was left-handed, and it may simply have kept the ink from smudging.</Prose>
          <Card label="What’s in them">
            <Points items={[
              'Faces of strangers he saw in the street, sketched on the spot.',
              'Shopping lists and money owed next to studies of the moon.',
              'To-do lists of questions: describe the tongue of the woodpecker; why fish swim faster than birds fly; how the eyes see.',
              'Inventions that worked, inventions that never could, and plenty he simply abandoned.',
            ]}/>
          </Card>
          <InsightCard label="The real method">The notebooks show the mind behind the perfect man: <em>a habit, not a gift.</em> Look closely, write it down, ask why, draw it, ask again.</InsightCard>
        </>,
      },
      {
        title: 'The Seven Principles',
        body: <>
          <Prose>In 1998 the author Michael Gelb, in <em>How to Think Like Leonardo da Vinci</em>, distilled Leonardo’s habits into seven principles. They are a modern summary, not Leonardo’s own list, but each one is drawn straight from the notebooks.</Prose>
          <Card label="The seven">
            <Terms items={[
              ['Curiosità', 'An insatiable curiosity: keep asking questions, especially the ones that seem childish.'],
              ['Dimostrazione', 'Test knowledge through experience and be willing to learn from mistakes.'],
              ['Sensazione', 'Sharpen the senses, above all sight. Leonardo complained that people “look without seeing.”'],
              ['Sfumato', 'Literally “gone up in smoke”: the willingness to sit with ambiguity and uncertainty without forcing an answer.'],
              ['Arte / Scienza', 'Balance logic and imagination; whole-brain thinking.'],
              ['Corporalità', 'Cultivate grace, fitness and poise. Leonardo was known for his strength and his elegance.'],
              ['Connessione', 'Recognise that everything connects to everything else: systems thinking.'],
            ]}/>
          </Card>
          <PullQuote>Notice that the list begins with a question and ends with a web. The perfect man is not a fixed shape. He is a way of looking that keeps widening.</PullQuote>
          <Prose>See the seven crossed with the seven voices, the seven sins and the seven virtues in <a href="../seven-voices-matrix/index.html">the seven voices matrix</a>.</Prose>
        </>,
      },
      {
        title: 'Becoming Vitruvian',
        body: <>
          <Prose>You can’t change the length of your arms. You can borrow the mind that drew them.</Prose>
          <Card label="Seven small practices">
            <Steps items={[
              'Carry a notebook, paper or phone, and write down one question a day that you can’t answer yet.',
              'Pick something ordinary, a leaf, a hand, a cup, and draw it for five minutes. You will see more than you ever noticed.',
              'Check one thing you believe because an authority said it. Leonardo checked Vitruvius.',
              'When a problem has no clear answer, give it a day instead of forcing one. That is sfumato.',
              'Mix modes: walk after thinking, write after drawing, reason after imagining.',
              'Train the body. Leonardo’s ideal was a sound mind in a capable, graceful body.',
              'Every week, connect two things that seem unrelated, the way he linked rivers and blood.',
            ]}/>
          </Card>
          <InsightCard label="The circle and the square, again">The square is what you are made of: body, habits, limits. The circle is what you reach for. <em>The perfect man is the one who keeps stretching between the two.</em></InsightCard>
          <Prose>For how repeated practice turns into automatic skill, see <a href="../sunflower-seeds/index.html">sunflower seeds and flow</a>; for how the mind takes on new beliefs, see <a href="../21-rules-mind/index.html">the rules of the mind</a>.</Prose>
        </>,
      },
    ].map((p, i) => ({ ...p, label: `Part ${NUMBERS[i + 1]} · ${SERIES}` }));

    /* ── Completion Screen ──────────────────────────────────────── */
    function CompletionScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', position:'relative', overflow:'hidden' }} onClick={onNext}>
          {[0, 1, 2].map(i => (<div key={i} style={{ position:'absolute', top:'50%', left:'50%', width:100+i*90, height:100+i*90, borderRadius:'50%', border:`1px solid ${['rgba(214,163,92,0.35)','rgba(232,232,237,0.2)','rgba(214,163,92,0.15)'][i]}`, animation:`waveExpand 5s ease-out ${i*1.6}s infinite` }}/>))}
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:760 }}>
            <div style={{ fontSize:'0.62rem', letterSpacing:'0.5em', textTransform:'uppercase', color:'rgba(214,163,92,0.45)', marginBottom:36 }}>Complete · Da Vinci</div>
            <h1 style={{ fontSize:'clamp(2.2rem,8vw,5rem)', fontWeight:700, color:'#e8e8ed', letterSpacing:1, marginBottom:32, animation:'mmm-reveal 2s ease-out 0.5s both', lineHeight:1.1 }}>LOOK.<br/>ASK.<br/>DRAW.</h1>
            <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.4vw,1.25rem)', color:'rgba(240,225,200,0.55)', lineHeight:1.8, marginBottom:44, animation:'mmm-fadeUp 1.5s ease-out 1.5s both' }}>Made of earth, shaped like heaven.<br/>The perfect man is not a measurement,<br/>but a way of seeing.</p>
            <div style={{ background:'rgba(214,163,92,0.06)', border:'1px solid rgba(214,163,92,0.15)', borderRadius:16, padding:'26px 36px', maxWidth:600, margin:'0 auto 48px', animation:'mmm-fadeUp 1.5s ease-out 2.2s both' }}>
              <p style={{ fontStyle:'italic', fontSize:'1.05rem', color:'rgba(240,225,200,0.72)', lineHeight:1.8 }}>“Learning never exhausts the mind.” — attributed to Leonardo</p>
            </div>
            <div style={{ fontSize:'0.72rem', letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(255,255,255,0.18)', animation:'mmm-blink 2.5s ease-in-out 3.5s infinite' }}>*click anywhere to restart*</div>
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────────── */
    function App() {
      const [screen, setScreen] = useState(0);
      const go = n => setScreen(n);
      useEffect(() => { window.scrollTo(0, 0); }, [screen]);

      if (screen === 0) return <LandingScreen onNext={() => go(1)}/>;
      if (screen > PARTS.length) return <CompletionScreen onNext={() => go(0)}/>;
      const part = PARTS[screen - 1];
      const next = PARTS[screen];
      return (
        <Chapter key={screen} n={screen} label={part.label} title={part.title} nextLabel={next ? next.title : 'Finish'} onBack={() => go(screen - 1)} onNext={() => go(screen + 1)}>
          {part.body}
        </Chapter>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script src="../app-nav.js"></script>
</body>
</html>
