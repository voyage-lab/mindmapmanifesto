<!DOCTYPE html>

<head>

<body>
  <nav class="mb-nav" aria-label="Series navigation"><a href="../index.html">← back to mind x brain</a></nav>

  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SERIES = 'The SDR Playbook';
    const ACCENT = '#818cf8';
    const NUMBERS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty'];

    /* ── Shared Components ───────────────────────────────────────── */

    function ProgressBar({ pct }) {
      return (
        <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, height:3, background:'#14141c' }}>
          <div style={{ height:'100%', width:`${pct}%`, background:ACCENT, transition:'width 0.5s ease' }}/>
        </div>
      );
    }

    function Eyebrow({ children }) {
      return (
        <div style={{ fontSize:'0.7rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:16, display:'flex', alignItems:'center', gap:10, fontWeight:500 }}>
          <span style={{ width:28, height:1, background:ACCENT, opacity:0.5, flexShrink:0, display:'block' }}/>
          {children}
        </div>
      );
    }

    function StepIndicator({ current, total }) {
      return (
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.2em', textTransform:'uppercase', color:'#8888a0' }}>
          Part <span style={{ color:ACCENT, fontWeight:600 }}>{current}</span> of {total}
        </div>
      );
    }

    function ArrowRight({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>);
    }

    function ArrowLeft({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>);
    }

    function BackBtn({ onClick }) {
      return (
        <button onClick={onClick} style={{ display:'flex', alignItems:'center', gap:6, color:'#8888a0', background:'none', border:'none', cursor:'pointer', fontSize:'0.82rem' }}>
          <ArrowLeft size={15}/> Back
        </button>
      );
    }

    function BottomNav({ onBack, onNext, nextLabel = 'Continue' }) {
      return (
        <div style={{ display:'flex', justifyContent: onBack ? 'space-between' : 'flex-end', alignItems:'center', gap:16, marginTop:64, paddingTop:32, borderTop:'1px solid #1e1e2a' }}>
          {onBack && <BackBtn onClick={onBack}/>}
          <button onClick={onNext}
            style={{ display:'inline-flex', alignItems:'center', gap:9, padding:'13px 26px', borderRadius:12, fontSize:'0.875rem', fontWeight:600, border:'none', cursor:'pointer', background:`linear-gradient(135deg,${ACCENT},#4f46e5)`, color:'#fff', textAlign:'left' }}>
            {nextLabel} <ArrowRight/>
          </button>
        </div>
      );
    }

    function InsightCard({ label = 'Key Insight', children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}33`, borderRadius:18, padding:34, marginBottom:36, position:'relative' }}>
          <div style={{ fontSize:'0.68rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:14, fontWeight:600 }}>{label}</div>
          <p style={{ fontSize:'clamp(1.05rem,2.4vw,1.3rem)', lineHeight:1.72, color:'#e8e8ed', position:'relative' }}>{children}</p>
        </div>
      );
    }

    function Footer() { return <footer style={{ textAlign:'center', marginTop:56, color:'#8888a0', fontSize:'0.75rem' }}>© 2026 MindMapManifesto.com</footer>; }
    function PageWrapper({ children, maxWidth = 820 }) { return <div style={{ position:'relative', zIndex:1, maxWidth, margin:'0 auto', padding:'60px 24px 100px' }}>{children}</div>; }

    function Prose({ children }) {
      return <p style={{ fontSize:'clamp(0.95rem,2.1vw,1.1rem)', lineHeight:1.88, color:'rgba(220,215,240,0.72)', marginBottom:22 }}>{children}</p>;
    }

    function PullQuote({ children }) {
      return (
        <div style={{ borderLeft:`2px solid ${ACCENT}40`, paddingLeft:24, marginBottom:30, marginTop:4 }}>
          <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.2vw,1.18rem)', lineHeight:1.78, color:`${ACCENT}a0` }}>{children}</p>
        </div>
      );
    }

    /* a paper note with an optional label, title and intro line */
    function Card({ label, title, intro, children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'26px 28px', marginBottom:30 }}>
          {label && <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:`${ACCENT}99`, marginBottom: title ? 8 : 16, fontWeight:600 }}>{label}</div>}
          {title && <h3 style={{ fontSize:'1.35rem', fontWeight:700, color:'#e8e8ed', marginBottom:14 }}>{title}</h3>}
          {intro && <p style={{ fontSize:'1rem', lineHeight:1.65, color:'#b8b8c8', marginBottom:16 }}>{intro}</p>}
          {children}
        </div>
      );
    }

    function Points({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {items.map((t, i) => (
            <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
              <div style={{ width:5, height:5, borderRadius:'50%', background:ACCENT, flexShrink:0, opacity:0.6, marginTop:12 }}/>
              <p style={{ fontSize:'1rem', lineHeight:1.65, color:'rgba(220,215,240,0.78)' }}>{t}</p>
            </div>
          ))}
        </div>
      );
    }

    function Steps({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {items.map((t, i) => (
            <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
              <div style={{ width:28, height:28, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, border:`1px solid ${ACCENT}55`, fontSize:'0.78rem', marginTop:1 }}>{i + 1}</div>
              <p style={{ fontSize:'1rem', lineHeight:1.65, color:'rgba(220,215,240,0.78)' }}>{t}</p>
            </div>
          ))}
        </div>
      );
    }

    function Terms({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {items.map(([t, d], i) => (
            <div key={i} style={{ borderLeft:`2px solid ${ACCENT}4d`, paddingLeft:14 }}>
              <div style={{ fontWeight:700, fontSize:'1.1rem', color:'#e8e8ed', marginBottom:2 }}>{t}</div>
              <p style={{ fontSize:'0.95rem', color:'#8888a0', lineHeight:1.6 }}>{d}</p>
            </div>
          ))}
        </div>
      );
    }

    /* lead qualification flow */
    function FlowBox({ children }) {
      return <div style={{ background:'rgba(129,140,248,0.06)', border:`1px solid ${ACCENT}33`, borderRadius:10, padding:'12px 16px', fontSize:'0.95rem', lineHeight:1.55, textAlign:'center' }}>{children}</div>;
    }
    function FlowRow({ children }) {
      return <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>{children}</div>;
    }
    function Down() {
      return <div aria-hidden="true" style={{ textAlign:'center', fontSize:'1.2rem', lineHeight:1, margin:'10px 0', color:ACCENT }}>↓</div>;
    }

    function Chapter({ children, n, label, title, nextLabel, onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <ProgressBar pct={n / PARTS.length * 100}/>
          <PageWrapper>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:56 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={n} total={PARTS.length}/>
            </nav>
            <div style={{ marginBottom:36, animation:'mmm-fadeUp 0.7s ease-out' }}>
              <Eyebrow>{label}</Eyebrow>
              <h1 style={{ fontSize:'clamp(1.9rem,4.6vw,2.95rem)', fontWeight:700, lineHeight:1.18, marginBottom:8, color:'#e8e8ed' }}>{title}</h1>
            </div>
            {children}
            <BottomNav onBack={onBack} onNext={onNext} nextLabel={nextLabel}/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* one key: a numbered paper note */
    function Key({ n, title, children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'24px 28px', marginBottom:28 }}>
          <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:`${ACCENT}99`, marginBottom:6, fontWeight:600 }}>Key {String(n).padStart(2, '0')}</div>
          <h3 style={{ fontSize:'1.35rem', fontWeight:700, color:'#e8e8ed', marginBottom:10 }}>{title}</h3>
          {typeof children === 'string' ? <p style={{ fontSize:'1rem', lineHeight:1.65, color:'#b8b8c8' }}>{children}</p> : children}
        </div>
      );
    }

    /* ── Screen 0: Landing ───────────────────────────────────────── */
    function LandingScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:820, display:'flex', flexDirection:'column', alignItems:'center', gap:36, animation:'mmm-reveal 1.5s cubic-bezier(0.16,1,0.3,1) forwards' }}>
            <div style={{ fontSize:'0.65rem', letterSpacing:'0.6em', color:'rgba(129,140,248,0.5)', textTransform:'uppercase', fontWeight:700 }}>From the book by Kartheek Mulpuri &amp; Ian Grover</div>
            <div>
              <h1 style={{ fontSize:'clamp(2.8rem,10vw,6rem)', fontWeight:700, letterSpacing:'-0.02em', color:'white', marginBottom:10 }}>The Keys to Early-Stage Sales</h1>
              <div style={{ fontSize:'clamp(0.9rem,2.2vw,1.3rem)', fontWeight:300, color:'rgba(255,255,255,0.4)', letterSpacing:'0.1em' }}>{KEY_COUNT} Keys · {PARTS.length} Parts · The Sales Development Playbook</div>
            </div>
            <div style={{ maxWidth:600, borderLeft:'2px solid rgba(129,140,248,0.3)', paddingLeft:26, textAlign:'left' }}>
              <p style={{ fontStyle:'italic', fontSize:'clamp(0.95rem,1.9vw,1.13rem)', lineHeight:1.8, color:'rgba(255,255,255,0.55)' }}>
                Every key a newly hired SDR needs: preparation, outreach, lead acceptance, and the little things. “The material here is intended to serve as a framework. You will have to iterate to find solutions that work for you.”
              </p>
            </div>
            <button onClick={onNext}
              style={{ background:'rgba(129,140,248,0.08)', border:'1px solid rgba(129,140,248,0.28)', borderRadius:9999, padding:'18px 52px', fontSize:'0.8rem', fontWeight:700, letterSpacing:'0.4em', textTransform:'uppercase', color:'white', cursor:'pointer' }}>
              Begin
            </button>
          </div>
        </div>
      );
    }

    /* ── Parts: each is a list of keys, numbered straight through ── */
    const PARTS = [
      {
        title: 'Why This Playbook Exists',
        intro: 'Kartheek Mulpuri spent ten years in tech: sales operations at an early-stage company that exited, a lead-generation strategy that brought American consumer electronics brands to the Middle East, and a view of dozens of sales development methods as a venture capitalist. Ian Grover has prospected 4- to 7-figure deals and had to rebuild his playbook moving from Yelp to Brickwork, a 19-person SaaS startup. They wrote the guide they couldn’t find.',
        keys: [
          ['It’s a framework, not a script', 'Every company is different and every SDR has their own style. Adapt everything here to your situation, and keep iterating until it works for you.'],
          ['Know why new SDRs burn out', 'There have never been more early-stage SaaS companies (11,288 as of November 2018, per Crunchbase). More SDRs than ever are hired into imperfect situations with no structured training, few tools and little process, and hundreds churn within their first year. Go in expecting it, and build your own system.'],
        ],
      },
      {
        title: 'The Team and Your Job',
        keys: [
          ['Know who’s on an early-stage sales team', <Terms items={[
            ['Early stage', 'Pre-Series B, or fewer than 30 people.'],
            ['The leader', 'The CEO or a Head of Sales.'],
            ['Account executives (AEs)', 'One to three. They close leads that look like a fit.'],
            ['Marketing', 'Maybe one person, junior or mid-level.'],
            ['Customer success managers (CSMs)', 'One or two. They run the relationship after the AEs close.'],
            ['SDRs', 'One or two. That’s you.'],
          ]}/>],
          ['You own lead qualification', <>
            <p style={{ fontSize:'1rem', lineHeight:1.65, marginBottom:16 }}>Every lead passes through your hands before an AE spends time on it:</p>
            <FlowRow>
              <FlowBox><strong>Inbound:</strong> someone shows interest, usually by leaving their contact details.</FlowBox>
              <FlowBox><strong>Outbound:</strong> you or marketing list people at companies that could be a fit.</FlowBox>
            </FlowRow>
            <Down/>
            <FlowBox>You engage the lead through a <strong>campaign</strong>: emails, calls, LinkedIn messages and other touches.</FlowBox>
            <Down/>
            <FlowRow>
              <FlowBox><strong>Interested:</strong> they take a first call with you, and you book a call for the AE.</FlowBox>
              <FlowBox><strong>Not interested:</strong> out of the active pipeline; try again in 6–8 weeks.</FlowBox>
            </FlowRow>
            <Down/>
            <FlowRow>
              <FlowBox><strong>AE accepts:</strong> if the conversation continues, the lead becomes an <strong>opportunity.</strong></FlowBox>
              <FlowBox><strong>AE rejects:</strong> you mark it disqualified in the CRM and email them the news.</FlowBox>
            </FlowRow>
          </>],
          ['Your work has three stages', 'Preparation, outreach and lead acceptance. Get the first one right and the other two get easier.'],
        ],
      },
      {
        title: 'Onboarding: Learn the Business',
        keys: [
          ['Onboarding makes or breaks you', 'It may be your first full-time job, first sales job or first job in the industry, and at an early-stage company nobody may have written down how qualification works. Expect to train yourself, test which techniques work, and figure out why they work in your industries.'],
          ['Beat the three-month ramp', 'Per TOPO, the average SDR takes about three months to reach full productivity. A systematic onboarding gets you there much faster.'],
          ['Interview the company', <Points items={[
            'What does the whole team look like, and who leads it?',
            'What are the short-term and long-term goals?',
            'What milestones has the company hit recently?',
            'Is the culture engineer-driven or sales-driven?',
            'Who manages sales, who does your manager report to, and what’s the sales org chart?',
            'Who are your go-to people for questions?',
            'How are sales decisions made, and how should you work with marketing?',
            'What have lead-generation results looked like, and what’s been hard?',
            'How is reporting done, and which metrics do the company and the sales team track?',
            'Are there regular meetings on leads and opportunities? How often, and when?',
          ]}/>],
        ],
      },
      {
        title: 'Learn the Product and the Market',
        keys: [
          ['Get a full demo, and keep up', 'Ask an AE or someone on the team for a complete demo; it’s hard to understand a product without one. Then follow every new feature and module as it ships.'],
          ['Know the product cold', <Points items={[
            'What does it do, what is it meant to do, and what’s the long-term vision?',
            'What’s in development, and where does it fall short today?',
            'Why wouldn’t a company buy it?',
            'What value does it deliver, how do customers measure success, and how do they calculate ROI?',
            'How satisfied are customers? What’s the Net Promoter Score?',
            'What makes it unique? Is it a must-have or a luxury?',
            'How is it positioned? Does it need an implementation period, and how long?',
          ]}/>],
          ['Know the market', <Points items={[
            'Which markets do you target, by industry and buyer size?',
            'What’s your Ideal Customer Profile (ICP): the customer who gets the most value?',
            'How big is each market, is it growing or shrinking, and how are they prioritized?',
            'Who are the competitors, and how does your price compare?',
            'If you’re more expensive, does better functionality justify it?',
          ]}/>],
          ['Shadow the AEs', 'Sit in on AE calls with buyers. Those conversations answer most of these questions, and most AEs were SDRs once, so they’ll get it. Aim to have most answers within your first couple of weeks.'],
          ['Fact-check the hype', 'Management tends to oversell the product and market. Balance it with real user reviews on G2, Capterra and Quora, Glassdoor for the internal picture, and Crunchbase for funding history.'],
          ['Ask again every couple of quarters', 'At a startup, the answers change fast.'],
        ],
      },
      {
        title: 'Know the Account',
        keys: [
          ['Profile every account before you chase it', 'Use the profile to decide whether to pursue the account at all, and to stand out from SDRs at competitors. Go deeper on bigger deals, where the stakes and the public information are greater. Most of it is on the company’s website, Google and LinkedIn, and all of it goes in the CRM.'],
          ['Capture the basics', 'Headquarters and satellite offices, revenue, market cap if public, headcount, and industry-specific numbers like store count for a retailer.'],
          ['Read their news and strategy', 'For public companies, the latest investor presentation in Investor Relations. For everyone, Google News, especially quotes from the CEO.'],
          ['Use their current solution like a customer', 'Your team wants to replace what they use today. If it’s customer-facing, try it yourself and find the pain points. Brickwork, which powered store locators and appointment booking for retailers, tested prospects’ existing tools right on their websites.'],
          ['List every contact', 'Names and titles of the likely decisionmaker and stakeholders: 5–10 for a large account, more for a mega account like a Wall Street bank, fewer for small ones.'],
        ],
      },
      {
        title: 'Know the Buyer',
        keys: [
          ['Build a persona for every buyer type', 'Many people involved can’t approve a purchase but can champion it. And industry changes the persona: a VP of Finance in oil and gas isn’t a VP of Finance in healthcare.'],
          ['Fill in five fields per persona', <Terms items={[
            ['Role', 'The job, the day-to-day, the skills, education, knowledge and tools, and who they report to.'],
            ['Industry', 'Market size, growth or decline, the customers it serves, and the size of the buyer’s company.'],
            ['Goals', 'How they’re measured, and what success looks like.'],
            ['Networking', 'Associations, LinkedIn activity, the sites they read, and the events they attend.'],
            ['Preferences', 'How they like to deal with vendors: email, phone, in person or something else.'],
          ]}/>],
          ['Treat your team’s answers as a hypothesis', 'At an early-stage company they may be wrong. Start with them, then update as real conversations come in. Understanding the buyer is what gets you more meetings.'],
          ['Map how the account buys', <Points items={[
            'Who makes the final go/no-go decision? If several people, who?',
            'Does anyone else need to approve a purchase?',
            'Who leads the evaluation?',
            'Who will actually use the product, and what are their personas?',
            'Who could be your internal champion?',
            'Who reports to whom?',
          ]}/>],
        ],
      },
      {
        title: 'Find the Champion',
        keys: [
          ['In big deals, go to the champion first', 'A busy decisionmaker often hands the evaluation to someone who may be a detractor or uninterested, and the deal dies before it starts. A champion doesn’t decide, but advocates for you internally.'],
          ['Look one or two levels down', 'Ask your team who the champions were in past deals. Selling a content management system where the CMO decides? Look for a VP of Marketing or a Director of Content Marketing.'],
          ['Learn to deputize champions', 'The best AEs spot the rising star in an account, build a strong relationship, and work the deal with that person. A sign it’s strong: they text each other often.'],
          ['Know what’s worked with each persona', <Points items={[
            'What results have you had with each one?',
            'What price is each willing to pay?',
            'What’s the best way to get them to respond?',
            'Which three features do they care about most, and least?',
            'Which value proposition do they care about most, and least?',
          ]}/>],
        ],
      },
      {
        title: 'Build Your Stack',
        intro: 'These are the tools the authors named in 2020; the categories matter more than the brands.',
        keys: [
          ['Get real tools', 'You could work with email, a phone and Google. It would be slow. Work with your budget owner on tools that make the most of your time.'],
          ['Make the CRM your foundation', 'It records every interaction with prospects and customers. Without it, account knowledge lives in someone’s head and leaves with them, teammates contact accounts with no context, and leadership can’t see the health of the business.'],
          ['Pick the CRM for your stage', <Terms items={[
            ['Google Sheets', 'The bare minimum. Move off it fast; it doesn’t scale.'],
            ['HubSpot', 'Well liked and free, though you’ll likely buy its paid hubs.'],
            ['Pipedrive', 'A small-business favorite, from $15 per user per month.'],
            ['Salesforce', 'Where most companies land at scale.'],
          ]}/>],
          ['Build lead lists with Sales Navigator', 'Search LinkedIn’s 600M+ members by geography, company size, industry and title, and follow a lead’s activity for things to mention in outreach.'],
          ['Find contact details, then verify', 'ZoomInfo, Hunter.io, RocketReach and SalesIntel vary in accuracy. When they fail, try firstname@, first initial plus last name@, or firstname.lastname@ the company’s domain.'],
          ['Run outreach through a platform with analytics', 'SalesLoft, Outreach.io or HubSpot let you personalize, automate and track outreach so you can see what works. If yours lacks analytics, push for a tool that fills the gap.'],
          ['Use ABM tools for target accounts', 'Terminus and Engagio help you and marketing run personalized campaigns at a set of key accounts.'],
          ['Add the extras that save time', 'Emissary to talk to an account’s former employees, Calendly so prospects can pick a time, Sendoso for direct mail, and Intercom or Drift to chat with website visitors.'],
          ['Don’t do it alone', 'The job can feel lonely. Ask peers on Bravado and Quora, and learn from SaaStr and SalesHacker for free.'],
        ],
      },
      {
        title: 'Work With Marketing',
        keys: [
          ['Put marketing’s collateral in your outreach', 'Case studies, white papers, brochures and product videos. Buyers engage more with emails that give them something of value.'],
          ['Treat inbound leads as gold', 'Leads from SEO, blogs, podcasts and ads have already shown interest, and many are mid-buying-cycle. They’re worth more than outbound leads, but go nowhere until someone qualifies them, usually you.'],
          ['Agree who qualifies before anyone responds', 'Set the handoff with whoever runs demand generation, and stay current on the collateral available.'],
          ['Respond fast', 'Set a response time for qualified inbound leads. Many teams use 24 hours; never go past 72. Momentum is everything.'],
        ],
      },
      {
        title: 'Campaigns and ABM Tiers',
        keys: [
          ['Be ready before outreach starts', 'First emails and follow-ups drafted and loaded into your sales execution tool, prospect and contact profiles built, and value points written for each persona and business.'],
          ['Use the channels that work', 'Email, phone (lukewarm and cold) and LinkedIn. Events and conferences, including meetings booked around the venue. Facebook and Twitter messages for small businesses like restaurants. Direct mail with handwritten notes or swag, if the budget allows.'],
          ['Stand out', 'There are over 4,000 marketing technology vendors alone. Your prospects are flooded, so your outreach has to be noticeably better.'],
          ['Match the campaign to the list', 'Thousands of accounts and twenty accounts are different games. For a short, high-stakes list, account-based marketing (ABM) is the method of choice.'],
          ['Run ABM as a team', 'You, the AE and marketing coordinate closely. Often you split the contacts and the AE takes the senior ones. Tailor every message to the role: pipeline efficiency and close rates for sales, acquisition and conversion for marketing.'],
          ['Tier your accounts', <Terms items={[
            ['Tier 1 · under 50 accounts', 'Deep research, one-to-one personalization, coordinated with the AE, marketing and sometimes executives. Runs for months.'],
            ['Tier 2 · up to 200', 'Key data points, especially numbers. Personalize by industry, solution or persona with marketing. Runs for weeks.'],
            ['Tier 3 · 1,000+', 'Little personalization; waves of communication with marketing over a few weeks.'],
          ]}/>],
        ],
      },
      {
        title: 'The Cadence',
        keys: [
          ['Set a cadence for every campaign', 'How often, and through which channels, you touch each contact. Examples: 7 touches in 2 weeks for six-figure deals; 42 touches in 90 days for marquee accounts; 7 in 20 days for influencers who don’t decide.'],
          ['Start from a proven sequence', <>
            <p style={{ fontSize:'1rem', lineHeight:1.65, marginBottom:14 }}>Ian’s favorite, from Engagio, for high five- to low six-figure retail deals:</p>
            <Terms items={[
              ['Day 0', 'Email in the morning, call in the afternoon.'],
              ['Day 3', 'Call in the morning; follow-up email if you get voicemail.'],
              ['Day 5', 'LinkedIn or other social message in the afternoon.'],
              ['Day 7', 'Email in the morning.'],
              ['Day 9', 'Call in the morning.'],
              ['Day 15', 'Call and email in the morning.'],
            ]}/>
          </>],
          ['Send the breakup email', 'No reply after day 15? Say you haven’t heard back and leave a clear next step: “I’ll check back in three months,” or “If it makes sense to connect later, send me a note.”'],
          ['Borrow what already worked', 'The right cadence depends on account count, titles, industry and past contact. Ask your team which cadences they’ve run and how each performed, and let your tool automate and log it.'],
        ],
      },
      {
        title: 'Seven Campaign Tips',
        keys: [
          ['Time your calls', 'Midweek is best for a first ping (busy Mondays, slow Fridays). Warm calls land best just before lunch or at the end of the day, never first thing in the morning.'],
          ['Time your emails', 'Aim for the top of the inbox when they can think: around 11 AM or 4 PM their time. Test evenings and early mornings too.'],
          ['Use two formats on day one', 'Two touches through different channels on the first day, like a LinkedIn InMail in the morning and an email in the late afternoon.'],
          ['Plan every hour', 'Know what each hour, or each two-to-three-hour block, is for before the day starts.'],
          ['Write subject lines that earn the open', 'Relevant and attention-catching, with industry or role-specific words that show you know the subject.'],
          ['Lead with data', 'Relevant, actionable data builds credibility and can make a prospect glad you reached out.'],
          ['Disqualify without fear', 'Passing a bad-fit lead forward wastes your team’s time, even if they liked you. Sales is a numbers game.'],
        ],
      },
      {
        title: 'Email and LinkedIn',
        keys: [
          ['Make email your main channel', 'View rates are high, you can reach many people at once, and a cold email feels less intrusive than a cold call. But buyers get hundreds of vendor emails, so earn the open and show you know their industry.'],
          ['Build the first email in five moves', <Steps items={[
            'Break the ice with a genuine compliment or a mutual connection.',
            'Say what you do in plain words, with a simple value statement.',
            'Give value: a case study from a similar company, with a concrete result.',
            'Show your homework: one specific detail about their company.',
            'Make replying easy: propose a specific day and time.',
          ]}/>],
          ['Get the right LinkedIn plan, and ration InMails', 'You need Premium at least, ideally Sales Navigator; connecting first and messaging later costs replies. InMails are capped, so make each count. The limits are 200 characters for the subject and 1,900 for the body; stay far below both.'],
          ['Write InMails as rapport, context, call to action', 'Mention something they wrote or did, connect it to what you do with one proof point, then suggest a time.'],
          ['Polish your own profile', 'It’s the public version of you. Buyers reply more to someone whose profile follows best practices.'],
        ],
      },
      {
        title: 'Phone Calls',
        keys: [
          ['Know the temperature of the call', <Terms items={[
            ['Warm', 'Prior contact: you met at an event or spoke before.'],
            ['Lukewarm', 'They’ve likely seen an email from your campaign.'],
            ['Cold', 'No context about your company.'],
          ]}/>],
          ['Skew your calls warm', 'The warmer the prospect, the more receptive. At an early-stage company nobody’s heard of, don’t make a call your first touch. (Many sales leaders disagree; it’s debated.)'],
          ['Research before you dial', 'Their company’s focus and recent news, their title and career path, news about them, and public details like their college or something they wrote. That’s what separates you from a telemarketer reading a stiff script.'],
          ['Know where the answers are', 'You won’t know everything, but you should be able to answer basic questions and know where to look for the rest.'],
          ['Follow the first-call framework', <Steps items={[
            'Introduce yourself and build rapport from your research.',
            'Say why you’re calling, framed around a likely problem, and ask if they have it.',
            'Share what you do, with a proof point and a use case.',
            'Ask for time with your AE. The goal is a meeting, not a sale.',
          ]}/>],
          ['Keep it under ten minutes', 'Per TOPO, under 10 minutes; a good one takes about five. If they don’t pick up, leave a voicemail that earns a callback.'],
        ],
      },
      {
        title: 'Lead Acceptance',
        keys: [
          ['Qualify so well that AEs accept', 'Your company should have a clear acceptance framework. If you’ve done the work, acceptance should be high and rejections should come down to missing information.'],
          ['Handle rejections', 'Get the missing information that could qualify the lead, or disqualify it politely by email.'],
          ['Book accepted meetings immediately', 'Schedule the AE’s 30–60 minute call, often with a demo, as soon as possible to keep momentum.'],
          ['Sit in on the AE’s calls', 'Join that call and later ones. It’s how you learn the full sales process, and how the best AEs started learning their job.'],
          ['Close the loop on “not a fit”', 'If the AE passes, you owned the relationship, so you send the polite email and update the CRM. If they continue, the lead becomes an opportunity and the AE owns it.'],
          ['Log what separates yes from no', 'Each time, note the traits of the leads that moved forward and the ones that didn’t. Apply the patterns to your outreach.'],
        ],
      },
      {
        title: 'How You’re Measured',
        keys: [
          ['Metrics depend on the business', 'A horizontal SaaS company selling to small businesses cares about touches per day; a vertical one selling eight-figure deals to 50 accounts doesn’t. Either way, the job is qualified meetings for your AEs.'],
          ['Count meetings generated', 'The sales target implies a number of first meetings. Get at least a rough goal from your leaders.'],
          ['Track meetings that close', 'It shows whether your leads are qualified, though some factors, like an ineffective AE, are out of your control.'],
          ['Watch your lead efficiency', 'How many leads did you contact per meeting? Burning through a list for a few meetings means something in your pitch is off, and it can permanently damage how those prospects see your company.'],
          ['Know your measures, and speak up', 'Know exactly how you’re measured. If the measures seem wrong or the targets too easy or too hard, say so.'],
        ],
      },
      {
        title: 'A Day in the Life',
        keys: [
          ['Give every block of the day a job', <Terms items={[
            ['8:30', 'Arrive.'],
            ['8:45–9:00', 'Priority emails (overnight replies, follow-ups); check the day’s schedule and prep for intro calls.'],
            ['9:00–12:00', 'Structured outreach: calls, emails, connecting with leads.'],
            ['12:00–12:30', 'A quick lunch at your desk.'],
            ['12:30–3:30', 'Internal meetings and first calls; protect time for the calls.'],
            ['3:30–5:30', 'Research and plan tomorrow’s outreach: new accounts, leads, personas.'],
          ]}/>],
          ['Hit the hottest prospects first', 'In your outreach block, start with the prospects most likely to convert.'],
        ],
      },
      {
        title: 'The Little Things',
        intro: 'The role takes grit, work ethic, resilience to rejection, professionalism, intelligence, creativity, introspection and time management. These habits go a long way:',
        keys: [
          ['Own the agenda of your 1:1', 'Your manager won’t bring one. Use it to recap the week, reflect on your approach and results, plan ahead and raise concerns. Agree on the structure early.'],
          ['Come prepared to every group meeting', 'For the pipeline review, be ready on your campaigns, results, what has and hasn’t worked, what’s next, and notable calls booked for AEs. Pull reports from the CRM and your outreach tool beforehand and look for trends. Leaders promote people they know can handle more.'],
          ['Treat sales as a science', 'Know the funnel, your lead sources and the meetings each produces. Low opens? Change the content, then check whether opens and replies improve.'],
          ['Keep your CRM clean', 'Record outreach specifically and promptly, so teammates have context and sales ops gets accurate metrics. If you collect it, it belongs in the CRM.'],
          ['Plan months ahead', 'Avoid the end-of-quarter scramble. Learn the best times of year to reach each account type, start conference campaigns weeks or months early, and run your calendar by your manager.'],
          ['Take initiative', 'If a process could be better or should exist, say so in a 1:1 with its owner. That’s leadership. If you’re told to be quiet, you may be at the wrong company.'],
          ['Network inside the company', 'Get to know product, customer success and support over 1:1 lunches and coffees. People who put in the work find mentors.'],
          ['Network outside it', 'Go to conferences, trade shows and meetups, and reach peers and sales leaders on LinkedIn or Bravado, ideally through a warm introduction.'],
        ],
      },
      {
        title: 'Where the Role Leads',
        keys: [
          ['Expect more than qualifying', 'At many small companies SDRs take the first call or run the demo. As products get more complex, become an expert on the industry, not just the product.'],
          ['Know why SDRs fail', <Points items={[
            'The grind: 50–150 touches a day and a lot of “no.”',
            'Skipping preparation, so outreach falls flat.',
            'Never adjusting when outreach isn’t working.',
            'Structural problems: a small market already worked through, a product with a bad reputation, or too few inbound leads.',
          ]}/>],
          ['Most of it is in your control', 'Of all the reasons SDRs fail, most are within the SDR’s control.'],
          ['Plan your next move', 'The typical SDR stays under a year and a half. Paths lead to AE, customer success, marketing or managing SDRs, and many CEOs and heads of sales started as SDRs. Who knows? You may join their ranks one day.'],
        ],
      },
    ].map((p, i) => ({ ...p, label: `Part ${NUMBERS[i + 1]} · ${SERIES}` }));

    const KEY_COUNT = PARTS.reduce((sum, p) => sum + p.keys.length, 0);
    const keyStart = i => PARTS.slice(0, i).reduce((sum, p) => sum + p.keys.length, 0) + 1;

    /* ── Completion Screen ──────────────────────────────────────── */
    function CompletionScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', position:'relative', overflow:'hidden' }} onClick={onNext}>
          {[0, 1, 2].map(i => (<div key={i} style={{ position:'absolute', top:'50%', left:'50%', width:100+i*90, height:100+i*90, borderRadius:'50%', border:`1px solid ${['rgba(129,140,248,0.35)','rgba(99,102,241,0.25)','rgba(6,182,212,0.18)'][i]}`, animation:`waveExpand 5s ease-out ${i*1.6}s infinite` }}/>))}
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:760 }}>
            <div style={{ fontSize:'0.62rem', letterSpacing:'0.5em', textTransform:'uppercase', color:'rgba(129,140,248,0.4)', marginBottom:36 }}>Complete · All {KEY_COUNT} Keys</div>
            <h1 style={{ fontSize:'clamp(2.2rem,8vw,5rem)', fontWeight:700, color:'#e8e8ed', letterSpacing:1, marginBottom:32, animation:'mmm-reveal 2s ease-out 0.5s both', lineHeight:1.1 }}>YOU HAVE<br/>THE KEYS</h1>
            <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.4vw,1.25rem)', color:'rgba(210,200,255,0.55)', lineHeight:1.8, marginBottom:44, animation:'mmm-fadeUp 1.5s ease-out 1.5s both' }}>Know the business, the account and the buyer.<br/>Reach out with something of value, on a cadence.<br/>Hand your AEs meetings worth their time.</p>
            <div style={{ background:'rgba(129,140,248,0.06)', border:'1px solid rgba(129,140,248,0.15)', borderRadius:16, padding:'26px 36px', maxWidth:600, margin:'0 auto 48px', animation:'mmm-fadeUp 1.5s ease-out 2.2s both' }}>
              <p style={{ fontStyle:'italic', fontSize:'1.05rem', color:'rgba(220,200,255,0.72)', lineHeight:1.8 }}>“You will have to iterate to find solutions that work for you.”</p>
              <div style={{ fontSize:'0.6rem', letterSpacing:'0.25em', textTransform:'uppercase', color:'rgba(129,140,248,0.3)', marginTop:12 }}>The Early Stage Sales Development Playbook · Kartheek Mulpuri &amp; Ian Grover</div>
            </div>
            <div style={{ fontSize:'0.72rem', letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(255,255,255,0.18)', animation:'mmm-blink 2.5s ease-in-out 3.5s infinite' }}>*click anywhere to restart*</div>
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────────── */
    function App() {
      const [screen, setScreen] = useState(0);
      const go = n => setScreen(n);
      useEffect(() => { window.scrollTo(0, 0); }, [screen]);

      if (screen === 0) return <LandingScreen onNext={() => go(1)}/>;
      if (screen > PARTS.length) return <CompletionScreen onNext={() => go(0)}/>;
      const part = PARTS[screen - 1];
      const next = PARTS[screen];
      const first = keyStart(screen - 1);
      return (
        <Chapter key={screen} n={screen} label={part.label} title={part.title} nextLabel={next ? next.title : 'Finish'} onBack={() => go(screen - 1)} onNext={() => go(screen + 1)}>
          {part.intro && <Prose>{part.intro}</Prose>}
          {part.keys.map(([t, body], i) => <Key key={i} n={first + i} title={t}>{body}</Key>)}
        </Chapter>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script src="../app-nav.js"></script>
</body>
</html>
