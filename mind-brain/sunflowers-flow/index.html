<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sunflowers x Flow — MindMapManifesto</title>
  <meta name="description" content="Why shelling sunflower seeds is so absorbing: how it matches the conditions for flow, the one-more-try failure loop, every sense at once, and where it falls short of true flow."/>
  <meta property="og:title" content="Sunflowers x Flow"/>
  <meta property="og:description" content="Why shelling sunflower seeds is so absorbing: how it matches the conditions for flow, the one-more-try failure loop, every sense at once, and where it falls short of true flow."/>
  <meta property="og:image" content="../../Gemini_Generated_Image_9y8q49y8q49y8q49.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050507; color: #e8e8ed; overflow-x: hidden; }
    @keyframes mmm-reveal { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes mmm-fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes mmm-blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    @keyframes waveExpand { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../theme-app.css"/>
</head>
<body>
  <nav class="mb-nav" aria-label="Series navigation"><a href="../index.html">← back to mind x brain</a></nav>
  <p class="mb-hint" aria-hidden="true">← → keys or swipe</p>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SERIES = 'Sunflowers x Flow';
    const ACCENT = '#facc15';
    const NUMBERS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty','Twenty-One','Twenty-Two'];

    /* ── Shared Components ───────────────────────────────────────── */

    function ProgressBar({ pct }) {
      return (
        <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, height:3, background:'#14141c' }}>
          <div style={{ height:'100%', width:`${pct}%`, background:ACCENT, transition:'width 0.5s ease' }}/>
        </div>
      );
    }

    function Eyebrow({ children }) {
      return (
        <div style={{ fontSize:'0.7rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:16, display:'flex', alignItems:'center', gap:10, fontWeight:500 }}>
          <span style={{ width:28, height:1, background:ACCENT, opacity:0.5, flexShrink:0, display:'block' }}/>
          {children}
        </div>
      );
    }

    function StepIndicator({ current, total }) {
      return (
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.2em', textTransform:'uppercase', color:'#8888a0' }}>
          Part <span style={{ color:ACCENT, fontWeight:600 }}>{current}</span> of {total}
        </div>
      );
    }

    function ArrowRight({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>);
    }

    function ArrowLeft({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>);
    }

    function BackBtn({ onClick }) {
      return (
        <button onClick={onClick} style={{ display:'flex', alignItems:'center', gap:6, color:'#8888a0', background:'none', border:'none', cursor:'pointer', fontSize:'0.82rem' }}>
          <ArrowLeft size={15}/> Back
        </button>
      );
    }

    function BottomNav({ onBack, onNext, nextLabel = 'Continue' }) {
      return (
        <div style={{ display:'flex', justifyContent: onBack ? 'space-between' : 'flex-end', alignItems:'center', gap:16, marginTop:64, paddingTop:32, borderTop:'1px solid #1e1e2a' }}>
          {onBack && <BackBtn onClick={onBack}/>}
          <button onClick={onNext}
            style={{ display:'inline-flex', alignItems:'center', gap:9, padding:'13px 26px', borderRadius:12, fontSize:'0.875rem', fontWeight:600, border:'none', cursor:'pointer', background:`linear-gradient(135deg,${ACCENT},#ca8a04)`, color:'#fff', textAlign:'left' }}>
            {nextLabel} <ArrowRight/>
          </button>
        </div>
      );
    }

    function InsightCard({ label = 'Key Insight', children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}33`, borderRadius:18, padding:34, marginBottom:36, position:'relative' }}>
          <div style={{ fontSize:'0.68rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:14, fontWeight:600 }}>{label}</div>
          <p style={{ fontSize:'clamp(1.05rem,2.4vw,1.3rem)', lineHeight:1.72, color:'#e8e8ed', position:'relative' }}>{children}</p>
        </div>
      );
    }

    function Footer() { return <footer style={{ textAlign:'center', marginTop:56, color:'#8888a0', fontSize:'0.75rem' }}>© 2026 MindMapManifesto.com</footer>; }
    function PageWrapper({ children, maxWidth = 820 }) { return <div style={{ position:'relative', zIndex:1, maxWidth, margin:'0 auto', padding:'60px 24px 100px' }}>{children}</div>; }

    function Prose({ children }) {
      return <p style={{ fontSize:'clamp(0.95rem,2.1vw,1.1rem)', lineHeight:1.88, color:'rgba(220,215,240,0.72)', marginBottom:22 }}>{children}</p>;
    }

    function PullQuote({ children }) {
      return (
        <div style={{ borderLeft:`2px solid ${ACCENT}40`, paddingLeft:24, marginBottom:30, marginTop:4 }}>
          <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.2vw,1.18rem)', lineHeight:1.78, color:`${ACCENT}a0` }}>{children}</p>
        </div>
      );
    }

    /* a paper note with an optional label, title and intro line */
    function Card({ label, title, intro, children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'26px 28px', marginBottom:30 }}>
          {label && <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:`${ACCENT}99`, marginBottom: title ? 8 : 16, fontWeight:600 }}>{label}</div>}
          {title && <h3 style={{ fontSize:'1.35rem', fontWeight:700, color:'#e8e8ed', marginBottom:14 }}>{title}</h3>}
          {intro && <p style={{ fontSize:'1rem', lineHeight:1.65, color:'#b8b8c8', marginBottom: children ? 16 : 0 }}>{intro}</p>}
          {children}
        </div>
      );
    }

    function Points({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {items.map((t, i) => (
            <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
              <div style={{ width:5, height:5, borderRadius:'50%', background:ACCENT, flexShrink:0, opacity:0.6, marginTop:12 }}/>
              <p style={{ fontSize:'1rem', lineHeight:1.65, color:'rgba(220,215,240,0.78)' }}>{t}</p>
            </div>
          ))}
        </div>
      );
    }

    function Steps({ items, start = 1 }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {items.map((t, i) => (
            <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
              <div style={{ width:28, height:28, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, border:`1px solid ${ACCENT}55`, fontSize:'0.78rem', marginTop:1 }}>{i + start}</div>
              <p style={{ fontSize:'1rem', lineHeight:1.65, color:'rgba(220,215,240,0.78)' }}>{t}</p>
            </div>
          ))}
        </div>
      );
    }

    function Terms({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {items.map(([t, d], i) => (
            <div key={i} style={{ borderLeft:`2px solid ${ACCENT}4d`, paddingLeft:14 }}>
              <div style={{ fontWeight:700, fontSize:'1.1rem', color:'#e8e8ed', marginBottom:2 }}>{t}</div>
              <p style={{ fontSize:'0.95rem', color:'#8888a0', lineHeight:1.6 }}>{d}</p>
            </div>
          ))}
        </div>
      );
    }

    function Chapter({ children, n, label, title, nextLabel, onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <ProgressBar pct={n / PARTS.length * 100}/>
          <PageWrapper>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:56 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={n} total={PARTS.length}/>
            </nav>
            <div style={{ marginBottom:36, animation:'mmm-fadeUp 0.7s ease-out' }}>
              <Eyebrow>{label}</Eyebrow>
              <h1 style={{ fontSize:'clamp(1.9rem,4.6vw,2.95rem)', fontWeight:700, lineHeight:1.18, marginBottom:8, color:'#e8e8ed' }}>{title}</h1>
            </div>
            {children}
            <BottomNav onBack={onBack} onNext={onNext} nextLabel={nextLabel}/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 0: Landing ───────────────────────────────────────── */
    function LandingScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:820, display:'flex', flexDirection:'column', alignItems:'center', gap:36, animation:'mmm-reveal 1.5s cubic-bezier(0.16,1,0.3,1) forwards' }}>
            <div style={{ fontSize:'0.65rem', letterSpacing:'0.6em', color:'rgba(250,204,21,0.5)', textTransform:'uppercase', fontWeight:700 }}>Crack · Spit · Eat</div>
            <div>
              <h1 style={{ fontSize:'clamp(2.8rem,10vw,6rem)', fontWeight:700, letterSpacing:'-0.02em', color:'white', marginBottom:10 }}>Sunflowers x Flow</h1>
              <div style={{ fontSize:'clamp(0.9rem,2.2vw,1.3rem)', fontWeight:300, color:'rgba(255,255,255,0.4)', letterSpacing:'0.1em' }}>Why a Handful of Seeds Is So Hard to Put Down · {PARTS.length} Parts</div>
            </div>
            <div style={{ maxWidth:600, borderLeft:'2px solid rgba(250,204,21,0.3)', paddingLeft:26, textAlign:'left' }}>
              <p style={{ fontStyle:'italic', fontSize:'clamp(0.95rem,1.9vw,1.13rem)', lineHeight:1.8, color:'rgba(255,255,255,0.55)' }}>
                Shelling sunflower seeds hits a surprising number of the conditions for flow, and misses a few in ways that are revealing.
              </p>
            </div>
            <button onClick={onNext}
              style={{ background:'rgba(250,204,21,0.08)', border:'1px solid rgba(250,204,21,0.28)', borderRadius:9999, padding:'18px 52px', fontSize:'0.8rem', fontWeight:700, letterSpacing:'0.4em', textTransform:'uppercase', color:'white', cursor:'pointer' }}>
              Begin
            </button>
          </div>
        </div>
      );
    }

    /* ── Parts ───────────────────────────────────────────────────── */
    const PARTS = [
      {
        title: 'What Flow Is',
        body: <>
          <Prose>Flow is the state of being so absorbed in what you’re doing that everything else falls away: time bends, self-consciousness disappears, and the activity feels like it’s doing itself. Psychologist Mihaly Csikszentmihalyi named it after hearing the same word from climbers, musicians, surgeons and chess players describing their best moments.</Prose>
          <Card label="The conditions" title="What produces flow">
            <Steps items={[
              'Clear goals: you always know what to do next.',
              'Immediate feedback: you know at once how you’re doing.',
              'Challenge matched to skill: hard enough to hold you, not so hard it overwhelms you.',
              'Action and awareness merge: the doing stops feeling like separate steps.',
              'A sense of control.',
              'Time distortion: hours feel like minutes.',
            ]}/>
          </Card>
          <InsightCard label="The surprise">An everyday bag of sunflower seeds hits <em>almost every one</em> of these conditions. Looking at where it does, and where it doesn’t, shows what flow really needs.</InsightCard>
        </>,
      },
      {
        title: 'Where Seeds Match Flow',
        body: <>
          <Card label="Condition by condition">
            <Terms items={[
              ['Clear goals', 'Every seed presents the same unambiguous objective: get the kernel out intact. You never have to decide what you’re doing next, which frees attention for the task.'],
              ['Immediate feedback', 'The strongest match. The crack tells you instantly whether you succeeded: the sound, the resistance, whether the kernel comes free or shatters. No delay, no interpretation needed. Most activities can’t offer feedback this fast.'],
              ['Challenge-skill balance', 'Flow lives in the narrow band where difficulty matches ability. Seeds self-regulate here: a thin shell is easy, a thick or damp one is harder, and the variation keeps you from settling into pure automatic repetition. Never bored, never overwhelmed.'],
              ['Action and awareness merge', 'Once the motion is learned, the sequence of fingers, teeth, tongue and spit stops feeling like separate steps. That collapse into a single fluid gesture is a hallmark of flow.'],
              ['Sense of control', 'Failure is cheap and recoverable. Reposition, rotate, crack again. The reset is instant and nothing is lost, so you stay in command of the task.'],
              ['Time distortion', 'It follows from the rest: attention fully occupied, constant feedback, and no natural stopping point. Look up and the bag is empty.'],
            ]}/>
          </Card>
        </>,
      },
      {
        title: 'The Failure Loop',
        body: <>
          <Prose>A bad crack doesn’t end the cycle; it becomes another attempt. You reposition the seed, rotate it, try a different angle and go again. Each failure is a small problem to solve, so it keeps you engaged instead of pushing you away.</Prose>
          <InsightCard label="The “one more try” effect">This is a well-known pattern in game design and motivation research: when the cost of failure is low and the next try is immediate, people keep going. Shelling a seed has no real stakes, so the reset is instant. <em>It’s the same engine behind puzzles, roguelikes and retry-based games.</em></InsightCard>
          <Card label="Why it works">
            <Points items={[
              'Failure costs almost nothing: one seed, one second.',
              'The retry is immediate: no menu, no waiting.',
              'Every miss teaches something: angle, pressure, which side to bite.',
              'Success is always one attempt away.',
            ]}/>
          </Card>
        </>,
      },
      {
        title: 'Multisensory Assimilation',
        body: <>
          <Prose>Nearly every sense is engaged at once, and the actions are quick and sequenced.</Prose>
          <Card label="The senses, in order">
            <Terms items={[
              ['Fingers', 'Feel the seed’s grip and set the position.'],
              ['Teeth', 'Find the angle and apply pressure.'],
              ['Ears', 'Register the crack: a clean break or a crush.'],
              ['Tongue', 'Separates kernel from shell and handles the spit.'],
              ['Eyes', 'Check how the shell split and select the next seed.'],
              ['Taste', 'Delivers salt and fat on every cycle.'],
            ]}/>
          </Card>
          <PullQuote>All of it assimilates into one quick action: crack, spit, eat.</PullQuote>
        </>,
      },
      {
        title: 'Where the Fit Breaks Down',
        body: <>
          <Card label="What seeds are missing">
            <Terms items={[
              ['No skill ceiling', 'Real flow activities (climbing, music, surgery) have a difficulty curve that rises with ability, so flow keeps regenerating at higher levels. Seeds plateau within days. You get as good as you’ll ever get, and the challenge stops climbing.'],
              ['No autotelic growth', 'Csikszentmihalyi argued flow matters because it builds complexity in the self: you come out more capable than you went in. Shelling seeds leaves you where it found you. Rich experience, zero accumulation.'],
              ['Low cognitive load', 'Classic flow fully occupies working memory. Seeds occupy hands, mouth and a thin slice of attention, which is why people pair them with driving, watching baseball or talking. Less flow than a stable background rhythm.'],
            ]}/>
          </Card>
          <InsightCard label="The difference">True flow is a staircase: the better you get, the harder it gets, and the more you grow. Seeds are <em>a flat floor</em>: pleasant to walk on, going nowhere.</InsightCard>
        </>,
      },
      {
        title: 'What It Actually Is',
        body: <>
          <Prose>The honest category is closer to a <strong>sensorimotor loop</strong> than true flow: a repetitive physical action with tight feedback that absorbs attention without demanding it. Knitting, fidgeting with a lighter, clicking a pen and sunflower seeds all belong here.</Prose>
          <InsightCard label="Why you can’t stop">Each repetition is short, self-contained and ends in a small resolution, precisely the structure that resists stopping, because <em>there’s never a moment where the activity is “finished.”</em></InsightCard>
          <Prose>The salt is doing real work too. Salt and fat in the mouth trigger reward signaling before digestion even begins, so the mouth keeps getting paid on a cycle measured in seconds. Pair that with a manual skill and you have a loop you end on purpose, or by running out.</Prose>
        </>,
      },
      {
        title: 'Loops, Flow and Your Brain',
        body: <>
          <Prose>Seeds sit on a spectrum. Knowing where an activity falls tells you what it can give you, and what it can’t.</Prose>
          <Card label="Three kinds of absorption">
            <Terms items={[
              ['Sensorimotor loops', 'Seeds, knitting, fidgeting. Calming, absorbing, low-stakes. Great as a background rhythm for thinking, talking or unwinding.'],
              ['Compulsion loops', 'Shorts, slot machines, loot boxes. The same tight feedback, plus unpredictable rewards. Absorbing without restoring; you come out drained.'],
              ['True flow', 'Climbing, music, craft, deep work. Tight feedback plus a rising challenge. Absorbing and growing; you come out more capable.'],
            ]}/>
          </Card>
          <Card label="Use the loop on purpose">
            <Points items={[
              'Pair a sensorimotor loop with thinking: many people solve problems while knitting, walking or shelling seeds.',
              'Use it to step down from screens: hands busy, mind free, no feed.',
              'For real flow, borrow what seeds do well (clear goals, instant feedback, cheap failure) and add a challenge that keeps rising.',
            ]}/>
          </Card>
        </>,
      },
      {
        title: 'From Flow to Autopilot',
        body: <>
          <Prose>Watch TV while shelling seeds and you’ll notice something: you don’t think about it at all. The skill runs by itself. That isn’t a failure of flow. It’s what comes after flow.</Prose>
          <Card label="The four stages of learning">
            <Steps items={[
              <><strong>Unconscious incompetence.</strong> You don’t know how to shell a seed.</>,
              <><strong>Conscious incompetence.</strong> You try, crush the kernel, fumble. It takes all your attention.</>,
              <><strong>Conscious competence.</strong> You can do it, but only while concentrating. This is where flow lives: at the edge of your skill.</>,
              <><strong>Unconscious competence.</strong> It runs on its own while you watch TV. Autopilot.</>,
            ]}/>
          </Card>
          <InsightCard label="What happened in your brain">While you’re learning, the thinking front of the brain does the work. After enough repetitions the skill is handed down to deeper, older circuits that store habits and movement routines, and from there it runs on autopilot using almost no attention. <em>Flow is how a skill gets written. Autopilot is the finished program.</em></InsightCard>
          <Card label="You programmed yourself">
            <Terms items={[
              ['Repetition', 'Thousands of cracks, the same sequence every time.'],
              ['Reward', 'Salt and fat on every cycle, a few seconds apart.'],
              ['A relaxed state', 'TV and a rhythmic action in your hands drift the brain toward slower, calmer brain waves, when it’s most open to installing patterns.'],
            ]}/>
          </Card>
          <Prose>That’s the same recipe hypnosis uses on purpose: a relaxed state, repetition and reinforcement. See <a href="../15-brain-waves/index.html">the brain waves</a> for the states, and <a href="../21-rules-mind/index.html">the rules of the mind</a> for how the subconscious takes orders.</Prose>
          <PullQuote>It cuts both ways. The same process installs shelling, typing and driving, and reaching for your phone or snacking in front of a screen. You don’t choose what gets programmed, unless you do it deliberately.</PullQuote>
        </>,
      },
      {
        title: 'Practical Note',
        body: <>
          <Prose>The thing that makes seeds absorbing also makes portion control hard, and salted seeds carry a lot of sodium.</Prose>
          <Card label="If you want to keep it in check">
            <Points items={[
              'Pour a portion into a bowl instead of eating from the bag; the empty bowl becomes your stopping point.',
              'Try unsalted or lightly salted seeds.',
              'Keep water nearby.',
            ]}/>
          </Card>
          <PullQuote>Worth knowing, not worth worrying about.</PullQuote>
        </>,
      },
    ].map((p, i) => ({ ...p, label: `Part ${NUMBERS[i + 1]} · ${SERIES}` }));

    /* ── Completion Screen ──────────────────────────────────────── */
    function CompletionScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', position:'relative', overflow:'hidden' }} onClick={onNext}>
          {[0, 1, 2].map(i => (<div key={i} style={{ position:'absolute', top:'50%', left:'50%', width:100+i*90, height:100+i*90, borderRadius:'50%', border:`1px solid ${['rgba(250,204,21,0.35)','rgba(244,114,182,0.25)','rgba(34,211,238,0.18)'][i]}`, animation:`waveExpand 5s ease-out ${i*1.6}s infinite` }}/>))}
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:760 }}>
            <div style={{ fontSize:'0.62rem', letterSpacing:'0.5em', textTransform:'uppercase', color:'rgba(250,204,21,0.4)', marginBottom:36 }}>Complete · Sunflowers x Flow</div>
            <h1 style={{ fontSize:'clamp(2.2rem,8vw,5rem)', fontWeight:700, color:'#e8e8ed', letterSpacing:1, marginBottom:32, animation:'mmm-reveal 2s ease-out 0.5s both', lineHeight:1.1 }}>CRACK.<br/>SPIT.<br/>EAT.</h1>
            <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.4vw,1.25rem)', color:'rgba(210,200,255,0.55)', lineHeight:1.8, marginBottom:44, animation:'mmm-fadeUp 1.5s ease-out 1.5s both' }}>Clear goals, instant feedback, cheap failure.<br/>Everything flow needs,<br/>except a staircase to climb.</p>
            <div style={{ background:'rgba(250,204,21,0.06)', border:'1px solid rgba(250,204,21,0.15)', borderRadius:16, padding:'26px 36px', maxWidth:600, margin:'0 auto 48px', animation:'mmm-fadeUp 1.5s ease-out 2.2s both' }}>
              <p style={{ fontStyle:'italic', fontSize:'1.05rem', color:'rgba(220,200,255,0.72)', lineHeight:1.8 }}>“There’s never a moment where the activity is finished.”</p>
            </div>
            <div style={{ fontSize:'0.72rem', letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(255,255,255,0.18)', animation:'mmm-blink 2.5s ease-in-out 3.5s infinite' }}>*click anywhere to restart*</div>
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────────── */
    function App() {
      const [screen, setScreen] = useState(0);
      const go = n => setScreen(n);
      useEffect(() => { window.scrollTo(0, 0); }, [screen]);

      if (screen === 0) return <LandingScreen onNext={() => go(1)}/>;
      if (screen > PARTS.length) return <CompletionScreen onNext={() => go(0)}/>;
      const part = PARTS[screen - 1];
      const next = PARTS[screen];
      return (
        <Chapter key={screen} n={screen} label={part.label} title={part.title} nextLabel={next ? next.title : 'Finish'} onBack={() => go(screen - 1)} onNext={() => go(screen + 1)}>
          {part.body}
        </Chapter>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script src="../app-nav.js"></script>
</body>
</html>
