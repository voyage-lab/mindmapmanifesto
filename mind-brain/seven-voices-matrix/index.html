<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Seven Voices Matrix — MindMapManifesto</title>
  <meta name="description" content="Inha’s night as a matrix: her seven steps (the seven voices) crossed with the seven deadly sins, the seven heavenly virtues and Leonardo da Vinci’s seven principles, with the mindmap geo question behind every cell, and eight pictures to tap through."/>
  <meta property="og:title" content="The Seven Voices Matrix"/>
  <meta property="og:description" content="Inha’s night as a matrix: her seven steps (the seven voices) crossed with the seven deadly sins, the seven heavenly virtues and Leonardo da Vinci’s seven principles, with the mindmap geo question behind every cell, and eight pictures to tap through."/>
  <meta property="og:image" content="https://mindmapmanifesto.com/background.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050507; color: #e8e8ed; overflow-x: hidden; }
    @keyframes mmm-reveal { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes mmm-fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes mmm-blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    @keyframes waveExpand { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } }
    /* the matrix grid; classes beat theme-app.css's #root * overrides */
    .mx-grid { display: grid; grid-template-columns: 62px repeat(7, minmax(0, 1fr)); gap: 3px; margin-bottom: 14px; }
    #root .mx-colhead { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: .82rem !important; line-height: 1.1; color: var(--paper-dim) !important; }
    #root .mx-colhead span { writing-mode: vertical-rl; transform: rotate(180deg); }
    #root .mx-colhead small { display: none; }
    #root .mx-rowhead { display: flex; flex-direction: column; justify-content: center; padding-right: 4px; font-size: .74rem !important; line-height: 1.12; color: var(--paper-dim) !important; }
    #root .mx-rowhead b { font-family: "Caveat", cursive !important; font-size: 1.25rem; line-height: 1; color: var(--paper) !important; }
    #root .mx-cell { position: relative; min-height: 42px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px 3px; cursor: pointer; background: #1c1a17 !important; border: 1px solid rgba(233,227,214,.12) !important; transition: background .2s; }
    #root .mx-cell, #root .mx-cell * { color: var(--paper-dim) !important; }
    #root .mx-cell:hover { background: #2b2824 !important; }
    #root .mx-cell.obs { background: #1f2b23 !important; }
    #root .mx-cell.obs:hover { background: #29382e !important; }
    #root .mx-cell.inha { background: #e9e3d6 !important; }
    #root .mx-cell.inha, #root .mx-cell.inha * { color: #1a1918 !important; }
    #root .mx-cell.sel { outline: 2px solid #e9e3d6; outline-offset: 2px; z-index: 1; }
    #root .mx-cell:focus-visible { outline: 2px dashed #e9e3d6; outline-offset: 2px; }
    #root .mx-step { font-family: "Caveat", cursive !important; font-size: 1.35rem; font-weight: 700; line-height: 1; }
    #root .mx-name { display: none; font-size: .7rem !important; line-height: 1.15; }
    #root .mx-key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin-bottom: 30px; font-size: .95rem !important; }
    #root .mx-key span { display: inline-flex; align-items: center; gap: 8px; color: var(--paper-dim) !important; }
    #root .mx-swatch { width: 14px; height: 14px; display: inline-block; border: 1px solid rgba(233,227,214,.3) !important; }
    #root .mx-swatch.inha { background: #e9e3d6 !important; }
    #root .mx-swatch.obs { background: #1f2b23 !important; }
    @media (min-width: 720px) {
      .mx-grid { grid-template-columns: 116px repeat(7, minmax(0, 1fr)); }
      #root .mx-colhead { flex-direction: column; align-items: center; text-align: center; }
      #root .mx-colhead span { writing-mode: horizontal-tb; transform: none; font-weight: 600; color: var(--paper) !important; }
      #root .mx-colhead small { display: block; font-size: .74rem !important; line-height: 1.25; }
      #root .mx-colhead small:last-child { font-style: italic; }
      #root .mx-rowhead { font-size: .9rem !important; }
      #root .mx-cell { min-height: 62px; }
      #root .mx-name { display: block; }
      #root .mx-step { position: absolute; top: 2px; left: 5px; font-size: 1.05rem; }
    }
    /* the visuals; classes beat theme-app.css's #root * overrides */
    .vx-svg { display: block; width: 100%; max-width: 540px; margin: 0 auto 6px; overflow: visible; -webkit-user-select: none; user-select: none; }
    #root .vx-hit { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #root .vx-hit:focus { outline: none; }
    #root .vx-hit:focus-visible { outline: 2px dashed #e9e3d6; outline-offset: 2px; }
    #root .vx-hand { font-family: "Caveat", cursive !important; }
    #root .vx-ask { text-align: center; font-family: "Caveat", cursive !important; font-size: 1.55rem !important; line-height: 1.2; color: var(--paper-dim) !important; margin: 0 0 16px; }
    #root .vx-explored { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0 24px; font-size: .95rem !important; }
    #root .vx-explored span { margin-left: 8px; color: var(--paper-dim) !important; }
    #root .vx-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: rgba(233,227,214,.18) !important; transition: background .3s; }
    #root .vx-dot.on { background: #e9e3d6 !important; }
    #root .vx-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 20px; }
    #root .vx-chip { font-family: "Cormorant Garamond", Georgia, serif !important; font-size: 1.02rem !important; font-weight: 600 !important; letter-spacing: 0 !important; line-height: 1.2; min-width: 44px; min-height: 44px; padding: 6px 12px !important; border-radius: 4px !important; border: 1px solid rgba(233,227,214,.3) !important; background: #1c1a17 !important; color: #b9b2a3 !important; cursor: pointer; transition: background .2s; }
    #root .vx-chip.num { min-width: 40px; padding: 6px 0 !important; }
    #root .vx-chip.way { border-color: var(--c) !important; box-shadow: inset 4px 0 0 var(--c) !important; }
    #root .vx-chip.on { background: #e9e3d6 !important; color: #1a1918 !important; }
    #root .vx-chip:focus-visible { outline: 2px dashed #e9e3d6; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { #root .vx-svg * { transition: none !important; animation: none !important; } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
