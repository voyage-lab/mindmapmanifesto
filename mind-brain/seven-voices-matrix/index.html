  <script type="text/babel">
    const { useState, useEffect } = React;

    const SERIES = 'Seven Voices';
    const ACCENT = '#a78bfa';
    const NUMBERS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty','Twenty-One','Twenty-Two'];

    /* ── Shared Components ───────────────────────────────────────── */

    function ProgressBar({ pct }) {
      return (
        <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, height:3, background:'#14141c' }}>
          <div style={{ height:'100%', width:`${pct}%`, background:ACCENT, transition:'width 0.5s ease' }}/>
        </div>
      );
    }

    function Eyebrow({ children }) {
      return (
        <div style={{ fontSize:'0.7rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:16, display:'flex', alignItems:'center', gap:10, fontWeight:500 }}>
          <span style={{ width:28, height:1, background:ACCENT, opacity:0.5, flexShrink:0, display:'block' }}/>
          {children}
        </div>
      );
    }

    function StepIndicator({ current, total }) {
      return (
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.2em', textTransform:'uppercase', color:'#8888a0' }}>
          Part <span style={{ color:ACCENT, fontWeight:600 }}>{current}</span> of {total}
        </div>
      );
    }

    function ArrowRight({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>);
    }

    function ArrowLeft({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>);
    }

    function BackBtn({ onClick }) {
      return (
        <button onClick={onClick} style={{ display:'flex', alignItems:'center', gap:6, color:'#8888a0', background:'none', border:'none', cursor:'pointer', fontSize:'0.82rem' }}>
          <ArrowLeft size={15}/> Back
        </button>
      );
    }

    function BottomNav({ onBack, onNext, nextLabel = 'Continue' }) {
      return (
        <div style={{ display:'flex', justifyContent: onBack ? 'space-between' : 'flex-end', alignItems:'center', gap:16, marginTop:64, paddingTop:32, borderTop:'1px solid #1e1e2a' }}>
          {onBack && <BackBtn onClick={onBack}/>}
          <button onClick={onNext}
            style={{ display:'inline-flex', alignItems:'center', gap:9, padding:'13px 26px', borderRadius:12, fontSize:'0.875rem', fontWeight:600, border:'none', cursor:'pointer', background:`linear-gradient(135deg,${ACCENT},#7c3aed)`, color:'#fff', textAlign:'left' }}>
            {nextLabel} <ArrowRight/>
          </button>
        </div>
      );
    }

    function InsightCard({ label = 'Key Insight', children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}33`, borderRadius:18, padding:34, marginBottom:36, position:'relative' }}>
          <div style={{ fontSize:'0.68rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:14, fontWeight:600 }}>{label}</div>
          <p style={{ fontSize:'clamp(1.05rem,2.4vw,1.3rem)', lineHeight:1.72, color:'#e8e8ed', position:'relative' }}>{children}</p>
        </div>
      );
    }

    function Footer() { return <footer style={{ textAlign:'center', marginTop:56, color:'#8888a0', fontSize:'0.75rem' }}>© 2026 MindMapManifesto.com</footer>; }
    function PageWrapper({ children, maxWidth = 820 }) { return <div style={{ position:'relative', zIndex:1, maxWidth, margin:'0 auto', padding:'60px 24px 100px' }}>{children}</div>; }

    function Prose({ children }) {
      return <p style={{ fontSize:'clamp(0.95rem,2.1vw,1.1rem)', lineHeight:1.88, color:'rgba(220,215,240,0.72)', marginBottom:22 }}>{children}</p>;
    }

    function PullQuote({ children }) {
      return (
        <div style={{ borderLeft:`2px solid ${ACCENT}40`, paddingLeft:24, marginBottom:30, marginTop:4 }}>
          <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.2vw,1.18rem)', lineHeight:1.78, color:`${ACCENT}a0` }}>{children}</p>
        </div>
      );
    }

    /* a paper note with an optional label, title and intro line */
    function Card({ label, title, intro, children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'26px 28px', marginBottom:30 }}>
          {label && <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:`${ACCENT}99`, marginBottom: title ? 8 : 16, fontWeight:600 }}>{label}</div>}
          {title && <h3 style={{ fontSize:'1.35rem', fontWeight:700, color:'#e8e8ed', marginBottom:14 }}>{title}</h3>}
          {intro && <p style={{ fontSize:'1rem', lineHeight:1.65, color:'#b8b8c8', marginBottom: children ? 16 : 0 }}>{intro}</p>}
          {children}
        </div>
      );
    }

    function Points({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {items.map((t, i) => (
            <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
              <div style={{ width:5, height:5, borderRadius:'50%', background:ACCENT, flexShrink:0, opacity:0.6, marginTop:12 }}/>
              <p style={{ fontSize:'1rem', lineHeight:1.65, color:'rgba(220,215,240,0.78)' }}>{t}</p>
            </div>
          ))}
        </div>
      );
    }

    function Steps({ items, start = 1 }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {items.map((t, i) => (
            <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
              <div style={{ width:28, height:28, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, border:`1px solid ${ACCENT}55`, fontSize:'0.78rem', marginTop:1 }}>{i + start}</div>
              <p style={{ fontSize:'1rem', lineHeight:1.65, color:'rgba(220,215,240,0.78)' }}>{t}</p>
            </div>
          ))}
        </div>
      );
    }

    function Terms({ items }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {items.map(([t, d], i) => (
            <div key={i} style={{ borderLeft:`2px solid ${ACCENT}4d`, paddingLeft:14 }}>
              <div style={{ fontWeight:700, fontSize:'1.1rem', color:'#e8e8ed', marginBottom:2 }}>{t}</div>
              <p style={{ fontSize:'0.95rem', color:'#8888a0', lineHeight:1.6 }}>{d}</p>
            </div>
          ))}
        </div>
      );
    }

    function Chapter({ children, n, label, title, nextLabel, onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <ProgressBar pct={n / PARTS.length * 100}/>
          <PageWrapper>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:56 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={n} total={PARTS.length}/>
            </nav>
            <div style={{ marginBottom:36, animation:'mmm-fadeUp 0.7s ease-out' }}>
              <Eyebrow>{label}</Eyebrow>
              <h1 style={{ fontSize:'clamp(1.9rem,4.6vw,2.95rem)', fontWeight:700, lineHeight:1.18, marginBottom:8, color:'#e8e8ed' }}>{title}</h1>
            </div>
            {children}
            <BottomNav onBack={onBack} onNext={onNext} nextLabel={nextLabel}/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── The matrix: data ────────────────────────────────────────── */

    /* the seven voices: the seven steps Inha took that night, in order */
    const VOICES = ['Conscious mind','Con man','Fear-driven','Ego defense','Self-saboteur','The ego','Observer'];

    /* the seven ways: each deadly sin, its heavenly virtue, and the principle of Leonardo’s that bridges them */
    const WAYS = [
      { sin:'Pride',    virtue:'Humility',   principle:'Dimostrazione (demonstration)',  color:'#c084fc', icon:'flask', gist:'Test knowledge through experience and be willing to learn from mistakes.', ask:'What would prove me wrong?', why:'Pride can’t be wrong. Dimostrazione (demonstration) is the habit of letting experience prove you wrong.' },
      { sin:'Greed',    virtue:'Charity',    principle:'Connessione (connection)',    color:'#fbbf24', icon:'web', gist:'Recognise that everything connects to everything else: systems thinking.', ask:'What does the whole picture look like?', why:'Greed sees separate pieces to take. Connessione (connection) sees one web, where whatever you take, you take from the whole.' },
      { sin:'Lust',     virtue:'Chastity',   principle:'Corporalità (physicality)',    color:'#f472b6', icon:'body', gist:'Cultivate grace, fitness and poise.', ask:'What does my body actually need?', why:'Lust uses the body as currency. Corporalità (physicality) lives in it with grace.' },
      { sin:'Envy',     virtue:'Kindness',   principle:'Curiosità (curiosity)',      color:'#4ade80', icon:'ask', gist:'An insatiable curiosity: keep asking questions, especially the ones that seem childish.', ask:'What is really going on with them?', why:'Envy compares. Curiosity asks.' },
      { sin:'Gluttony', virtue:'Temperance', principle:'Sensazione (sensation)',     color:'#fb923c', icon:'eye', gist:'Sharpen the senses, above all sight. Leonardo complained that people “look without seeing.”', ask:'What am I actually tasting, seeing, feeling?', why:'Gluttony swallows without tasting. A sharpened sense is satisfied with less.' },
      { sin:'Wrath',    virtue:'Patience',   principle:'Sfumato (up in smoke)',        color:'#f87171', icon:'smoke', gist:'The willingness to sit with ambiguity and uncertainty without forcing an answer.', ask:'Can I leave this open a little longer?', why:'Wrath forces an answer now. Sfumato (up in smoke) lets the smoke clear.' },
      { sin:'Sloth',    virtue:'Diligence',  principle:'Arte (art) / Scienza (science)', color:'#60a5fa', icon:'compass', gist:'Balance logic and imagination; whole-brain thinking.', ask:'What is the vision, and what is the next step?', why:'Sloth is a dream without a method, or a method without a dream. Arte (art) / Scienza (science) joins the two.' },
    ];

    /* the 49 shadow states of mindmap geo, by way then voice: [state, the question it asks, the brain-wave piece that answers it] */
    const SHADOW = [
      [['False Modesty','Is hypnosis just for people who can’t fix themselves?',9], ['Status Signaling','Do high performers and CEOs use hypnotherapy?',3], ['Anxious Pride','Will people judge me if they find out I see a hypnotherapist?',8], ['Intellectual Superiority','Why does hypnosis work on skeptical, analytical minds?',13], ['Isolation','I’ve tried everything alone — is hypnosis a last resort?',15], ['I AM Special','Can hypnosis unlock the version of me I know is in there?',3], ['Witnessing Pride','Why do I resist anything that asks me to let go of control?',8]],
      [['Strategic Generosity','What’s the cheapest, most efficient way to do hypnosis?',9], ['Resource Hoarding','How many sessions does hypnosis actually take to work?',6], ['Scarcity Panic','How fast can I rewire my brain?',6], ['Justified Taking','Can I just learn self-hypnosis instead of paying anyone?',13], ['Financial Ruin','I’ve spent thousands on therapy — will hypnosis finally work?',15], ['I AM Mine','How do I take back ownership of my own mind?',1], ['Witnessing Greed','Why do I always chase the next self-help shortcut?',4]],
      [['Romantic Idealism','Can hypnosis make me more magnetic?',3], ['Seduction','Does hypnosis actually make you more attractive?',3], ['Desperate Need','Can hypnosis fix my anxious attachment style?',6], ['Sexual Power','Can hypnosis enhance intimacy and confidence?',6], ['Toxic Affairs','How do I break free from someone I’m obsessed with?',15], ['I AM Desire','How do I become someone people are drawn to?',14], ['Witnessing Lust','Why do I keep chasing the same toxic pattern?',6]],
      [['Comparison','Why do calm people seem to have it all figured out?',4], ['Sabotage','Why do I sabotage myself right before I succeed?',6], ['Jealous Panic','How do I stop comparing myself to everyone online?',4], ['Fairness Trap','Why does everyone else’s brain seem to work better than mine?',2], ['Self-Deprecation','Can hypnosis help when I genuinely hate myself?',6], ['I AM Lack','How do I stop feeling like I’m not enough?',6], ['Witnessing Envy','Why am I jealous of people who seem at peace?',5]],
      [['Consumption','Can hypnosis help me stop overeating?',6], ['Bingeing','How does hypnosis stop binge eating at night?',10], ['Emotional Eating','Why do I eat when I’m not even hungry?',6], ['Deserved Reward','How do I stop using food as a reward?',15], ['Addiction','Can hypnosis cure addiction?',6], ['I AM Hunger','Why do I never feel full no matter what I consume?',6], ['Witnessing Hunger','Why does nothing I consume actually satisfy me?',11]],
      [['Passive Aggression','Can hypnosis help me stop bottling up anger?',6], ['Explosive Outbursts','How do I stop snapping at the people I love?',4], ['Panic Attacks','Can hypnosis stop panic attacks?',5], ['Righteous Anger','How do I let go of anger I think is justified?',6], ['Bridge Burning','How do I stop destroying every relationship?',6], ['I AM Fire','Why do I feel rage I can’t explain?',15], ['Witnessing Anger','Why am I so angry at everyone all the time?',4]],
      [['Procrastination','Can hypnosis cure procrastination?',11], ['Avoidance','Why do I avoid the things that matter most?',6], ['Paralysis','Why do I freeze the moment I need to act?',4], ['Rebellion','Why do I rebel against my own goals?',6], ['Apathy','I don’t care about anything anymore — can hypnosis help?',7], ['I AM Stuck','Why does my life feel frozen in place?',4], ['Witnessing Inertia','Why do I keep choosing the same unhappy life?',15]],
    ];

    /* the 7 voices × the 7 heavenly virtues: how each voice lives each virtue, by voice then way */
    const VIRTUE = [
      ['Practicing modesty in public identity','Donating resources with expectations','Setting boundaries for self-respect','Being nice to gain social approval','Controlling desires through willpower','Tolerating frustration for future reward','Working hard to prove worth'],
      ['Using humility to manipulate others','Strategic giving for future leverage','Selective purity for better deals','Targeted kindness to useful people','Calculated restraint for maximum gain','Waiting for the perfect advantage','Working smart not hard to get ahead'],
      ['Self-deprecation to avoid criticism','Giving to avoid feelings of guilt','Avoiding intimacy due to fear of pain','Being kind to avoid conflict or rejection','Restraint from fear of consequences','Passive response to avoid confrontation','Busyness to avoid deeper fears'],
      ['False humility to protect self-image','Giving to maintain moral self-image','Judging others’ impurity harshly','Using kindness as moral superiority','Using restraint to judge others’ excess','Suppressing anger only to explode later','Perfectionism to avoid criticism'],
      ['Excessive self-effacement to avoid growth','Giving away too much to sabotage success','Severing connections before intimacy forms','People-pleasing to personal detriment','Extreme restriction leading to breakdowns','Chronic suppression causing depression','Exhaustion from unsustainable effort'],
      ['“My humility makes me better than others”','“My generosity proves my moral worth”','“My purity makes me superior to others”','“My kindness makes me deserving of love”','“My self-control proves my superiority”','“My patience shows I’m spiritually advanced”','“My hard work makes me more valuable”'],
      ['Authentic humility without self-focus','Giving from genuine abundance','Honoring genuine connection','Extending compassion without conditions','Natural balance without strain','Embracing life’s flow with equanimity','Engaged action without attachment to outcome'],
    ];

    /* the 7 voices × Leonardo’s seven, by voice then way: the same rule as the virtues, only the observer lives them clean */
    const LEO = [
      ['Sharing the wins, hiding the failed tests','Collecting contacts to look connected','Grooming the body for the camera','Curious how it looks, not what it is','Looking without seeing','Staying vague to keep options open','Working by the book, no imagination'],
      ['Testing people to see what they’ll pay','Mapping people by what they’re worth','Using looks and touch as leverage','Asking questions to find leverage','Reading people in order to work them','Using ambiguity as cover','Imagination for the story, logic for the angle'],
      ['Never testing, in case it fails','Clinging to every tie in case you need it','Training out of fear of decline','Scanning everything for danger','Senses on alert, never at rest','Frozen in the fog of not knowing','Over-planning so you never start'],
      ['Ruling it out without ever trying it','Blaming the system to avoid your part','Judging other bodies to feel better','Questioning everyone except yourself','Seeing only what confirms the story','“It’s complicated,” to dodge the blame','Logic to justify, imagination to excuse'],
      ['Repeating the experiment that hurts you','Taking on everyone’s problems as your own','Pushing a sick body past its limits','Chasing every question, finishing nothing','Numbing the senses to keep going','Drifting until the deadline hits','All effort, no method, until you break'],
      ['“My experience means I’m always right”','“Everything connects back to me”','“My body is my worth”','“My curiosity makes me deeper than others”','“My taste is finer than yours”','“I’m too complex to be understood”','“I’m the visionary; the work is for others”'],
      ['Letting experience prove you wrong, gladly','Seeing yourself as part of the whole','Living in the body with ease and grace','Wonder with no agenda','Seeing what is actually there','Resting calmly in not knowing','Imagination and method working as one'],
    ];

    /* the brain-wave pieces the mindmap geo questions lead to */
    const DEST = {
      1:['01-what-does-hypnosis-actually-do','What Does Hypnosis Actually Do to Your Brain?'],
      2:['02-the-5-brain-wave-states','The 5 Brain Wave States Explained Simply'],
      3:['03-what-gamma-waves-are','What Gamma Waves Are'],
      4:['04-what-beta-waves-are','What Beta Waves Are and Why Most of Us Are Stuck There'],
      5:['05-what-alpha-waves-are','What Alpha Waves Are and Why They Matter'],
      6:['06-what-theta-waves-are','What Theta Waves Are and Why They Are So Powerful'],
      7:['07-what-delta-waves-are','What Delta Waves Are'],
      8:['08-why-hypnosis-is-not-sleep','Why Hypnosis Is Not Sleep'],
      9:['09-you-already-enter-hypnotic-state','You Already Enter a Hypnotic State Every Day'],
      10:['10-feeling-before-you-fall-asleep','That Feeling Before You Fall Asleep'],
      11:['11-groggy-sunday-morning','That Groggy Sunday Morning Feeling'],
      12:['12-gateway-into-trance','The Gateway Into Trance'],
      13:['13-hypnotherapy-makes-something-deliberate','Hypnotherapy Does Not Create Something New'],
      14:['14-difference-alpha-and-theta','The Difference Between Alpha and Theta'],
      15:['15-why-brain-more-open-to-change','Why Your Brain Is More Open to Change'],
    };

    /* Inha’s night: the cell [voice, way] each step was taken in */
    const INHA = [
      { cell:[0,3], title:'The Surface Appeal', moment:'Tried on my yellow glasses and reached for her phone: “They’re sexy, make me look like a pornstar.”' },
      { cell:[1,2], title:'The Con Man Emerges', moment:'Moved closer, a hand on my shoulder: looks and proximity as leverage.' },
      { cell:[2,1], title:'Fear Takes the Wheel', moment:'“My documents to stay in the country are expiring next week.” She had 15,000 and needed 25,000 more.' },
      { cell:[3,0], title:'The Defense Wall', moment:'“No… it won’t work.” She never even called the contact.' },
      { cell:[4,6], title:'The Self-Saboteur’s Performance', moment:'Sick, working nights “like a dog,” pushing through on cold and flu medicine.' },
      { cell:[5,1], title:'The Ultimate Deception', moment:'“You forgot to pay… it’s 450.” A bill for a shot that was already paid.' },
      { cell:[6,5], title:'The Observer Awakens', moment:'I paid my actual bill and walked away. No drama, no anger.' },
    ];
    /* David’s day (a story): the same seven steps, every one taken through a virtue, each virtue once */
    const DAVID = [
      { cell:[0,4], title:'The Disciplined Morning', moment:'Cold shower at 5:30, no breakfast, and “not for me, thanks” to the birthday cake.' },
      { cell:[1,1], title:'The Favour Bank', moment:'“Happy to take the Henderson account again this weekend.” Three weekends, banked.' },
      { cell:[2,5], title:'It’s Fine', moment:'Clapped the loudest for Marc’s promotion, shook in the bathroom, and never asked why.' },
      { cell:[3,0], title:'I Didn’t Even Want It', moment:'“I didn’t even want it. I’m not a title person.”' },
      { cell:[4,6], title:'Midnight at the Office', moment:'Rebuilt Marc’s deck until 1:40 a.m., with three missed calls from Lena.' },
      { cell:[5,3], title:'The Ledger', moment:'“Do you know how much I do for everyone? The least I deserve is someone on my side.”' },
      { cell:[6,2], title:'David Sees It', moment:'“I wanted it. I really wanted it. And I’m hurt.”' },
    ];
    const PATHS = { Inha: INHA, David: DAVID };
    const stepAt = (r, c, path = INHA) => path.findIndex(s => s.cell[0] === r && s.cell[1] === c) + 1;

    /* ── The matrix: components ──────────────────────────────────── */

    /* a cell’s three faces: the sin, the virtue and Leonardo’s principle, as one voice lives them */
    function Faces({ r, c, only = [0, 1, 2] }) {
      const w = WAYS[c];
      const faces = [
        [`Sin · ${w.sin}`, SHADOW[c][r][0]],
        [`Virtue · ${w.virtue}`, VIRTUE[r][c]],
        [`Leonardo · ${w.principle}`, LEO[r][c]],
      ];
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {only.map(i => (
            <div key={i} style={{ borderLeft:`2px solid ${ACCENT}4d`, paddingLeft:14 }}>
              <div style={{ fontSize:'0.66rem', letterSpacing:'0.2em', textTransform:'uppercase', marginBottom:4, fontWeight:600 }}>{faces[i][0]}</div>
              <div style={{ fontWeight:700, fontSize:'1.15rem', lineHeight:1.35 }}>{faces[i][1]}</div>
            </div>
          ))}
        </div>
      );
    }

    function CellCard({ r, c, label, moment = true, who = 'Inha' }) {
      const w = WAYS[c];
      const [state, question, dest] = SHADOW[c][r];
      const path = PATHS[who], step = stepAt(r, c, path);
      return (
        <Card label={label || `${VOICES[r]} × ${w.sin} ↔ ${w.virtue} · ${w.principle}`}>
          <Faces r={r} c={c}/>
          <p style={{ fontSize:'1rem', lineHeight:1.65, marginTop:20 }}>
            <strong>Mindmap geo.</strong> {state} asks: “{question}” <a href={`../15-brain-waves/${DEST[dest][0]}.html`}>{DEST[dest][1]} →</a>
          </p>
          {moment && step > 0 && (
            <p style={{ fontSize:'1rem', lineHeight:1.65, marginTop:12 }}><strong>{who === 'Inha' && step === 7 ? 'Step 7, the observer.' : `${who}, step ${step}.`}</strong> {path[step - 1].moment}</p>
          )}
        </Card>
      );
    }

    /* the bottom row of a column: the same way, lived from the observer */
    function ObserverCard({ c, children }) {
      const w = WAYS[c];
      return (
        <Card label={`The observer’s way · ${w.virtue} · ${w.principle}`}>
          <Faces r={6} c={c} only={[1, 2]}/>
          {children && <p style={{ fontSize:'1rem', lineHeight:1.65, marginTop:18 }}>{children}</p>}
        </Card>
      );
    }

    function Matrix() {
      const [who, setWho] = useState('Inha');
      const [[r, c], setSel] = useState(INHA[0].cell);
      const choose = name => { setWho(name); setSel(PATHS[name][0].cell); };
      return (
        <div>
          <div className="vx-chips">
            {Object.keys(PATHS).map(name => <button key={name} className={`vx-chip${name === who ? ' on' : ''}`} aria-pressed={name === who} onClick={() => choose(name)}>{name}’s path</button>)}
          </div>
          <div className="mx-grid" role="group" aria-label="The seven voices matrix: seven voices down, seven ways across">
            <div/>
            {WAYS.map(w => <div key={w.sin} className="mx-colhead"><span>{w.sin}</span><small>{w.virtue}</small><small>{w.principle}</small></div>)}
            {VOICES.map((v, ri) => (
              <React.Fragment key={v}>
                <div className="mx-rowhead"><b>{ri + 1}</b>{v}</div>
                {WAYS.map((w, ci) => {
                  const step = stepAt(ri, ci, PATHS[who]);
                  const on = ri === r && ci === c;
                  const cls = ['mx-cell', ri === 6 && 'obs', step && 'inha', on && 'sel'].filter(Boolean).join(' ');
                  return (
                    <div key={w.sin} className={cls} role="button" tabIndex={0} aria-pressed={on}
                      aria-label={`${v} × ${w.sin}: ${SHADOW[ci][ri][0]}${step ? `, step ${step}` : ''}`}
                      onClick={() => setSel([ri, ci])}
                      onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSel([ri, ci]); } }}>
                      {step > 0 && <span className="mx-step">{step}</span>}
                      <span className="mx-name">{SHADOW[ci][ri][0]}</span>
                    </div>
                  );
                })}
              </React.Fragment>
            ))}
          </div>
          <div className="mx-key">
            <span><i className="mx-swatch inha"/>{who}’s path, by step</span>
            <span><i className="mx-swatch obs"/>The observer row</span>
          </div>
          <CellCard r={r} c={c} who={who}/>
        </div>
      );
    }

    /* where we are on the night’s seven steps */
    function PathTrack({ current }) {
      return (
        <div role="img" aria-label={`Step ${current} of 7: ${VOICES[current - 1]}`} style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:32 }}>
          {VOICES.map((v, i) => (
            <div key={v} style={{ minWidth:32, height:32, padding:'0 9px', borderRadius:4, display:'flex', alignItems:'center', justifyContent:'center', border:`1px solid ${ACCENT}66`, fontSize:'0.85rem', opacity: i + 1 === current ? 1 : 0.35 }}>
              {i + 1 === current ? `${i + 1} · ${v}` : i + 1}
            </div>
          ))}
        </div>
      );
    }

    /* ── The visuals: the same map in eight pictures ─────────── */

    const SHORT = ['Conscious','Con man','Fear','Defense','Saboteur','Ego','Observer'];

    /* what each voice wants, and how it showed up that night */
    const VOICE_INFO = [
      { wants:'To be seen: status, image, appearance as currency.', night:'Inha tried on my yellow glasses and reached for her phone.' },
      { wants:'An angle: people as a means to an end.', night:'Inha moved closer, a hand on my shoulder.' },
      { wants:'Safety, now: never enough, always urgent.', night:'“My documents are expiring next week.”' },
      { wants:'To never be wrong: the wall goes up.', night:'“No… it won’t work.” She never even called.' },
      { wants:'To fall before anyone can stop it.', night:'Sick, working nights “like a dog,” still pushing.' },
      { wants:'To be the story: it manufactures reality.', night:'“You forgot to pay… it’s 450.”' },
      { wants:'Nothing. It sees every step and takes none of them.', night:'I paid my actual bill and walked away.' },
    ];

    /* Leonardo’s own order of the seven, as indexes into WAYS */
    const GELB = [3, 0, 4, 5, 6, 2, 1];

    /* ── Shared bits for the visuals ─────────────────────────────── */

    /* makes an svg shape act as a button: click, Enter or Space */
    const tap = (fn, label, pressed) => ({
      role:'button', tabIndex:0, 'aria-label':label, 'aria-pressed':pressed, onClick:fn,
      onKeyDown:e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } },
    });

    /* the selected item, plus every item tapped so far */
    function useExplore(first) {
      const [sel, setSel] = useState(first);
      const [seen, setSeen] = useState(() => new Set(first == null ? [] : [first]));
      const pick = i => { setSel(i); setSeen(s => new Set(s).add(i)); };
      const reset = () => { setSel(first); setSeen(new Set(first == null ? [] : [first])); };
      return [sel, pick, seen, reset];
    }

    function Ask({ children }) { return <div className="vx-ask">{children}</div>; }

    function Explored({ count, total = 7 }) {
      return (
        <div className="vx-explored" aria-live="polite">
          {Array.from({ length: total }, (_, i) => <i key={i} className={`vx-dot${i < count ? ' on' : ''}`}/>)}
          <span>{count >= total ? 'All seen' : `Seen ${count} of ${total}`}</span>
        </div>
      );
    }

    /* the paper note under each picture; re-mounts (and fades in) when k changes */
    function Reveal({ k, label, title, children }) {
      return <div key={k} style={{ animation:'mmm-fadeUp 0.45s ease-out' }}><Card label={label} title={title}>{children}</Card></div>;
    }

    function Line({ children }) { return <p style={{ fontSize:'1.05rem', lineHeight:1.6, marginBottom:8 }}>{children}</p>; }

    /* small line drawings for Leonardo’s seven */
    function Icon({ name, color }) {
      const p = { fill:'none', stroke:color, strokeWidth:1.8, strokeLinecap:'round', strokeLinejoin:'round' };
      switch (name) {
        case 'ask': return <text x="0" y="9" textAnchor="middle" fontSize="27" fontWeight="700" fill={color} className="vx-hand">?</text>;
        case 'flask': return <path {...p} d="M-5,-11 L5,-11 M-3,-11 L-3,-3 L-10,10 L10,10 L3,-3 L3,-11 M-7,5 L7,5"/>;
        case 'eye': return <g {...p}><path d="M-13,0 Q0,-11 13,0 Q0,11 -13,0 Z"/><circle r="4"/></g>;
        case 'smoke': return <g {...p}><path d="M-11,7 q5.5,-5 11,0 t11,0"/><path d="M-9,0 q4.5,-5 9,0 t9,0"/><path d="M-6,-7 q3,-4 6,0 t6,0"/></g>;
        case 'compass': return <g {...p}><circle cy="-10" r="2.5"/><path d="M-1,-8 L-8,11 M1,-8 L8,11 M-5,3 Q0,6 5,3"/></g>;
        case 'body': return <g {...p}><circle cy="-9" r="3.2"/><path d="M0,-5.5 L0,4 M-11,-2 L11,-2 M0,4 L-7,12 M0,4 L7,12"/></g>;
        case 'web': return <g {...p}><path d="M-9,-7 L9,-8 L8,8 L-7,9 Z M-9,-7 L8,8 M9,-8 L-7,9"/>{[[-9,-7],[9,-8],[8,8],[-7,9],[0,0]].map(([x, y], i) => <circle key={i} cx={x} cy={y} r="2.2" fill={color}/>)}</g>;
        default: return null;
      }
    }

    /* the 7×7 matrix in miniature: coloured columns, voice rows, optional bands, path and marked cells */
    function MiniGrid({ cells = {}, path = [], row, col, label }) {
      const x0 = 80, y0 = 66, s = 36;
      const cx = c => x0 + c * s + s / 2, cy = r => y0 + r * s + s / 2;
      return (
        <svg viewBox="0 0 360 330" className="vx-svg" role="img" aria-label={label}>
          {WAYS.map((w, c) => <text key={w.sin} transform={`translate(${cx(c) + 4} ${y0 - 6}) rotate(-90)`} fontSize="12" fontWeight="700" fill={w.color}>{w.sin}</text>)}
          {VOICES.map((v, r) => <text key={v} x={x0 - 8} y={cy(r) + 4} fontSize="12" textAnchor="end" fill={r === 6 ? '#e9e3d6' : '#b9b2a3'}>{r + 1} {SHORT[r]}</text>)}
          {row != null && <rect x={x0} y={y0 + row * s} width={7 * s} height={s} fill="#e9e3d6" fillOpacity="0.1"/>}
          {col != null && <rect x={x0 + col * s} y={y0} width={s} height={7 * s} fill={WAYS[col].color} fillOpacity="0.14"/>}
          {VOICES.map((v, r) => WAYS.map((w, c) => {
            const k = cells[`${r},${c}`];
            return <rect key={`${r},${c}`} x={x0 + c * s + 2} y={y0 + r * s + 2} width={s - 4} height={s - 4} rx="2" fill={k ? k.fill : w.color} fillOpacity={k ? 1 : (r === 6 ? 0.24 : 0.1)} stroke={k && k.stroke} strokeWidth="3"/>;
          }))}
          {path.length > 1 && <polyline points={path.map(([r, c]) => `${cx(c)},${cy(r)}`).join(' ')} fill="none" stroke="#e9e3d6" strokeWidth="2" strokeDasharray="4 3" strokeLinejoin="round"/>}
          {Object.keys(cells).map(key => {
            const [r, c] = key.split(',').map(Number);
            return cells[key].text ? <text key={key} x={cx(c)} y={cy(r) + 6} textAnchor="middle" fontSize="18" fontWeight="700" fill="#1a1918" className="vx-hand">{cells[key].text}</text> : null;
          })}
        </svg>
      );
    }

    /* ── Visual 1: six steps down, one eye above ─────────────────── */
    function Stairs() {
      const [sel, pick, seen] = useExplore(0);
      const shades = ['#e2d8c6','#c9bca6','#ad9f88','#8f816b','#716552','#54493b'];
      const steps = shades.map((_, i) => ({ x: 14 + i * 38, y: 92 + i * 34 }));
      const eye = { x: 296, y: 46 };
      const info = VOICE_INFO[sel];
      return (
        <div>
          <Ask>Tap each step, then the eye</Ask>
          <svg viewBox="0 0 360 312" className="vx-svg" role="group" aria-label="Six steps going down, and an eye above them">
            {steps.map((s, i) => <line key={i} x1={eye.x} y1={eye.y + 14} x2={s.x + 136} y2={s.y + 14} stroke="#e9e3d6" strokeOpacity={sel === 6 ? 0.6 : 0.14} strokeDasharray="3 4" style={{ transition:'stroke-opacity .5s' }}/>)}
            <text x="14" y="80" fontSize="17" fill="#b9b2a3" className="vx-hand">the surface</text>
            <text x="340" y="308" fontSize="17" fill="#b9b2a3" textAnchor="end" className="vx-hand">deepest</text>
            {steps.map((s, i) => (
              <g key={i} className="vx-hit" {...tap(() => pick(i), `Step ${i + 1}: ${VOICES[i]}`, sel === i)}>
                <rect x={s.x} y={s.y} width="136" height="28" rx="3" fill={shades[i]} stroke={sel === i ? '#ffffff' : 'none'} strokeWidth="2.5"/>
                <text x={s.x + 10} y={s.y + 19} fontSize="13.5" fontWeight="600" fill={i < 3 ? '#1a1918' : '#f3eee4'}>{i + 1} · {VOICES[i]}</text>
                {seen.has(i) && sel !== i && <circle cx={s.x + 126} cy={s.y + 14} r="3" fill={i < 3 ? '#1a1918' : '#f3eee4'}/>}
              </g>
            ))}
            <g className="vx-hit" {...tap(() => pick(6), 'Step 7: Observer, the eye above', sel === 6)}>
              <circle cx={eye.x} cy={eye.y} r="36" fill="#000" fillOpacity="0.001"/>
              <path d={`M${eye.x - 28},${eye.y} Q${eye.x},${eye.y - 24} ${eye.x + 28},${eye.y} Q${eye.x},${eye.y + 24} ${eye.x - 28},${eye.y} Z`} fill={sel === 6 ? '#e9e3d6' : 'none'} fillOpacity="0.12" stroke={sel === 6 ? '#ffffff' : '#e9e3d6'} strokeWidth={sel === 6 ? 2.5 : 1.8}/>
              <circle cx={eye.x} cy={eye.y} r="8.5" fill="#e9e3d6"/>
              <circle cx={eye.x} cy={eye.y} r="3.6" fill="#0d0d0d"/>
              <text x={eye.x} y={eye.y + 40} textAnchor="middle" fontSize="13.5" fontWeight="600" fill="#e9e3d6">7 · Observer</text>
            </g>
          </svg>
          <Explored count={seen.size}/>
          <Reveal k={sel} label={sel === 6 ? 'Step 7 · not a step: the eye above' : `Step ${sel + 1} of 6, going down`} title={VOICES[sel]}>
            <Line><strong>Wants:</strong> {info.wants}</Line>
            <Line><strong>That night:</strong> {info.night}</Line>
          </Reveal>
        </div>
      );
    }

    /* ── Visual 2: seven seesaws, sin on the left, virtue on the right, Leonardo as the pivot ── */
    function Seesaws() {
      const [sel, setSel] = useState(null);
      const [tipped, setTipped] = useState(() => new Set());
      const [seen, setSeen] = useState(() => new Set());
      const flip = j => {
        setSel(j);
        setSeen(s => new Set(s).add(j));
        setTipped(t => { const n = new Set(t); if (n.has(j)) n.delete(j); else n.add(j); return n; });
      };
      const w = sel == null ? null : WAYS[sel];
      return (
        <div>
          <Ask>Tap each seesaw to tip it</Ask>
          <svg viewBox="0 0 360 512" className="vx-svg" role="group" aria-label="Seven seesaws: each sin on the left, its virtue on the right, Leonardo’s principle as the pivot">
            {WAYS.map((W, j) => {
              const cy = 48 + j * 70, on = tipped.has(j);
              return (
                <g key={W.sin} className="vx-hit" {...tap(() => flip(j), `${W.sin} or ${W.virtue}, pivot ${W.principle}`, on)}>
                  <rect x="8" y={cy - 44} width="344" height="70" fill="#000" fillOpacity="0.001"/>
                  <g style={{ transform:`rotate(${on ? 6 : -6}deg)`, transformOrigin:`180px ${cy}px`, transition:'transform .8s cubic-bezier(.34,1.56,.64,1)' }}>
                    <line x1="44" y1={cy} x2="316" y2={cy} stroke="#b9b2a3" strokeWidth="3" strokeLinecap="round"/>
                    <circle cx="58" cy={cy - 10} r="9" fill={W.color} fillOpacity={on ? 0.3 : 1}/>
                    <circle cx="302" cy={cy - 10} r="9" fill="#e9e3d6" fillOpacity={on ? 1 : 0.3}/>
                    <text x="44" y={cy - 25} fontSize="15" fontWeight="700" fill={W.color} fillOpacity={on ? 0.45 : 1}>{W.sin}</text>
                    <text x="316" y={cy - 25} fontSize="15" fontWeight="700" textAnchor="end" fill="#e9e3d6" fillOpacity={on ? 1 : 0.45}>{W.virtue}</text>
                  </g>
                  <path d={`M180,${cy + 2} L170,${cy + 17} L190,${cy + 17} Z`} fill={on ? W.color : '#6b655b'} style={{ transition:'fill .5s' }}/>
                  <text x="180" y={cy + 30} fontSize="11.5" fontStyle="italic" textAnchor="middle" fill="#b9b2a3">{W.principle}</text>
                </g>
              );
            })}
          </svg>
          <Explored count={seen.size}/>
          {w ? (
            <Reveal k={`${sel}-${tipped.has(sel)}`} label={`${w.sin} ↔ ${w.virtue}`} title={`The pivot: ${w.principle}`}>
              <Line>{w.why}</Line>
              <Line><strong>{tipped.has(sel) ? `Tipped to ${w.virtue}.` : `Back on ${w.sin}.`}</strong> Tap again to tip it back.</Line>
            </Reveal>
          ) : (
            <Reveal k="none" label="The pivot" title="Seven seesaws">
              <Line>Each sin sits on the left, its virtue on the right, and one of Leonardo’s principles is the pivot in the middle. Tap one to tip it.</Line>
            </Reveal>
          )}
        </div>
      );
    }

    /* ── Visual 3: Leonardo’s seven around the Vitruvian circle ──── */
    function Wheel() {
      const [sel, pick, seen] = useExplore(0);
      const w = WAYS[GELB[sel]];
      const lines = w.principle.includes(' / ')
        ? w.principle.split(' / ').map((t, i) => [i === 0 ? `${t} /` : t, 21])
        : [[w.principle.slice(0, w.principle.indexOf(' (')), 30], [w.principle.slice(w.principle.indexOf(' (') + 1), 17]];
      return (
        <div>
          <Ask>Tap each symbol on the circle</Ask>
          <svg viewBox="0 0 360 360" className="vx-svg" role="group" aria-label="Leonardo’s seven principles around a circle">
            <rect x="62" y="62" width="236" height="236" fill="none" stroke="#e9e3d6" strokeOpacity="0.1"/>
            <circle cx="180" cy="180" r="128" fill="none" stroke="#e9e3d6" strokeOpacity="0.18"/>
            {GELB.map((wi, k) => {
              const t = (-90 + k * 360 / 7) * Math.PI / 180;
              const x = 180 + 128 * Math.cos(t), y = 180 + 128 * Math.sin(t);
              const W = WAYS[wi], on = k === sel;
              return (
                <g key={k} className="vx-hit" transform={`translate(${x.toFixed(1)} ${y.toFixed(1)})`} {...tap(() => pick(k), W.principle, on)}>
                  <circle r="27" fill={on ? W.color : '#1c1a17'} stroke={W.color} strokeWidth="2"/>
                  <Icon name={W.icon} color={on ? '#1a1918' : '#e9e3d6'}/>
                  {seen.has(k) && !on && <circle cx="19" cy="-19" r="4" fill={W.color}/>}
                </g>
              );
            })}
            <g key={sel} style={{ animation:'mmm-fadeUp .4s ease-out' }}>

    /* ── Visual 4: two paths through the matrix ─────────────────── */
    function NightPath() {

            <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
              {INHA.map(({ cell:[r, c] }, i) => {
                const [state, question, dest] = SHADOW[c][r];
                return (
                  <div key={i} style={{ borderLeft:`2px solid ${ACCENT}4d`, paddingLeft:14 }}>
                    <div style={{ fontWeight:700, fontSize:'1.1rem', marginBottom:2 }}>{i + 1} · {state}</div>
                    <p style={{ fontSize:'1rem', lineHeight:1.6 }}>“{question}” <a href={`../15-brain-waves/${DEST[dest][0]}.html`}>{DEST[dest][1]} →</a></p>
                  </div>
                );
              })}
            </div>
          </Card>
          <InsightCard label="Cast the net">Write for one state and you reach her once. Write for all seven and every voice finds a door, <em>and every door opens onto a piece that already exists.</em></InsightCard>
          <Prose>The method behind it: <a href="../../mindmapgeo/index.html">mindmap x geo</a>.</Prose>
        </>,
      },
      {
        label: 'The lesson', title: 'The Way Up',
        body: <>
          <Card label="What the matrix shows">
            <Points items={[
              'The voice decides, not the column. Switching from a sin to its virtue inside the same voice changes the costume, not the step.',
              'Leonardo’s principles follow the same rule. Taken by fear, sfumato (up in smoke) is fog; taken by the ego, curiosity is a pose.',
              'Only the observer row lives each virtue and each principle as itself, and every column ends there.',
              'The observer was there the whole night. That is why each step could be seen, named and declined.',
            ]}/>
          </Card>
          <Card label="Seven observer questions" intro="When you catch yourself on a step, name the voice first. Then ask the observer’s question for the column you’re in.">
            <Terms items={[
              ['Pride · Dimostrazione (demonstration)', 'What would prove me wrong?'],
              ['Greed · Connessione (connection)', 'What does the whole picture look like?'],
              ['Lust · Corporalità (physicality)', 'What does my body actually need?'],
              ['Envy · Curiosità (curiosity)', 'What is really going on with them?'],
              ['Gluttony · Sensazione (sensation)', 'What am I actually tasting, seeing, feeling?'],
              ['Wrath · Sfumato (up in smoke)', 'Can I leave this open a little longer?'],
              ['Sloth · Arte (art) / Scienza (science)', 'What is the vision, and what is the next step?'],
            ]}/>
          </Card>
          <Prose>The full night is in <a href="../story-of-inha/index.html">the story of inha</a>, and Leonardo’s seven are in <a href="../davinci-perfect-man/index.html">da Vinci and the perfect man</a>.</Prose>
          <InsightCard label="Next: see it">The same map, drawn instead of written: <em>eight pictures, a few things to tap on each,</em> and one colour for each of the seven ways all the way through.</InsightCard>
        </>,
      },
      {
        label:'Picture 1 · The steps', title:'Seven Steps Down',
        body: <>
          <Stairs/>
          <InsightCard label="Notice">Six voices go down, one step at a time, from the surface to the deepest. <em>The seventh is not a step at all:</em> it is the eye above the stairs.</InsightCard>
        </>,
      },
      {
        label:'Picture 2 · The ways', title:'Fourteen Ways',
        body: <>
          <Seesaws/>
          <InsightCard label="Notice">Every step can be taken through a sin or through its virtue. <em>Leonardo’s principle is the pivot</em> that tips one into the other.</InsightCard>
        </>,
      },
      {
        label:'Picture 3 · The pivots', title:'Leonardo’s Seven',
        body: <>
          <Wheel/>
          <InsightCard label="Notice">Each symbol wears the colour of the sin it tips. <em>The same colours run through every picture.</em></InsightCard>
        </>,
      },
      {
        label:'Picture 4 · The paths', title:'Two Paths',
        body: <>
          <NightPath/>
          <InsightCard label="Notice">Inha’s night runs through the sins; David’s day takes one virtue at each step. <em>At steps four and five they stand in the very same cells,</em> on opposite faces.</InsightCard>
          <Prose>David’s day, in full: <a href="../story-of-david/index.html">the story of david</a>.</Prose>
        </>,
      },
      {
        label:'Picture 5 · One cell', title:'Three Faces',
        body: <>
          <ThreeFaces/>
          <InsightCard label="Notice">Sin, virtue and genius all speak in the same voice. <em>From the con man, all three are cons.</em></InsightCard>
        </>,
      },
      {
        label:'Picture 6 · The rule', title:'The Voice Decides',
        body: <>
          <Elevator/>
          <InsightCard label="Notice">Same virtue, seven floors. <em>The floor decides what the virtue becomes,</em> and only the top floor is clean.</InsightCard>
        </>,
      },
      {
        label:'Picture 7 · Mindmap geo', title:'Seven Doors',
        body: <>
          <Doors/>
          <InsightCard label="Notice">One person, one night, seven different questions. <em>Mindmap geo writes a door for every state.</em></InsightCard>
          <Prose>The method: <a href="../../mindmapgeo/index.html">mindmap x geo</a>.</Prose>
        </>,
      },
      {
        label:'Picture 8 · You', title:'Your Cell',
        body: <>
          <YourCell/>
          <Prose>The night itself: <a href="../story-of-inha/index.html">the story of inha</a>. Leonardo’s seven: <a href="../davinci-perfect-man/index.html">da Vinci and the perfect man</a>.</Prose>
        </>,
      },
    ].map((p, i) => ({ ...p, label: p.label || stepLabel(i - 1) }));

    /* ── Completion Screen ──────────────────────────────────────── */
    function CompletionScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', position:'relative', overflow:'hidden' }} onClick={onNext}>
          {[0, 1, 2].map(i => (<div key={i} style={{ position:'absolute', top:'50%', left:'50%', width:100+i*90, height:100+i*90, borderRadius:'50%', border:`1px solid ${['rgba(167,139,250,0.35)','rgba(232,232,237,0.2)','rgba(167,139,250,0.15)'][i]}`, animation:`waveExpand 5s ease-out ${i*1.6}s infinite` }}/>))}
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:760 }}>
            <div style={{ fontSize:'0.62rem', letterSpacing:'0.5em', textTransform:'uppercase', color:'rgba(167,139,250,0.45)', marginBottom:36 }}>Complete · Seven Voices</div>
            <h1 style={{ fontSize:'clamp(2.2rem,8vw,5rem)', fontWeight:700, color:'#e8e8ed', letterSpacing:1, marginBottom:32, animation:'mmm-reveal 2s ease-out 0.5s both', lineHeight:1.1 }}>SEVEN STEPS.<br/>TWENTY-ONE WAYS.<br/>ONE OBSERVER.</h1>
            <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.4vw,1.25rem)', color:'rgba(220,210,255,0.55)', lineHeight:1.8, marginBottom:44, animation:'mmm-fadeUp 1.5s ease-out 1.5s both' }}>Voices down, sins, virtues and Leonardo across.<br/>Every column ends<br/>in the same row.</p>
            <div style={{ background:'rgba(167,139,250,0.06)', border:'1px solid rgba(167,139,250,0.15)', borderRadius:16, padding:'26px 36px', maxWidth:600, margin:'0 auto 48px', animation:'mmm-fadeUp 1.5s ease-out 2.2s both' }}>
              <p style={{ fontStyle:'italic', fontSize:'1.05rem', color:'rgba(220,210,255,0.72)', lineHeight:1.8 }}>“I finished my beer, paid my actual bill, and walked away.”</p>
            </div>
            <div style={{ fontSize:'0.72rem', letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(255,255,255,0.18)', animation:'mmm-blink 2.5s ease-in-out 3.5s infinite' }}>*click anywhere to restart*</div>
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────────── */
    function App() {
      const [screen, setScreen] = useState(0);
      const go = n => setScreen(n);
      useEffect(() => { window.scrollTo(0, 0); }, [screen]);

      if (screen === 0) return <LandingScreen onNext={() => go(1)}/>;
      if (screen > PARTS.length) return <CompletionScreen onNext={() => go(0)}/>;
      const part = PARTS[screen - 1];
      const next = PARTS[screen];
      return (
        <Chapter key={screen} n={screen} label={part.label} title={part.title} nextLabel={next ? next.title : 'Finish'} onBack={() => go(screen - 1)} onNext={() => go(screen + 1)}>
          {part.body}
        </Chapter>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script src="../app-nav.js"></script>
</body>
</html>
