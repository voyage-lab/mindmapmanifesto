<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Creative Visualization — Part Three</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050507; color: #e8e8ed; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.05); }
    }
    @keyframes mmm-reveal {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes mmm-fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes mmm-blink {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.7; }
    }
    @keyframes waveExpand {
      0%   { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(52,211,153,0.3); border-radius: 2px; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../theme-app.css"/>
</head>
<body>
  <nav class="mb-nav" aria-label="Series navigation"><a href="index.html">← back to creative visualization</a><a href="part2-b.html" rel="prev">← part 2</a><a href="part4-b.html" rel="next">part 4 →</a></nav>
  <p class="mb-hint" aria-hidden="true">← → keys or swipe</p>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    /* ── Shared Components ───────────────────────────────────────── */

    function Orbs({ color1 = '#34d399', color2 = '#818cf8', opacity = 0.2 }) {
      return (
        <div style={{ position:'fixed', inset:0, zIndex:0, pointerEvents:'none', overflow:'hidden' }}>
          <div style={{ position:'absolute', width:580, height:580, borderRadius:'50%', background:color1, filter:'blur(130px)', opacity, top:'-15%', left:'-10%', animation:'orbFloat 18s ease-in-out infinite alternate' }}/>
          <div style={{ position:'absolute', width:420, height:420, borderRadius:'50%', background:color2, filter:'blur(130px)', opacity, bottom:'-10%', right:'-10%', animation:'orbFloat 20s ease-in-out infinite alternate-reverse' }}/>
        </div>
      );
    }

    function ProgressBar({ pct, colorA = '#34d399', colorB = '#818cf8' }) {
      return (
        <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, height:3, background:'#14141c' }}>
          <div style={{ height:'100%', width:`${pct}%`, background:`linear-gradient(90deg,${colorA},${colorB})`, transition:'width 0.5s ease' }}/>
        </div>
      );
    }

    function Eyebrow({ children, color = '#34d399' }) {
      return (
        <div style={{ fontSize:'0.7rem', letterSpacing:'0.2em', textTransform:'uppercase', color, marginBottom:16, display:'flex', alignItems:'center', gap:10, fontWeight:500 }}>
          <span style={{ width:28, height:1, background:color, opacity:0.5, flexShrink:0, display:'block' }}/>
          {children}
        </div>
      );
    }

    function StepIndicator({ current, total, color = '#34d399' }) {
      return (
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.2em', textTransform:'uppercase', color:'#8888a0' }}>
          Chapter <span style={{ color, fontWeight:600 }}>{current}</span> of {total}
        </div>
      );
    }

    function ArrowRight({ size = 16 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      );
    }

    function ArrowLeft({ size = 16 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
      );
    }

    function BackBtn({ onClick }) {
      return (
        <button onClick={onClick}
          style={{ display:'flex', alignItems:'center', gap:6, color:'#8888a0', background:'none', border:'none', cursor:'pointer', fontSize:'0.82rem', fontFamily:'Inter,sans-serif' }}
          onMouseEnter={e => e.currentTarget.style.color = '#e8e8ed'}
          onMouseLeave={e => e.currentTarget.style.color = '#8888a0'}>
          <ArrowLeft size={15}/> Back
        </button>
      );
    }

    function BottomNav({ onBack, onNext, nextLabel = 'Continue', nextColor = ['#34d399','#059669'], nextGlow = 'rgba(52,211,153,0.35)' }) {
      const [hov, setHov] = useState(false);
      return (
        <div style={{ display:'flex', justifyContent: onBack ? 'space-between' : 'flex-end', alignItems:'center', marginTop:64, paddingTop:32, borderTop:'1px solid #1e1e2a' }}>
          {onBack && <BackBtn onClick={onBack}/>}
          <button onClick={onNext}
            onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
            style={{ display:'inline-flex', alignItems:'center', gap:9, padding:'13px 26px', borderRadius:12, fontSize:'0.875rem', fontWeight:600, border:'none', cursor:'pointer', fontFamily:'Inter,sans-serif', background:`linear-gradient(135deg,${nextColor[0]},${nextColor[1]})`, color:'#fff', transform: hov ? 'translateY(-1px)' : 'translateY(0)', boxShadow: hov ? `0 8px 28px ${nextGlow}` : 'none', transition:'all 0.3s ease' }}>
            {nextLabel} <ArrowRight/>
          </button>
        </div>
      );
    }

    function InsightCard({ label = 'Key Insight', children, accentColor = '#34d399' }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${accentColor}33`, borderRadius:18, padding:36, marginBottom:40, position:'relative', overflow:'hidden' }}>
          <div style={{ position:'absolute', inset:0, background:`linear-gradient(135deg,${accentColor}0f,transparent 60%)`, pointerEvents:'none' }}/>
          <div style={{ fontSize:'0.68rem', letterSpacing:'0.2em', textTransform:'uppercase', color:accentColor, marginBottom:14, fontWeight:600 }}>{label}</div>
          <p style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(1.05rem,2.4vw,1.35rem)', lineHeight:1.72, color:'#e8e8ed', position:'relative' }}>{children}</p>
        </div>
      );
    }

    function Footer() {
      return <footer style={{ textAlign:'center', marginTop:56, color:'#8888a0', fontSize:'0.75rem' }}>© 2026 MindMapManifesto.com</footer>;
    }

    function PageWrapper({ children, maxWidth = 860 }) {
      return <div style={{ position:'relative', zIndex:1, maxWidth, margin:'0 auto', padding:'60px 24px 100px' }}>{children}</div>;
    }

    function Prose({ children }) {
      return (
        <p style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(0.95rem,2.1vw,1.12rem)', lineHeight:1.9, color:'rgba(220,215,240,0.7)', marginBottom:24 }}>
          {children}
        </p>
      );
    }

    function PullQuote({ children, color = '#34d399' }) {
      return (
        <div style={{ borderLeft:`2px solid ${color}40`, paddingLeft:26, marginBottom:32, marginTop:4 }}>
          <p style={{ fontFamily:"'Playfair Display',serif", fontStyle:'italic', fontSize:'clamp(1.05rem,2.3vw,1.22rem)', lineHeight:1.8, color:`${color}99` }}>
            {children}
          </p>
        </div>
      );
    }

    function Steps({ steps, color = '#34d399' }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:28 }}>
          {steps.map((step, i) => (
            <div key={i} style={{ display:'flex', gap:16, alignItems:'flex-start' }}>
              <div style={{ minWidth:24, height:24, borderRadius:'50%', background:`${color}15`, border:`1px solid ${color}30`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'0.65rem', color, flexShrink:0, marginTop:1, fontWeight:700 }}>{i+1}</div>
              <p style={{ fontSize:'0.88rem', color:'#8888a0', lineHeight:1.68 }}>{step}</p>
            </div>
          ))}
        </div>
      );
    }

    /* ── Screen 0: Landing ───────────────────────────────────────── */

    function LandingScreen({ onNext }) {
      const [hov, setHov] = useState(false);
      const stars = useMemo(() =>
        Array.from({ length: 32 }).map((_, i) => ({
          size: i % 4 === 0 ? 2 : 1,
          opacity: 0.08 + (i % 7) * 0.04,
          top:  `${(i * 37 + 11) % 100}%`,
          left: `${(i * 53 + 7)  % 100}%`,
        })), []);

      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
          <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 50% 50%, #070d09 0%, #000 65%)', opacity:0.95 }}/>
          <div style={{ position:'absolute', inset:0, background:'linear-gradient(to bottom, black, transparent, black)' }}/>
          {stars.map((s, i) => (
            <div key={i} style={{ position:'absolute', width:s.size, height:s.size, borderRadius:'50%', background:'white', opacity:s.opacity, top:s.top, left:s.left }}/>
          ))}

          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:820, display:'flex', flexDirection:'column', alignItems:'center', gap:40, animation:'mmm-reveal 1.5s cubic-bezier(0.16,1,0.3,1) forwards' }}>

            <div style={{ fontSize:'0.65rem', letterSpacing:'0.6em', color:'rgba(52,211,153,0.5)', textTransform:'uppercase', fontWeight:700 }}>
              Creative Visualization
            </div>

            <div>
              <h1 style={{ fontFamily:"'Outfit',sans-serif", fontSize:'clamp(2.8rem,10vw,6rem)', fontWeight:700, letterSpacing:'-0.02em', color:'white', marginBottom:10 }}>
                Part Three
              </h1>
              <div style={{ fontSize:'clamp(0.9rem,2.2vw,1.3rem)', fontWeight:300, color:'rgba(255,255,255,0.4)', letterSpacing:'0.1em' }}>
                Meditations and Affirmations
              </div>
            </div>

            <div style={{ maxWidth:580, borderLeft:'2px solid rgba(52,211,153,0.3)', paddingLeft:28, textAlign:'left' }}>
              <p style={{ fontFamily:"'Playfair Display',serif", fontStyle:'italic', fontSize:'clamp(0.95rem,1.9vw,1.15rem)', lineHeight:1.8, color:'rgba(255,255,255,0.55)' }}>
                "Your mind accepts what you give it. It responds to images and words. It learns through repetition. And it has no preference for the old story over the new one."
              </p>
            </div>

            <button
              onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
              onClick={onNext}
              style={{ backdropFilter:'blur(20px) saturate(180%)', background:'rgba(52,211,153,0.08)', border:'1px solid rgba(52,211,153,0.28)', borderRadius:9999, padding:'18px 52px', fontSize:'0.8rem', fontWeight:700, letterSpacing:'0.4em', textTransform:'uppercase', color:'white', cursor:'pointer', transform: hov ? 'scale(1.05)' : 'scale(1)', boxShadow: hov ? '0 0 48px rgba(52,211,153,0.18)' : 'none', transition:'all 0.5s ease', fontFamily:'Inter,sans-serif' }}>
              Enter Part Three
            </button>
          </div>
        </div>
      );
    }

    /* ── Screen 1: Grounding ─────────────────────────────────────── */

    function GroundingScreen({ onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <Orbs color1="#34d399" color2="#10b981" opacity={0.18}/>
          <ProgressBar pct={10}/>
          <PageWrapper maxWidth={800}>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:60 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={1} total={9}/>
            </nav>

            <div style={{ marginBottom:40, animation:'mmm-fadeUp 0.8s ease-out' }}>
              <Eyebrow>Chapter One · Part Three</Eyebrow>
              <h1 style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(2rem,5vw,3.2rem)', fontWeight:700, lineHeight:1.15, marginBottom:28, background:'linear-gradient(135deg,#e8e8ed 0%,#34d399 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>
                Grounding
              </h1>
            </div>

            <Prose>
              Here's where we begin. Before any meditation, before any visualization, before anything else, you need to be connected. To the earth beneath you and the energy above you. Without that, you'll drift. You'll space out. You'll sit there for twenty minutes and come back with nothing.
            </Prose>

            <Prose>
              This is how you fix that.
            </Prose>

            <div style={{ background:'linear-gradient(135deg,#050f09 0%,#0d0d12 100%)', border:'1px solid rgba(52,211,153,0.18)', borderRadius:18, padding:28, marginBottom:36 }}>
              <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(52,211,153,0.55)', marginBottom:18 }}>The Grounding Practice</div>
              <Steps color="#34d399" steps={[
                'Sit with your spine straight. Close your eyes. Breathe slowly and deeply, counting down from ten to one until you feel yourself settling.',
                'Imagine a cord attached to the base of your spine — long and thick and strong, extending down through the floor, through the building, deep into the earth itself. Like the root of an ancient tree.',
                'Feel the energy of the earth rising up through that cord, up through the soles of your feet, flowing steadily through every part of your body, and pouring out through the top of your head. Take your time. Really feel it moving.',
                'Then reverse the direction. Imagine the energy of the cosmos flowing in through the top of your head. Down through your body. Down through your grounding cord. Down into the earth.',
                'Two flows. Moving in opposite directions. Mixing and circulating inside you.',
              ]}/>
            </div>

            <InsightCard label="Why This Matters" accentColor="#34d399">
              This one practice keeps you balanced between <em style={{ color:'#34d399' }}>imagination and reality</em>. Between vision and solid ground. Between dreaming and actually manifesting. Do it every single time before you go deeper.
            </InsightCard>

            <PullQuote color="#34d399">
              It sounds simple because it is. But don't mistake simple for unimportant. The tree with no roots cannot stand in wind.
            </PullQuote>

            <BottomNav onBack={onBack} onNext={onNext} nextLabel="Opening the Energy Centers"/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 2: Opening the Energy Centers ───────────────────── */

    function EnergyCentersScreen({ onBack, onNext }) {
      const centers = [
        { name:'Crown', loc:'top of your head', color:'#fbbf24' },
        { name:'Throat', loc:'your throat', color:'#fbbf24' },
        { name:'Heart', loc:'center of your chest', color:'#fbbf24' },
        { name:'Solar Plexus', loc:'around your navel', color:'#fbbf24' },
        { name:'Sacral', loc:'your pelvic area', color:'#fbbf24' },
        { name:'Feet', loc:'your feet', color:'#fbbf24' },
      ];

      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <Orbs color1="#fbbf24" color2="#f59e0b" opacity={0.15}/>
          <ProgressBar pct={21} colorA="#fbbf24" colorB="#f59e0b"/>
          <PageWrapper maxWidth={800}>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:60 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={2} total={9} color="#fbbf24"/>
            </nav>

            <div style={{ marginBottom:40 }}>
              <Eyebrow color="#fbbf24">Chapter Two · Part Three</Eyebrow>
              <h1 style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(2rem,5vw,3.2rem)', fontWeight:700, lineHeight:1.15, marginBottom:28, background:'linear-gradient(135deg,#e8e8ed 0%,#fbbf24 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>
                Opening the Energy Centers
              </h1>
            </div>

            <Prose>
              This technique is one of the most effective things you can do first thing in the morning, at the start of any meditation, or any time you feel flat, foggy, or drained. It takes about ten minutes. What it produces stays with you for hours.
            </Prose>

            <Prose>
              Lie down on your back. Arms at your sides or hands resting on your stomach. Close your eyes. Breathe gently and let your body relax completely, starting from your feet and moving all the way up.
            </Prose>

            <div style={{ background:'linear-gradient(135deg,#100c00 0%,#0d0d12 100%)', border:'1px solid rgba(251,191,36,0.18)', borderRadius:18, padding:26, marginBottom:32 }}>
              <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(251,191,36,0.55)', marginBottom:16 }}>Six Centers — Five Breaths Each</div>
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                {centers.map((c, i) => (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:16, background:'rgba(251,191,36,0.04)', borderRadius:10, padding:'10px 14px' }}>
                    <div style={{ width:28, height:28, borderRadius:'50%', background:'rgba(251,191,36,0.12)', border:'1px solid rgba(251,191,36,0.25)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'0.65rem', color:'#fbbf24', flexShrink:0, fontWeight:700 }}>{i+1}</div>
                    <div>
                      <span style={{ fontSize:'0.85rem', fontWeight:600, color:'#e8e8ed', marginRight:8 }}>{c.name}</span>
                      <span style={{ fontSize:'0.82rem', color:'#8888a0' }}>— a glowing sphere of golden light at {c.loc}, expanding with every exhale</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <Prose>
              Once all six centers are glowing, hold them in awareness simultaneously. Your entire body is a strand of luminous energy.
            </Prose>

            <div style={{ background:'#0d0d12', border:'1px solid rgba(251,191,36,0.15)', borderRadius:16, padding:24, marginBottom:28 }}>
              <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(251,191,36,0.55)', marginBottom:14 }}>The Circulation</div>
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                {[
                  'Exhale: energy flows down one side of your body, head to feet. Inhale: it rises up the other side. Repeat three times.',
                  'Reverse: exhale down the front, inhale up the back. Three more times.',
                  'Finally: gather energy at your feet and let it rise slowly through the center of your body, all the way up, fountaining out through the crown and flowing back down the outside. Repeat several times.',
                ].map((s, i) => (
                  <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
                    <div style={{ width:5, height:5, borderRadius:'50%', background:'#fbbf24', flexShrink:0, marginTop:9, opacity:0.6 }}/>
                    <p style={{ fontSize:'0.87rem', color:'#8888a0', lineHeight:1.65 }}>{s}</p>
                  </div>
                ))}
              </div>
            </div>

            <InsightCard label="What You'll Feel Afterward" accentColor="#fbbf24">
              Deeply relaxed and, at the same time, <em style={{ color:'#fbbf24' }}>completely energized</em>. That combination is unusual. It's also exactly what you need to do your best work.
            </InsightCard>

            <BottomNav onBack={onBack} onNext={onNext} nextLabel="Your Sanctuary" nextColor={['#fbbf24','#d97706']} nextGlow="rgba(251,191,36,0.35)"/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 3: The Sanctuary ─────────────────────────────────── */

    function SanctuaryScreen({ onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <Orbs color1="#818cf8" color2="#6366f1" opacity={0.2}/>
          <ProgressBar pct={32} colorA="#818cf8" colorB="#6366f1"/>
          <PageWrapper maxWidth={800}>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:60 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={3} total={9} color="#818cf8"/>
            </nav>

            <div style={{ marginBottom:40 }}>
              <Eyebrow color="#818cf8">Chapter Three · Part Three</Eyebrow>
              <h1 style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(2rem,5vw,3.2rem)', fontWeight:700, lineHeight:1.15, marginBottom:28, background:'linear-gradient(135deg,#e8e8ed 0%,#818cf8 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>
                Your Sanctuary
              </h1>
            </div>

            <Prose>
              What if you had a place inside yourself you could go to any time the world got too loud?
            </Prose>

            <Prose>
              You do. You just haven't built it yet.
            </Prose>

            <Prose>
              This is one of the first things to create when you begin working with visualization. Your sanctuary. A place that belongs entirely to you. That exists inside you. That you can return to in seconds, just by closing your eyes and choosing to be there.
            </Prose>

            <div style={{ background:'linear-gradient(135deg,#080a1a 0%,#0d0d12 100%)', border:'1px solid rgba(129,140,248,0.18)', borderRadius:18, padding:28, marginBottom:32 }}>
              <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(129,140,248,0.55)', marginBottom:16 }}>Building It</div>
              <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
                {[
                  'Close your eyes. Relax deeply. Begin to imagine yourself somewhere in nature — a meadow in morning light, a forest after rain, a mountain above the clouds, a beach with no one on it. Somewhere that feels completely peaceful and completely safe.',
                  'Start to explore it. Notice the light. Notice the sounds. Notice the temperature and the smell and the texture of the ground beneath you.',
                  'Let the details come naturally, then begin adding anything that would make this place feel more like home — a shelter, a garden, a fire, a chair. Surround the whole area with golden light if you want.',
                  'This place is yours. Make it yours completely.',
                ].map((s, i) => (
                  <div key={i} style={{ display:'flex', gap:16, alignItems:'flex-start' }}>
                    <div style={{ minWidth:22, height:22, borderRadius:'50%', background:'rgba(129,140,248,0.12)', border:'1px solid rgba(129,140,248,0.25)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'0.65rem', color:'#818cf8', flexShrink:0, marginTop:1, fontWeight:700 }}>{i+1}</div>
                    <p style={{ fontSize:'0.87rem', color:'#8888a0', lineHeight:1.68 }}>{s}</p>
                  </div>
                ))}
              </div>
            </div>

            <InsightCard label="From This Moment Forward" accentColor="#818cf8">
              It's always available to you. In your worst moments, in the middle of a difficult day, in the five minutes before a hard conversation — you can come here. Every time you return, it will <em style={{ color:'#818cf8' }}>restore you</em>.
            </InsightCard>

            <Prose>
              You can change it whenever you want. Add things. Let it evolve. Some people find it transforms on its own over time. That's fine. What matters is that the core of it always feels peaceful, safe, and entirely yours.
            </Prose>

            <PullQuote color="#818cf8">
              Every time you practice, the details deepen. And the peace deepens with them.
            </PullQuote>

            <BottomNav onBack={onBack} onNext={onNext} nextLabel="Meeting Your Guide" nextColor={['#818cf8','#4f46e5']} nextGlow="rgba(129,140,248,0.35)"/>
            <Footer/>
          </PageWrapper>
        </div>

                  <div style={{ fontSize:'0.65rem', letterSpacing:'0.22em', textTransform:'uppercase', color:cat.color, marginBottom:14, opacity:0.8 }}>{cat.title}</div>
                  <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                    {cat.items.map((a, i) => (
                      <div key={i} style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
                        <div style={{ width:5, height:5, borderRadius:'50%', background:cat.color, flexShrink:0, opacity:0.5, marginTop:9 }}/>
                        <p style={{ fontFamily:"'Playfair Display',serif", fontStyle:'italic', fontSize:'0.9rem', color:`rgba(220,215,240,0.65)`, lineHeight:1.6 }}>{a}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            <PullQuote color="#f59e0b">
              Find the ones that create a feeling of expansion when you read them. Those are the ones that are working on something real.
            </PullQuote>

            <BottomNav onBack={onBack} onNext={onNext} nextLabel="Complete Part Three" nextColor={['#f59e0b','#d97706']} nextGlow="rgba(245,158,11,0.35)"/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 10: Completion ───────────────────────────────────── */

    function CompletionScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', position:'relative', overflow:'hidden' }} onClick={onNext}>
          <div style={{ position:'absolute', width:600, height:600, borderRadius:'50%', background:'#34d399', filter:'blur(130px)', opacity:0.1, top:'15%', left:'5%', animation:'orbFloat 12s ease-in-out infinite alternate' }}/>
          <div style={{ position:'absolute', width:440, height:440, borderRadius:'50%', background:'#f472b6', filter:'blur(140px)', opacity:0.07, bottom:'10%', right:'5%', animation:'orbFloat 16s ease-in-out infinite alternate-reverse' }}/>
          <div style={{ position:'absolute', width:360, height:360, borderRadius:'50%', background:'#a78bfa', filter:'blur(120px)', opacity:0.09, top:'8%', right:'15%' }}/>

          {[0, 1, 2].map(i => (
            <div key={i} style={{ position:'absolute', top:'50%', left:'50%', width:100+i*90, height:100+i*90, borderRadius:'50%', border:`1px solid ${['rgba(52,211,153,0.35)','rgba(244,114,182,0.25)','rgba(167,139,250,0.18)'][i]}`, animation:`waveExpand 5s ease-out ${i*1.6}s infinite` }}/>
          ))}

          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:740 }}>
            <div style={{ fontSize:'0.62rem', letterSpacing:'0.5em', textTransform:'uppercase', color:'rgba(52,211,153,0.4)', marginBottom:36 }}>
              Part Three Complete
            </div>

            <h1 style={{ fontFamily:"'Outfit',sans-serif", fontSize:'clamp(2.2rem,8vw,5rem)', fontWeight:700, background:'linear-gradient(135deg,#34d399 0%,#f472b6 50%,#a78bfa 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text', letterSpacing:1, marginBottom:32, animation:'mmm-reveal 2s ease-out 0.5s both', lineHeight:1.1 }}>
              THESE ARE<br/>YOUR TOOLS
            </h1>

            <p style={{ fontFamily:"'Playfair Display',serif", fontStyle:'italic', fontSize:'clamp(1rem,2.4vw,1.25rem)', color:'rgba(200,240,220,0.5)', lineHeight:1.8, marginBottom:44, animation:'mmm-fadeUp 1.5s ease-out 1.5s both' }}>
              Ground yourself first.<br/>
              Build your sanctuary. Meet your guide.<br/>
              Let go, heal, invoke, affirm.
            </p>

            <div style={{ background:'rgba(52,211,153,0.05)', border:'1px solid rgba(52,211,153,0.15)', borderRadius:16, padding:'26px 36px', maxWidth:580, margin:'0 auto 48px', animation:'mmm-fadeUp 1.5s ease-out 2.2s both' }}>
              <p style={{ fontFamily:"'Playfair Display',serif", fontStyle:'italic', fontSize:'1.05rem', color:'rgba(180,240,210,0.7)', lineHeight:1.8 }}>
                "Your mind accepts what you give it. It responds to images and words. It learns through repetition. And it has no preference for the old story over the new one. It will follow whatever you practice consistently."
              </p>
              <div style={{ fontSize:'0.6rem', letterSpacing:'0.25em', textTransform:'uppercase', color:'rgba(52,211,153,0.3)', marginTop:12 }}>The whole practice</div>
            </div>

            <div style={{ fontSize:'0.72rem', letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(255,255,255,0.18)', animation:'mmm-blink 2.5s ease-in-out 3.5s infinite' }}>
              *click anywhere to restart*
            </div>
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────────── */

    function App() {
      const [screen, setScreen] = useState(0);
      const go = n => setScreen(n);

      useEffect(() => { window.scrollTo(0, 0); }, [screen]);

      const screens = [
        <LandingScreen        onNext={() => go(1)} />,
        <GroundingScreen      onBack={() => go(0)} onNext={() => go(2)} />,
        <EnergyCentersScreen  onBack={() => go(1)} onNext={() => go(3)} />,
        <SanctuaryScreen      onBack={() => go(2)} onNext={() => go(4)} />,
        <GuideScreen          onBack={() => go(3)} onNext={() => go(5)} />,
        <PinkBubbleScreen     onBack={() => go(4)} onNext={() => go(6)} />,
        <HealingSelfScreen    onBack={() => go(5)} onNext={() => go(7)} />,
        <HealingOthersScreen  onBack={() => go(6)} onNext={() => go(8)} />,
        <InvocationScreen     onBack={() => go(7)} onNext={() => go(9)} />,
        <AffirmationsScreen   onBack={() => go(8)} onNext={() => go(10)} />,
        <CompletionScreen     onNext={() => go(0)} />,
      ];

      return screens[screen];
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script src="../app-nav.js"></script>
</body>
</html>
