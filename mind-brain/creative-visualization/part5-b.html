<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Creative Visualization — Part Five</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050507; color: #e8e8ed; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.05); }
    }
    @keyframes mmm-reveal {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes mmm-fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes mmm-blink {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.7; }
    }
    @keyframes waveExpand {
      0%   { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 2px; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../theme-app.css"/>
</head>
<body>
  <nav class="mb-nav" aria-label="Series navigation"><a href="index.html">← back to creative visualization</a><a href="part4-b.html" rel="prev">← part 4</a></nav>
  <p class="mb-hint" aria-hidden="true">← → keys or swipe</p>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    /* ── Shared Components ───────────────────────────────────────── */

    function Orbs({ color1 = '#a78bfa', color2 = '#818cf8', opacity = 0.2 }) {
      return (
        <div style={{ position:'fixed', inset:0, zIndex:0, pointerEvents:'none', overflow:'hidden' }}>
          <div style={{ position:'absolute', width:580, height:580, borderRadius:'50%', background:color1, filter:'blur(130px)', opacity, top:'-15%', left:'-10%', animation:'orbFloat 18s ease-in-out infinite alternate' }}/>
          <div style={{ position:'absolute', width:420, height:420, borderRadius:'50%', background:color2, filter:'blur(130px)', opacity, bottom:'-10%', right:'-10%', animation:'orbFloat 20s ease-in-out infinite alternate-reverse' }}/>
        </div>
      );
    }

    function ProgressBar({ pct, colorA = '#a78bfa', colorB = '#818cf8' }) {
      return (
        <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, height:3, background:'#14141c' }}>
          <div style={{ height:'100%', width:`${pct}%`, background:`linear-gradient(90deg,${colorA},${colorB})`, transition:'width 0.5s ease' }}/>
        </div>
      );
    }

    function Eyebrow({ children, color = '#a78bfa' }) {
      return (
        <div style={{ fontSize:'0.7rem', letterSpacing:'0.2em', textTransform:'uppercase', color, marginBottom:16, display:'flex', alignItems:'center', gap:10, fontWeight:500 }}>
          <span style={{ width:28, height:1, background:color, opacity:0.5, flexShrink:0, display:'block' }}/>
          {children}
        </div>
      );
    }

    function StepIndicator({ current, total, color = '#a78bfa' }) {
      return (
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.2em', textTransform:'uppercase', color:'#8888a0' }}>
          Chapter <span style={{ color, fontWeight:600 }}>{current}</span> of {total}
        </div>
      );
    }

    function ArrowRight({ size = 16 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      );
    }

    function ArrowLeft({ size = 16 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
      );
    }

    function BackBtn({ onClick }) {
      return (
        <button onClick={onClick}
          style={{ display:'flex', alignItems:'center', gap:6, color:'#8888a0', background:'none', border:'none', cursor:'pointer', fontSize:'0.82rem', fontFamily:'Inter,sans-serif' }}
          onMouseEnter={e => e.currentTarget.style.color = '#e8e8ed'}
          onMouseLeave={e => e.currentTarget.style.color = '#8888a0'}>
          <ArrowLeft size={15}/> Back
        </button>
      );
    }

    function BottomNav({ onBack, onNext, nextLabel = 'Continue', nextColor = ['#a78bfa','#7c3aed'], nextGlow = 'rgba(167,139,250,0.35)' }) {
      const [hov, setHov] = useState(false);
      return (
        <div style={{ display:'flex', justifyContent: onBack ? 'space-between' : 'flex-end', alignItems:'center', marginTop:64, paddingTop:32, borderTop:'1px solid #1e1e2a' }}>
          {onBack && <BackBtn onClick={onBack}/>}
          <button onClick={onNext}
            onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
            style={{ display:'inline-flex', alignItems:'center', gap:9, padding:'13px 26px', borderRadius:12, fontSize:'0.875rem', fontWeight:600, border:'none', cursor:'pointer', fontFamily:'Inter,sans-serif', background:`linear-gradient(135deg,${nextColor[0]},${nextColor[1]})`, color:'#fff', transform: hov ? 'translateY(-1px)' : 'translateY(0)', boxShadow: hov ? `0 8px 28px ${nextGlow}` : 'none', transition:'all 0.3s ease' }}>
            {nextLabel} <ArrowRight/>
          </button>
        </div>
      );
    }

    function InsightCard({ label = 'Key Insight', children, accentColor = '#a78bfa' }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${accentColor}33`, borderRadius:18, padding:36, marginBottom:40, position:'relative', overflow:'hidden' }}>
          <div style={{ position:'absolute', inset:0, background:`linear-gradient(135deg,${accentColor}0f,transparent 60%)`, pointerEvents:'none' }}/>
          <div style={{ fontSize:'0.68rem', letterSpacing:'0.2em', textTransform:'uppercase', color:accentColor, marginBottom:14, fontWeight:600 }}>{label}</div>
          <p style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(1.05rem,2.4vw,1.35rem)', lineHeight:1.72, color:'#e8e8ed', position:'relative' }}>{children}</p>
        </div>
      );
    }

    function Footer() {
      return <footer style={{ textAlign:'center', marginTop:56, color:'#8888a0', fontSize:'0.75rem' }}>© 2026 MindMapManifesto.com</footer>;
    }

    function PageWrapper({ children, maxWidth = 860 }) {
      return <div style={{ position:'relative', zIndex:1, maxWidth, margin:'0 auto', padding:'60px 24px 100px' }}>{children}</div>;
    }

    function Prose({ children }) {
      return (
        <p style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(0.95rem,2.1vw,1.12rem)', lineHeight:1.9, color:'rgba(220,215,240,0.7)', marginBottom:24 }}>
          {children}
        </p>
      );
    }

    function PullQuote({ children, color = '#a78bfa' }) {
      return (
        <div style={{ borderLeft:`2px solid ${color}40`, paddingLeft:26, marginBottom:32, marginTop:4 }}>
          <p style={{ fontFamily:"'Playfair Display',serif", fontStyle:'italic', fontSize:'clamp(1.05rem,2.3vw,1.22rem)', lineHeight:1.8, color:`${color}99` }}>
            {children}
          </p>
        </div>
      );
    }

    function Steps({ steps, color = '#a78bfa' }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:28 }}>
          {steps.map((step, i) => (
            <div key={i} style={{ display:'flex', gap:16, alignItems:'flex-start' }}>
              <div style={{ minWidth:24, height:24, borderRadius:'50%', background:`${color}15`, border:`1px solid ${color}30`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'0.65rem', color, flexShrink:0, marginTop:1, fontWeight:700 }}>{i+1}</div>
              <p style={{ fontSize:'0.88rem', color:'#8888a0', lineHeight:1.68 }}>{step}</p>
            </div>
          ))}
        </div>
      );
    }

    /* ── Screen 0: Landing ───────────────────────────────────────── */

    function LandingScreen({ onNext }) {
      const [hov, setHov] = useState(false);
      const stars = useMemo(() =>
        Array.from({ length: 32 }).map((_, i) => ({
          size: i % 4 === 0 ? 2 : 1,
          opacity: 0.08 + (i % 7) * 0.04,
          top:  `${(i * 37 + 11) % 100}%`,
          left: `${(i * 53 + 7)  % 100}%`,
        })), []);

      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
          <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 50% 50%, #1a0e00 0%, #000 65%)', opacity:0.9 }}/>
          <div style={{ position:'absolute', inset:0, background:'linear-gradient(to bottom, black, transparent, black)' }}/>
          {stars.map((s, i) => (
            <div key={i} style={{ position:'absolute', width:s.size, height:s.size, borderRadius:'50%', background:'white', opacity:s.opacity, top:s.top, left:s.left }}/>
          ))}

          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:820, display:'flex', flexDirection:'column', alignItems:'center', gap:40, animation:'mmm-reveal 1.5s cubic-bezier(0.16,1,0.3,1) forwards' }}>

            <div style={{ fontSize:'0.65rem', letterSpacing:'0.6em', color:'rgba(245,158,11,0.5)', textTransform:'uppercase', fontWeight:700 }}>
              Creative Visualization
            </div>

            <div>
              <h1 style={{ fontFamily:"'Outfit',sans-serif", fontSize:'clamp(2.8rem,10vw,6rem)', fontWeight:700, letterSpacing:'-0.02em', color:'white', marginBottom:10 }}>
                Part Five
              </h1>
              <div style={{ fontSize:'clamp(0.9rem,2.2vw,1.3rem)', fontWeight:300, color:'rgba(255,255,255,0.4)', letterSpacing:'0.1em' }}>
                Living Creatively
              </div>
            </div>

            <div style={{ maxWidth:580, borderLeft:'2px solid rgba(245,158,11,0.3)', paddingLeft:28, textAlign:'left' }}>
              <p style={{ fontFamily:"'Playfair Display',serif", fontStyle:'italic', fontSize:'clamp(0.95rem,1.9vw,1.15rem)', lineHeight:1.8, color:'rgba(255,255,255,0.55)' }}>
                "You've learned the tools. Now forget, for a moment, that they're tools. This was never about getting things. It was about becoming someone who creates — on purpose, every day, with everything."
              </p>
            </div>

            <button
              onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
              onClick={onNext}
              style={{ backdropFilter:'blur(20px) saturate(180%)', background:'rgba(245,158,11,0.08)', border:'1px solid rgba(245,158,11,0.28)', borderRadius:9999, padding:'18px 52px', fontSize:'0.8rem', fontWeight:700, letterSpacing:'0.4em', textTransform:'uppercase', color:'white', cursor:'pointer', transform: hov ? 'scale(1.05)' : 'scale(1)', boxShadow: hov ? '0 0 48px rgba(245,158,11,0.18)' : 'none', transition:'all 0.5s ease', fontFamily:'Inter,sans-serif' }}>
              Enter Part Five
            </button>
          </div>
        </div>
      );
    }

    /* ── Screen 1: This Was Never Just a Technique ──────────────── */

    function ConsciousnessScreen({ onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <Orbs color1="#a78bfa" color2="#818cf8"/>
          <ProgressBar pct={20}/>
          <PageWrapper maxWidth={800}>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:60 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={1} total={5}/>
            </nav>

            <div style={{ marginBottom:40, animation:'mmm-fadeUp 0.8s ease-out' }}>
              <Eyebrow>Chapter One · Part Five</Eyebrow>
              <h1 style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(2rem,5vw,3.2rem)', fontWeight:700, lineHeight:1.15, marginBottom:28, background:'linear-gradient(135deg,#e8e8ed 0%,#a78bfa 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>
                This Was Never Just a Technique
              </h1>
            </div>

            <Prose>
              Up to now, it's been easy to think of creative visualization as something you do. Ten minutes in the morning. An affirmation on the mirror. A treasure map on the wall. Something you pick up and put down.
            </Prose>

            <Prose>
              That's how it starts. It's not where it ends.
            </Prose>

            <InsightCard label="Where This Is Going" accentColor="#a78bfa">
              At its fullest, creative visualization isn't a practice at all. It's a <em style={{ color:'#a78bfa' }}>way of being awake</em> — a constant, lived awareness that you are creating your experience in every moment, whether you're paying attention or not.
            </InsightCard>

            <Prose>
              That can sound like pressure. It's the opposite. If you're the one creating it, you're the one who can change it. Responsibility, seen clearly, is just another word for freedom.
            </Prose>

            <div style={{ display:'flex', flexDirection:'column', gap:14, marginBottom:36 }}>
              {[
                {
                  title: "You're not separate from it",
                  body: "You're not a spectator trying to push on a world that sits somewhere outside you. You're part of the same creative force that makes everything else. You're how it shows up as you.",
                  color: '#a78bfa',
                },
                {
                  title: "There isn't actually less",
                  body: "Scarcity feels like a fact about the world. Most of the time it's a fact about what you believe. The lack you see outside is usually a limit you're carrying inside. See the limit, and the world starts to look different.",
                  color: '#818cf8',
                },
                {
                  title: "You don't have to strain",
                  body: "You're not dragging things toward you from far away. What you want is already a possibility inside you. Creating is just letting it become visible — inside first, then out in the world.",
                  color: '#c084fc',
                },
              ].map(p => (
                <div key={p.title} style={{ background:'#0d0d12', border:`1px solid ${p.color}20`, borderLeft:`3px solid ${p.color}50`, borderRadius:14, padding:'20px 24px' }}>
                  <h3 style={{ fontSize:'1rem', fontWeight:600, color:'#e8e8ed', marginBottom:8 }}>{p.title}</h3>
                  <p style={{ fontSize:'0.87rem', color:'#8888a0', lineHeight:1.72 }}>{p.body}</p>
                </div>
              ))}
            </div>

            <PullQuote color="#a78bfa">
              The real measure of whether this is working isn't what you've collected. It's who you've become while collecting it. A goal that arrives without changing you is just a thing. A goal that grows you is the point.
            </PullQuote>

            <BottomNav onBack={onBack} onNext={onNext} nextLabel="You Already Know"/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 2: You Already Know What You're Here For ────────── */

    function PurposeScreen({ onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <Orbs color1="#c084fc" color2="#818cf8" opacity={0.2}/>
          <ProgressBar pct={40} colorA="#c084fc" colorB="#818cf8"/>
          <PageWrapper maxWidth={800}>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:60 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={2} total={5} color="#c084fc"/>
            </nav>

            <div style={{ marginBottom:40 }}>
              <Eyebrow color="#c084fc">Chapter Two · Part Five</Eyebrow>
              <h1 style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(2rem,5vw,3.2rem)', fontWeight:700, lineHeight:1.15, marginBottom:28, background:'linear-gradient(135deg,#e8e8ed 0%,#c084fc 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>
                You Already Know What You're Here For
              </h1>
            </div>

            <Prose>
              You need food. You need shelter. You need people. And you need something else that rarely makes the list: to give something real to the world. Not because you should. Because that's how you're built.
            </Prose>

            <Prose>
              When that need goes unmet, no amount of comfort fills the gap. When it's met, even a hard life feels like it means something.
            </Prose>

            <InsightCard label="What Purpose Actually Looks Like" accentColor="#c084fc">
              It's almost never grand. It's being <em style={{ color:'#c084fc' }}>fully and naturally yourself</em> — doing what you love and what comes easily to you. Not what would impress people. Not what you think you owe. What is most honestly you.
            </InsightCard>

            <div style={{ background:'#0d0d12', border:'1px solid rgba(192,132,252,0.15)', borderRadius:16, padding:28, marginBottom:28 }}>
              <h3 style={{ fontSize:'1rem', fontWeight:600, color:'#e8e8ed', marginBottom:14 }}>Here's the strange part</h3>
              <p style={{ fontSize:'0.88rem', color:'#8888a0', lineHeight:1.78, marginBottom:16 }}>
                Most people already know. They've known since they were kids. It's in what lit them up, what came without effort, what they kept going back to when nobody was telling them to.
              </p>
              <p style={{ fontSize:'0.88rem', color:'#8888a0', lineHeight:1.78 }}>
                You probably know too. You might just be very good at not looking at it.
              </p>
            </div>

            <div style={{ background:'linear-gradient(135deg,#160d22 0%,#0d0d12 100%)', border:'1px solid rgba(192,132,252,0.18)', borderRadius:18, padding:26, marginBottom:28 }}>
              <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(192,132,252,0.55)', marginBottom:16 }}>Ask Yourself</div>
              <Steps color="#c084fc" steps={[
                'What did you love doing as a child, before anyone told you what was practical?',
                'What do people keep coming to you for, even when you don\'t offer it?',
                'What makes you lose track of time?',
                'What would you do with your days if money were already handled?',
              ]}/>
            </div>

            <PullQuote color="#c084fc">
              Your answers don't have to make sense yet. They don't have to be a career. They just have to be true.
            </PullQuote>

            <BottomNav onBack={onBack} onNext={onNext} nextLabel="Why You Hide It" nextColor={['#c084fc','#9333ea']} nextGlow="rgba(192,132,252,0.35)"/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 3: Why You Hide It ──────────────────────────────── */

    function HidingScreen({ onBack, onNext }) {
      const fears = [
        { f:'The power', d:'Stepping fully into who you are changes things. Relationships shift. Expectations shift. Some part of you would rather keep things the way they are.' },
        { f:'The responsibility', d:'Once you admit what you\'re here to do, you can\'t pretend you don\'t know. Every day you don\'t do it becomes a choice.' },
        { f:'Being seen', d:'Doing what you love in public means being judged on the thing you care about most. Failing at something you don\'t care about is safer.' },
        { f:'The size of it', d:'If you stopped holding back, how far could this go? For a lot of people, that question is more frightening than staying small.' },
      ];

      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <Orbs color1="#818cf8" color2="#6366f1"/>
          <ProgressBar pct={60} colorA="#818cf8" colorB="#6366f1"/>
          <PageWrapper maxWidth={800}>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:60 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={3} total={5} color="#818cf8"/>
            </nav>

            <div style={{ marginBottom:40 }}>
              <Eyebrow color="#818cf8">Chapter Three · Part Five</Eyebrow>
              <h1 style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(2rem,5vw,3.2rem)', fontWeight:700, lineHeight:1.15, marginBottom:28, background:'linear-gradient(135deg,#e8e8ed 0%,#818cf8 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>
                Why You Hide It
              </h1>
            </div>

            <Prose>
              If you already know what you're here for, why aren't you doing it?
            </Prose>

            <Prose>
              It isn't laziness. It isn't that you don't care. It's fear — and it's a very specific kind of fear.
            </Prose>

            <div style={{ display:'flex', flexDirection:'column', gap:10, marginBottom:32 }}>
              {fears.map((item, i) => (
                <div key={i} style={{ background:'#0d0d12', border:'1px solid rgba(129,140,248,0.12)', borderLeft:'3px solid rgba(129,140,248,0.45)', borderRadius:14, padding:'14px 20px' }}>
                  <h3 style={{ fontSize:'0.88rem', fontWeight:600, color:'#e8e8ed', marginBottom:5 }}>Afraid of {item.f.toLowerCase()}</h3>
                  <p style={{ fontSize:'0.84rem', color:'#8888a0', lineHeight:1.65 }}>{item.d}</p>
                </div>
              ))}
            </div>

            <InsightCard label="What the Practice Does" accentColor="#818cf8">
              Every time you clear a block, write an affirmation, or picture what you want, you take off <em style={{ color:'#818cf8' }}>one more layer</em> of hiding. You don't have to force your purpose into the open. Keep doing the work and it surfaces on its own — first to you, then through you.
            </InsightCard>

            <PullQuote color="#818cf8">
              You're not looking for something you've lost. You're uncovering something you buried, a little at a time, so you'd feel safe. You're allowed to dig it back up.
            </PullQuote>

            <BottomNav onBack={onBack} onNext={onNext} nextLabel="Follow the Thread" nextColor={['#818cf8','#4f46e5']} nextGlow="rgba(129,140,248,0.35)"/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 4: Follow the Thread ────────────────────────────── */

    function ThreadScreen({ onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <Orbs color1="#f59e0b" color2="#a78bfa" opacity={0.18}/>
          <ProgressBar pct={80} colorA="#f59e0b" colorB="#a78bfa"/>
          <PageWrapper maxWidth={800}>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:60 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={4} total={5} color="#f59e0b"/>
            </nav>

            <div style={{ marginBottom:40 }}>
              <Eyebrow color="#f59e0b">Chapter Four · Part Five</Eyebrow>
              <h1 style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(2rem,5vw,3.2rem)', fontWeight:700, lineHeight:1.15, marginBottom:28, background:'linear-gradient(135deg,#e8e8ed 0%,#f59e0b 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>
                Follow the Thread
              </h1>
            </div>

            <Prose>
              Your purpose leaves clues everywhere. In the dreams that keep coming back. In the goals you've circled for years. In the fantasies you'd be a little embarrassed to say out loud.
            </Prose>

            <Prose>
              Those aren't distractions from your real life. They're directions to it.
            </Prose>

            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))', gap:16, marginBottom:36 }}>
              {[
                {
                  label: 'Where to look',
                  items: ['Dreams and images that keep returning', 'Goals you come back to year after year', "Fantasies you're embarrassed by but can't let go of", 'What you would try if you knew you couldn\'t fail'],
                  color: '#f59e0b',
                },
                {
                  label: "How you'll know you're on it",
                  items: ['Visualizing feels easy instead of forced', 'Things arrive faster, with less resistance', 'The work itself feels meaningful, not just the result', 'You feel more like yourself, not less'],
                  color: '#a78bfa',
                },
              ].map(s => (
                <div key={s.label} style={{ background:'#0d0d12', border:`1px solid ${s.color}20`, borderTop:`2px solid ${s.color}50`, borderRadius:16, padding:24 }}>
                  <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:s.color, marginBottom:14, opacity:0.8 }}>{s.label}</div>
                  <div style={{ display:'flex', flexDirection:'column', gap:9 }}>
                    {s.items.map((item, i) => (
                      <div key={i} style={{ display:'flex', gap:12, alignItems:'flex-start' }}>
                        <div style={{ width:4, height:4, borderRadius:'50%', background:s.color, flexShrink:0, marginTop:8, opacity:0.55 }}/>
                        <p style={{ fontSize:'0.84rem', color:'#8888a0', lineHeight:1.58 }}>{item}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            <InsightCard label="When Something Won't Come" accentColor="#f59e0b">
              Sometimes you do everything right and a goal still doesn't arrive. That isn't always failure. Sometimes it's <em style={{ color:'#f59e0b' }}>a redirection</em> — that particular thing doesn't fit the bigger shape of your life. Something deeper than your conscious mind can see the whole map. Let it steer.
            </InsightCard>

            <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:28 }}>
              {[
                { t:'Commit to the direction, not the schedule', d:"Your inner guidance doesn't run on your timetable. Stay pointed the right way and let the timing be what it is." },
                { t:'It makes sense backwards', d:"In the moment, delays and dead ends feel like proof it isn't working. Looking back, they're almost always where the path turned. You can't see that while you're in it. You can trust it anyway." },
              ].map((n, i) => (
                <div key={i} style={{ background:'#0d0d12', border:'1px solid #1e1e2a', borderRadius:14, padding:'18px 22px' }}>
                  <h3 style={{ fontSize:'0.9rem', fontWeight:600, color:'#e8e8ed', marginBottom:7 }}>{n.t}</h3>
                  <p style={{ fontSize:'0.86rem', color:'#8888a0', lineHeight:1.7 }}>{n.d}</p>
                </div>
              ))}
            </div>

            <BottomNav onBack={onBack} onNext={onNext} nextLabel="Your Life Is the Work" nextColor={['#f59e0b','#d97706']} nextGlow="rgba(245,158,11,0.4)"/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 5: Your Life Is the Work ────────────────────────── */

    function ArtScreen({ onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <Orbs color1="#06b6d4" color2="#a78bfa"/>
          <ProgressBar pct={96} colorA="#06b6d4" colorB="#a78bfa"/>
          <PageWrapper maxWidth={780}>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:60 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={5} total={5} color="#06b6d4"/>
            </nav>

            <div style={{ marginBottom:40 }}>
              <Eyebrow color="#06b6d4">Chapter Five · Part Five</Eyebrow>
              <h1 style={{ fontFamily:"'Playfair Display',serif", fontSize:'clamp(2rem,5vw,3.2rem)', fontWeight:700, lineHeight:1.15, marginBottom:28, background:'linear-gradient(135deg,#e8e8ed 0%,#06b6d4 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>
                Your Life Is the Work
              </h1>
            </div>

            <Prose>
              Think of yourself as an artist. Not someone who makes art on the side — someone whose main work, the one that's always in progress, is their own life.
            </Prose>

            <Prose>
              That isn't a metaphor. It's a plain description of what's already happening.
            </Prose>

            <InsightCard label="What That Means" accentColor="#06b6d4">
              Every moment is a blank canvas with <em style={{ color:'#06b6d4' }}>endless possibilities</em>. You can do it the way you always have. Or you can stop, look at the other options, and try something new — something truer, more beautiful, more alive.
            </InsightCard>

            <div style={{ display:'flex', flexDirection:'column', gap:14, marginBottom:36 }}>
              {[
                {
                  title: "It's not just the big decisions",
                  body: "The job, the move, the relationship — yes. But also how you speak to the person in front of you. What you choose to notice. How you walk into a room. Every ordinary moment is a brushstroke.",
                  color: '#06b6d4',
                },
                {
                  title: 'Treat it like play',
                  body: "Life can be taken seriously and still be a game — a big, strange, creative adventure. That doesn't make it trivial. The spirit you bring to it shapes what it turns into. Lightness isn't the opposite of depth.",
                  color: '#818cf8',
                },
                {
                  title: "The tools become the way you live",
                  body: "The notebook, the affirmations, the ideal scenes — eventually they stop being things you do and become how you think. That's the shift. Not using creative visualization. Living creatively.",
                  color: '#a78bfa',
                },
              ].map(p => (
                <div key={p.title} style={{ background:'#0d0d12', border:`1px solid ${p.color}20`, borderLeft:`3px solid ${p.color}50`, borderRadius:14, padding:'22px 26px' }}>
                  <h3 style={{ fontSize:'1rem', fontWeight:600, color:'#e8e8ed', marginBottom:9 }}>{p.title}</h3>
                  <p style={{ fontSize:'0.87rem', color:'#8888a0', lineHeight:1.72 }}>{p.body}</p>
                </div>
              ))}
            </div>

            <div style={{ background:'linear-gradient(135deg,#051c22 0%,#0d0d12 100%)', border:'1px solid rgba(6,182,212,0.18)', borderRadius:18, padding:28, marginBottom:28 }}>
              <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(6,182,212,0.55)', marginBottom:16 }}>Start Today</div>
              <Steps color="#06b6d4" steps={[
                'Pick one ordinary moment today — a meal, a conversation, a walk — and do it on purpose.',
                'Before you react to something, pause and ask: what would I like to create here?',
                'Tonight, write one line in your notebook about something you made happen, however small.',
              ]}/>
            </div>

            <PullQuote color="#06b6d4">
              You're not here to get it right or to avoid failing. You're here to make something that has never existed before and never will again. That thing is your life. Exactly this one.
            </PullQuote>

            <BottomNav onBack={onBack} onNext={onNext} nextLabel="Complete Part Five" nextColor={['#06b6d4','#0891b2']} nextGlow="rgba(6,182,212,0.35)"/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 6: Completion ────────────────────────────────────── */

    function CompletionScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', position:'relative', overflow:'hidden' }} onClick={onNext}>
          <div style={{ position:'absolute', width:600, height:600, borderRadius:'50%', background:'#7c3aed', filter:'blur(130px)', opacity:0.12, top:'15%', left:'5%', animation:'orbFloat 12s ease-in-out infinite alternate' }}/>
          <div style={{ position:'absolute', width:440, height:440, borderRadius:'50%', background:'#f59e0b', filter:'blur(140px)', opacity:0.08, bottom:'10%', right:'5%', animation:'orbFloat 16s ease-in-out infinite alternate-reverse' }}/>
          <div style={{ position:'absolute', width:360, height:360, borderRadius:'50%', background:'#06b6d4', filter:'blur(120px)', opacity:0.09, top:'8%', right:'15%' }}/>

          {[0, 1, 2].map(i => (
            <div key={i} style={{ position:'absolute', top:'50%', left:'50%', width:100+i*90, height:100+i*90, borderRadius:'50%', border:`1px solid ${['rgba(245,158,11,0.35)','rgba(167,139,250,0.25)','rgba(6,182,212,0.18)'][i]}`, animation:`waveExpand 5s ease-out ${i*1.6}s infinite` }}/>
          ))}

          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:740 }}>
            <div style={{ fontSize:'0.62rem', letterSpacing:'0.5em', textTransform:'uppercase', color:'rgba(245,158,11,0.4)', marginBottom:36 }}>
              Part Five Complete · The Journey Complete
            </div>

            <h1 style={{ fontFamily:"'Outfit',sans-serif", fontSize:'clamp(2.2rem,8vw,5rem)', fontWeight:700, background:'linear-gradient(135deg,#f59e0b 0%,#a78bfa 50%,#06b6d4 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text', letterSpacing:1, marginBottom:32, animation:'mmm-reveal 2s ease-out 0.5s both', lineHeight:1.1 }}>
              YOU ARE<br/>THE ARTIST
            </h1>

            <p style={{ fontFamily:"'Playfair Display',serif", fontStyle:'italic', fontSize:'clamp(1rem,2.4vw,1.25rem)', color:'rgba(255,240,200,0.55)', lineHeight:1.8, marginBottom:44, animation:'mmm-fadeUp 1.5s ease-out 1.5s both' }}>
              Every moment a canvas.<br/>
              Every choice a brushstroke.<br/>
              Your life — exactly this life — is the work.
            </p>

            <div style={{ background:'rgba(245,158,11,0.06)', border:'1px solid rgba(245,158,11,0.15)', borderRadius:16, padding:'26px 36px', maxWidth:580, margin:'0 auto 48px', animation:'mmm-fadeUp 1.5s ease-out 2.2s both' }}>
              <p style={{ fontFamily:"'Playfair Display',serif", fontStyle:'italic', fontSize:'1.05rem', color:'rgba(255,220,130,0.75)', lineHeight:1.8 }}>
                "You started by learning to picture what you want. You end by realizing you've been painting the whole time. The only question left is what you'll make next."
              </p>
              <div style={{ fontSize:'0.6rem', letterSpacing:'0.25em', textTransform:'uppercase', color:'rgba(245,158,11,0.3)', marginTop:12 }}>So make it</div>
            </div>

            <div style={{ fontSize:'0.72rem', letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(255,255,255,0.18)', animation:'mmm-blink 2.5s ease-in-out 3.5s infinite' }}>
              *click anywhere to restart*
            </div>
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────────── */

    function App() {
      const [screen, setScreen] = useState(0);
      const go = n => setScreen(n);

      useEffect(() => { window.scrollTo(0, 0); }, [screen]);

      const screens = [
        <LandingScreen        onNext={() => go(1)} />,
        <ConsciousnessScreen  onBack={() => go(0)} onNext={() => go(2)} />,
        <PurposeScreen        onBack={() => go(1)} onNext={() => go(3)} />,
        <HidingScreen         onBack={() => go(2)} onNext={() => go(4)} />,
        <ThreadScreen         onBack={() => go(3)} onNext={() => go(5)} />,
        <ArtScreen            onBack={() => go(4)} onNext={() => go(6)} />,
        <CompletionScreen     onNext={() => go(0)} />,
      ];

      return screens[screen];
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script src="../app-nav.js"></script>
</body>
</html>
