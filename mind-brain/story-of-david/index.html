<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Story of David — MindMapManifesto</title>
  <meta name="description" content="A story in seven steps: one day at the office, and a good man who takes every step through a virtue, and still goes down the same seven voices."/>
  <meta property="og:title" content="The Story of David"/>
  <meta property="og:description" content="A story in seven steps: one day at the office, and a good man who takes every step through a virtue, and still goes down the same seven voices."/>
  <meta property="og:image" content="../../Gemini_Generated_Image_9y8q49y8q49y8q49.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050507; color: #e8e8ed; overflow-x: hidden; }
    @keyframes mmm-reveal { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes mmm-fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes mmm-blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    @keyframes waveExpand { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../theme-app.css"/>
</head>
<body>
  <nav class="mb-nav" aria-label="Series navigation"><a href="../index.html">← back to mind x brain</a></nav>
  <p class="mb-hint" aria-hidden="true">← → keys or swipe</p>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SERIES = 'The Story of David';
    const ACCENT = '#60a5fa';
    const NUMBERS = ['Zero','One','Two','Three','Four','Five','Six','Seven'];
    const LEVELS = ['The Disciplined Morning','The Favour Bank','It’s Fine','I Didn’t Even Want It','Midnight at the Office','The Ledger','David Sees It'];

    /* ── Shared Components ───────────────────────────────────────── */

    function ProgressBar({ pct }) {
      return (
        <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, height:3, background:'#14141c' }}>
          <div style={{ height:'100%', width:`${pct}%`, background:ACCENT, transition:'width 0.5s ease' }}/>
        </div>
      );
    }

    function Eyebrow({ children }) {
      return (
        <div style={{ fontSize:'0.7rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:16, display:'flex', alignItems:'center', gap:10, fontWeight:500 }}>
          <span style={{ width:28, height:1, background:ACCENT, opacity:0.5, flexShrink:0, display:'block' }}/>
          {children}
        </div>
      );
    }

    function StepIndicator({ current, total }) {
      return (
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.2em', textTransform:'uppercase', color:'#8888a0' }}>
          Part <span style={{ color:ACCENT, fontWeight:600 }}>{current}</span> of {total}
        </div>
      );
    }

    function ArrowRight({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>);
    }

    function ArrowLeft({ size = 16 }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>);
    }

    function BackBtn({ onClick }) {
      return (
        <button onClick={onClick} style={{ display:'flex', alignItems:'center', gap:6, color:'#8888a0', background:'none', border:'none', cursor:'pointer', fontSize:'0.82rem' }}>
          <ArrowLeft size={15}/> Back
        </button>
      );
    }

    function BottomNav({ onBack, onNext, nextLabel = 'Continue' }) {
      return (
        <div style={{ display:'flex', justifyContent: onBack ? 'space-between' : 'flex-end', alignItems:'center', gap:16, marginTop:64, paddingTop:32, borderTop:'1px solid #1e1e2a' }}>
          {onBack && <BackBtn onClick={onBack}/>}
          <button onClick={onNext}
            style={{ display:'inline-flex', alignItems:'center', gap:9, padding:'13px 26px', borderRadius:12, fontSize:'0.875rem', fontWeight:600, border:'none', cursor:'pointer', background:`linear-gradient(135deg,${ACCENT},#2563eb)`, color:'#fff', textAlign:'left' }}>
            {nextLabel} <ArrowRight/>
          </button>
        </div>
      );
    }

    function InsightCard({ label = 'Key Insight', children }) {
      return (
        <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}33`, borderRadius:18, padding:34, marginBottom:36, position:'relative' }}>
          <div style={{ fontSize:'0.68rem', letterSpacing:'0.2em', textTransform:'uppercase', color:ACCENT, marginBottom:14, fontWeight:600 }}>{label}</div>
          <p style={{ fontSize:'clamp(1.05rem,2.4vw,1.3rem)', lineHeight:1.72, color:'#e8e8ed', position:'relative' }}>{children}</p>
        </div>
      );
    }

    function Footer() { return <footer style={{ textAlign:'center', marginTop:56, color:'#8888a0', fontSize:'0.75rem' }}>© 2026 MindMapManifesto.com</footer>; }
    function PageWrapper({ children, maxWidth = 820 }) { return <div style={{ position:'relative', zIndex:1, maxWidth, margin:'0 auto', padding:'60px 24px 100px' }}>{children}</div>; }

    function Prose({ children }) {
      return <p style={{ fontSize:'clamp(0.95rem,2.1vw,1.1rem)', lineHeight:1.88, color:'rgba(220,215,240,0.72)', marginBottom:22 }}>{children}</p>;
    }

    function PullQuote({ children }) {
      return (
        <div style={{ borderLeft:`2px solid ${ACCENT}40`, paddingLeft:24, marginBottom:30, marginTop:4 }}>
          <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.2vw,1.18rem)', lineHeight:1.78, color:`${ACCENT}a0` }}>{children}</p>
        </div>
      );
    }

    /* the seven levels, current one in full ink */
    function LevelTrack({ current }) {
      return (
        <div role="img" aria-label={`Level ${current} of 7`} style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:32 }}>
          {LEVELS.map((_, i) => (
            <div key={i} style={{ width:32, height:32, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', border:`1px solid ${ACCENT}66`, color:ACCENT, fontSize:'0.8rem', opacity: i + 1 === current ? 1 : 0.3 }}>{i + 1}</div>
          ))}
        </div>
      );
    }

    function Chapter({ children, n, label, title, nextLabel, onBack, onNext }) {
      return (
        <div style={{ background:'#050507', minHeight:'100vh', position:'relative' }}>
          <ProgressBar pct={n / PARTS.length * 100}/>
          <PageWrapper>
            <nav style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:56 }}>
              <BackBtn onClick={onBack}/>
              <StepIndicator current={n} total={PARTS.length}/>
            </nav>
            <div style={{ marginBottom:36, animation:'mmm-fadeUp 0.7s ease-out' }}>
              <Eyebrow>{label}</Eyebrow>
              <h1 style={{ fontSize:'clamp(1.9rem,4.6vw,2.95rem)', fontWeight:700, lineHeight:1.18, marginBottom:8, color:'#e8e8ed' }}>{title}</h1>
            </div>
            {children}
            <BottomNav onBack={onBack} onNext={onNext} nextLabel={nextLabel}/>
            <Footer/>
          </PageWrapper>
        </div>
      );
    }

    /* ── Screen 0: Landing ───────────────────────────────────────── */
    function LandingScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:820, display:'flex', flexDirection:'column', alignItems:'center', gap:36, animation:'mmm-reveal 1.5s cubic-bezier(0.16,1,0.3,1) forwards' }}>
            <div style={{ fontSize:'0.65rem', letterSpacing:'0.6em', color:'rgba(96,165,250,0.55)', textTransform:'uppercase', fontWeight:700 }}>A Story in Seven Steps</div>
            <div>
              <h1 style={{ fontSize:'clamp(2.8rem,10vw,6rem)', fontWeight:700, letterSpacing:'-0.02em', color:'white', marginBottom:10 }}>The Story of David</h1>
              <div style={{ fontSize:'clamp(0.9rem,2.2vw,1.3rem)', fontWeight:300, color:'rgba(255,255,255,0.4)', letterSpacing:'0.1em' }}>Seven Virtues, One Day at the Office</div>
            </div>
            <div style={{ maxWidth:600, borderLeft:'2px solid rgba(96,165,250,0.3)', paddingLeft:26, textAlign:'left' }}>
              <p style={{ fontStyle:'italic', fontSize:'clamp(0.95rem,1.9vw,1.13rem)', lineHeight:1.8, color:'rgba(255,255,255,0.55)' }}>
                He never did anything wrong. That was the problem: everything he did was right, and none of it was free.
              </p>
            </div>
            <button onClick={onNext}
              style={{ background:'rgba(96,165,250,0.08)', border:'1px solid rgba(96,165,250,0.28)', borderRadius:9999, padding:'18px 52px', fontSize:'0.8rem', fontWeight:700, letterSpacing:'0.4em', textTransform:'uppercase', color:'white', cursor:'pointer' }}>
              Begin
            </button>
          </div>
        </div>
      );
    }

    /* ── Parts ───────────────────────────────────────────────────── */
    const level = n => `Step ${NUMBERS[n]} · ${SERIES}`;

    /* David’s path through the matrix: [voice × virtue, as that voice lives it] */
    const PATH = [
      ['The conscious mind × Temperance', 'Controlling desires through willpower'],
      ['The con man × Charity', 'Strategic giving for future leverage'],
      ['Fear × Patience', 'Passive response to avoid confrontation'],
      ['Ego defense × Humility', 'False humility to protect self-image'],
      ['The self-saboteur × Diligence', 'Exhaustion from unsustainable effort'],
      ['The ego × Kindness', '“My kindness makes me deserving of love”'],
      ['The observer × Chastity', 'Honoring genuine connection'],
    ];

    const PARTS = [
      {
        label: `Before · ${SERIES}`, title: 'The Setting',
        body: <>
          <Prose>David was the one everyone called. When the server went down on a Sunday, when a client needed calming, when the new hire needed someone to show him the ropes, it was David. Thirty-four, reliable, kind. Everybody said so.</Prose>
          <Prose>For two years he had been the obvious choice for team lead. The announcement was set for Friday at four.</Prose>
          <PullQuote>He never did anything wrong. That was the problem: everything he did was right, and none of it was free.</PullQuote>
          <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'26px 28px', marginBottom:30 }}>
            <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:`${ACCENT}99`, marginBottom:16, fontWeight:600 }}>The seven steps, in the order he took them</div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {LEVELS.map((t, i) => (
                <div key={i} style={{ display:'flex', gap:14, alignItems:'center' }}>
                  <div style={{ width:28, height:28, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, border:`1px solid ${ACCENT}55`, fontSize:'0.78rem' }}>{i + 1}</div>
                  <p style={{ fontSize:'1rem', lineHeight:1.5 }}>{t}</p>
                </div>
              ))}
            </div>
          </div>
          <Prose>This one is a story. Inha’s night was real; David’s day is invented, to walk the other side of <a href="../seven-voices-matrix/index.html">the seven voices matrix</a>. Inha took her steps through the sins. David takes every one of his through a virtue.</Prose>
        </>,
      },
      {
        label: level(1), title: LEVELS[0], track: 1,
        body: <>
          <Prose>Friday began at 5:30. Cold shower, no breakfast, black coffee. On the way in he walked along the river while the sun came up over the water, and he didn’t see it. He was busy being a man who gets up at 5:30.</Prose>
          <Prose>At ten someone carried a birthday cake into the kitchen.</Prose>
          <PullQuote>“Not for me, thanks,” David said, and felt the small glow of saying it.</PullQuote>
          <InsightCard label="Step 1 · The conscious mind × Temperance">Temperance, taken by the surface: <em>controlling desires through willpower.</em> Not balance, but an image of discipline, for an audience of one.</InsightCard>
          <Prose>Leonardo’s face of the same cell is looking without seeing. The sunrise was right there.</Prose>
        </>,
      },
      {
        label: level(2), title: LEVELS[1], track: 2,
        body: <>
          <Prose>Before lunch he stopped by the office of Sara, his manager.</Prose>
          <PullQuote>“Just wanted to say, I’m happy to take the Henderson account again this weekend.”</PullQuote>
          <Prose>Again. He let the word sit there. Three weekends in a row, the client dinner he covered when she was sick, the intern he trained in his own time. He had never asked for anything. He had been depositing.</Prose>
          <InsightCard label="Step 2 · The con man × Charity">Charity, taken by the con man: <em>strategic giving for future leverage.</em> Every favour was real, and every favour had a receipt.</InsightCard>
          <Prose>Underneath it sits the sin of the same cell, resource hoarding. He wasn’t giving his time away. He was saving it up.</Prose>
        </>,
      },
      {
        label: level(3), title: LEVELS[2], track: 3,
        body: <>
          <Prose>At four, Sara stood up in front of the team.</Prose>
          <PullQuote>“I’m really pleased to announce our new team lead: Marc.”</PullQuote>
          <Prose>Everyone clapped. David clapped the loudest. “Congratulations, man. You deserve it.”</Prose>
          <Prose>Then he went to the bathroom, locked the door and held the edge of the sink until his hands stopped shaking. He never went to Sara’s office. He never asked why.</Prose>
          <InsightCard label="Step 3 · Fear × Patience">Patience, taken by fear: <em>a passive response to avoid confrontation.</em> It looked like grace. It was a man too scared to ask one question.</InsightCard>
        </>,
      },
      {
        label: level(4), title: LEVELS[3], track: 4,
        body: <>
          <Prose>Drinks after work. Priya from design leaned over: “Are you okay? Honestly, everyone thought it was yours.”</Prose>
          <PullQuote>“Honestly? I didn’t even want it. I’m not a title person. I like doing the real work.”</PullQuote>
          <Prose>He said it so smoothly he almost believed it.</Prose>
          <InsightCard label="Step 4 · Ego defense × Humility">Humility, taken by ego defense: <em>false humility to protect self-image.</em> He ruled out his own wanting without ever looking at it.</InsightCard>
          <Prose>Inha stood in this same cell. Her version was “No… it won’t work.” His was “I didn’t even want it.” Same cell, opposite faces: one through pride, one through humility, and both of them a wall.</Prose>
        </>,
      },
      {
        label: level(5), title: LEVELS[4], track: 5,
        body: <>
          <Prose>He left the bar early and went back to the office. Marc’s launch deck for Monday was on the shared drive. It was fine. David rebuilt it anyway, slide by slide.</Prose>
          <Prose>Three missed calls from Lena. Dinner had been at eight. By 1:40 his head was pounding, the coffee had gone cold, and he no longer cared whether the deck was better, only that he had done it.</Prose>
          <InsightCard label="Step 5 · The self-saboteur × Diligence">Diligence, taken by the saboteur: <em>exhaustion from unsustainable effort.</em> All effort, no method, until you break.</InsightCard>
          <PullQuote>Inha was here too: sick, working nights “like a dog.” Different lives, same cell.</PullQuote>
        </>,
      },
      {
        label: level(6), title: LEVELS[5], track: 6,
        body: <>
          <Prose>He got home at half past two. Lena was still awake.</Prose>
          <PullQuote>“You missed dinner. Again.”</PullQuote>
          <Prose>It came out of him as if it had been written down in advance: “Do you know how much I do for everyone? Three weekends. The intern. Marc’s deck, tonight, for free. The least I deserve is someone who’s on my side.”</Prose>
          <InsightCard label="Step 6 · The ego × Kindness">Kindness, taken by the ego: <em>“my kindness makes me deserving of love.”</em> Every kind thing he had ever done turned into an invoice.</InsightCard>
          <Prose>It was Inha’s 450 bill in a nicer suit: a debt that never existed. Nobody had asked him for any of it. Underneath sits the sin of the same cell, I AM Lack: “How do I stop feeling like I’m not enough?”</Prose>
        </>,
      },
      {
        label: level(7), title: LEVELS[6], track: 7,
        body: <>
          <Prose>Lena didn’t argue. She just said, quietly:</Prose>
          <PullQuote>“Nobody asked you to rebuild the deck, David.”</PullQuote>
          <Prose>And in the silence he saw it, the way you see a staircase from above: the cold shower, the favour bank, the clapping, “I didn’t even want it,” the deck, the ledger. Seven steps, one after another, and every one of them wearing a virtue.</Prose>
          <PullQuote>“I wanted it,” he said. “I really wanted it. And I’m hurt.”</PullQuote>
          <Prose>Lena took his hand. That night he slept without an alarm.</Prose>
          <InsightCard label="Step 7 · The observer × Chastity">Chastity, from the observer: <em>honoring genuine connection.</em> No performance, no ledger, no receipt. Just the truth, said to the person in front of him.</InsightCard>
        </>,
      },
      {
        label: `After · ${SERIES}`, title: 'Monday',
        body: <>
          <Prose>On Monday David deleted his version of the deck. He walked over to Marc’s desk and said congratulations again, and this time he meant it.</Prose>
          <Prose>Then he went to Sara’s office and asked the question he hadn’t asked on Friday: “What would it take for me to lead a team?” She told him. It was a real answer, it stung a little, and it was useful.</Prose>
          <PullQuote>He still took the Henderson account that weekend. He just didn’t keep the receipt.</PullQuote>
        </>,
      },
      {
        label: `After · ${SERIES}`, title: 'The Same Stairs',
        body: <>
          <Prose>Inha took her steps through the sins. David took every one of his through a virtue, each of the seven exactly once, and he went down exactly the same stairs.</Prose>
          <div style={{ background:'#0d0d12', border:`1px solid ${ACCENT}2e`, borderRadius:16, padding:'26px 28px', marginBottom:30 }}>
            <div style={{ fontSize:'0.63rem', letterSpacing:'0.22em', textTransform:'uppercase', color:`${ACCENT}99`, marginBottom:16, fontWeight:600 }}>David’s path</div>
            <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
              {PATH.map(([t, d], i) => (
                <div key={i} style={{ borderLeft:`2px solid ${ACCENT}4d`, paddingLeft:14 }}>
                  <div style={{ fontWeight:700, fontSize:'1.1rem', color:'#e8e8ed', marginBottom:2 }}>{i + 1} · {t}</div>
                  <p style={{ fontSize:'0.9rem', color:'#8888a0', lineHeight:1.6 }}>{d}</p>
                </div>
              ))}
            </div>
          </div>
          <InsightCard label="The voice decides">A virtue taken by a frightened voice is still fear. <em>David’s way out was not a better virtue. It was the eye above the stairs.</em></InsightCard>
          <Prose>See both paths side by side on <a href="../seven-voices-matrix/index.html">the seven voices matrix</a>, and the night that started it all in <a href="../story-of-inha/index.html">the story of inha</a>.</Prose>
        </>,
      },
    ];

    /* ── Completion Screen ──────────────────────────────────────── */
    function CompletionScreen({ onNext }) {
      return (
        <div style={{ background:'#000', minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', position:'relative', overflow:'hidden' }} onClick={onNext}>
          {[0, 1, 2].map(i => (<div key={i} style={{ position:'absolute', top:'50%', left:'50%', width:100+i*90, height:100+i*90, borderRadius:'50%', border:`1px solid ${['rgba(96,165,250,0.35)','rgba(129,140,248,0.25)','rgba(6,182,212,0.18)'][i]}`, animation:`waveExpand 5s ease-out ${i*1.6}s infinite` }}/>))}
          <div style={{ position:'relative', zIndex:10, textAlign:'center', padding:'40px 24px', maxWidth:760 }}>
            <div style={{ fontSize:'0.62rem', letterSpacing:'0.5em', textTransform:'uppercase', color:'rgba(96,165,250,0.45)', marginBottom:36 }}>Complete · Step Seven</div>
            <h1 style={{ fontSize:'clamp(2.2rem,8vw,5rem)', fontWeight:700, color:'#e8e8ed', letterSpacing:1, marginBottom:32, animation:'mmm-reveal 2s ease-out 0.5s both', lineHeight:1.1 }}>DAVID<br/>SEES IT</h1>
            <p style={{ fontStyle:'italic', fontSize:'clamp(1rem,2.4vw,1.25rem)', color:'rgba(200,215,255,0.55)', lineHeight:1.8, marginBottom:44, animation:'mmm-fadeUp 1.5s ease-out 1.5s both' }}>Seven virtues, one each.<br/>The same seven steps.<br/>One honest sentence at the end.</p>
            <div style={{ background:'rgba(96,165,250,0.06)', border:'1px solid rgba(96,165,250,0.15)', borderRadius:16, padding:'26px 36px', maxWidth:600, margin:'0 auto 48px', animation:'mmm-fadeUp 1.5s ease-out 2.2s both' }}>
              <p style={{ fontStyle:'italic', fontSize:'1.05rem', color:'rgba(200,215,255,0.72)', lineHeight:1.8 }}>“I wanted it. I really wanted it. And I’m hurt.”</p>
            </div>
            <div style={{ fontSize:'0.72rem', letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(255,255,255,0.18)', animation:'mmm-blink 2.5s ease-in-out 3.5s infinite' }}>*click anywhere to restart*</div>
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────────── */
    function App() {
      const [screen, setScreen] = useState(0);
      const go = n => setScreen(n);
      useEffect(() => { window.scrollTo(0, 0); }, [screen]);

      if (screen === 0) return <LandingScreen onNext={() => go(1)}/>;
      if (screen > PARTS.length) return <CompletionScreen onNext={() => go(0)}/>;
      const part = PARTS[screen - 1];
      const next = PARTS[screen];
      return (
        <Chapter key={screen} n={screen} label={part.label} title={part.title} nextLabel={next ? next.title : 'Finish'} onBack={() => go(screen - 1)} onNext={() => go(screen + 1)}>
          {part.track && <LevelTrack current={part.track}/>}
          {part.body}
        </Chapter>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script src="../app-nav.js"></script>
</body>
</html>
