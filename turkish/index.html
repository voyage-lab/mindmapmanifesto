{t:'mc',q:'"I have been ill since this morning." (sabah)',o:['Bu sabahtan beri hastayım.','Bu sabah beri hastayım.','Bu sabaha kadar hastayım.','Bu sabahtan hastaydım.'],a:0,w:'Turkish says I am ill since this morning.'},
{t:'mc',q:'"I\'ll wait until five."',o:['Beşe kadar beklerim.','Beşten kadar beklerim.','Beş kadar beklerim.','Beşte kadar beklerim.'],a:0,w:'-e kadar is until.'},
{t:'mc',q:'"As clever as you." (informal)',o:['senin kadar akıllı','sen kadar akıllı','sana kadar akıllı','seni kadar akıllı'],a:0,w:'Sen takes the possessor form with kadar.'},
{t:'mc',q:'"As rich as them." (onlar)',o:['onlar kadar','onların kadar','onlara kadar','onları kadar'],a:0,w:'O and onlar and nouns take no ending before kadar.'},
{t:'mc',q:'Your head aches. What do you tell the chemist?',o:['Başım ağrıyor. Bir ilaç istiyorum.','Başı ağrıyor mu?','Baş ilaç var mı?','Ağrı başımı değil.'],a:0,w:'baş + ım (my head) + ağrıyor.'},
{t:'ty',q:'Type the Turkish for "head".',a:['baş'],w:'baş, with ş.'},
{t:'mc',q:'Someone shouts "Düşersin!" What do they mean?',o:['You will fall (careful)!','You fell!','Don\'t fall!','You fall a lot.'],a:0,w:'It is the -r tense warning: the unspoken if you are not careful.'}
]});

ADD({id:'u11',kind:'u',n:11,group:'D',tr:'Sizce çok sakin bir yermiş!',en:'You said it was a very quiet place!',pp:'167–178',
short:'Complaining and apologising, reporting what others said with -miş, and linking events with when, after, while and before.',
scene:'A travel agency. A family has come home early from a disastrous hotel and the mother has come to complain and ask for her money back.',
purpose:'This chapter is about speaking at one remove: reporting what you were told, expressing doubt, and showing you were not there. The -miş tense carries all of that, and it also marks surprise and storytelling. You also learn to sequence events with -ince, -dikten sonra, -ken, -meden önce and -meden, to build verbs with -le and -leş, and to complain and apologise.',
can:['Complain and apologise.','Report what someone else said or what you have just discovered.','Tell a story or joke in the right tense.','Say when, after, while, before and without doing something.','Build verbs from nouns and adjectives.'],
gram:[['-miş','Stem + -miş + person. It means apparently, reportedly or I have just found out. With to be: -ymiş.',[['Dün gelmişsin.','Apparently you came yesterday.'],['İngilizmiş.','They say he is English.']]],
['What -miş is for','Reporting what someone said, asking approval when you are unsure, discovering something, and stories and jokes.',[['Bir güzel prenses varmış…','There was a beautiful princess…']]],
['-miştir','You expect something has happened, or it is an official past.',[['Unutmuştur.','She must have forgotten.']]],
['Time linkers','-ince on doing. -dikten sonra after. -ken while (on the -r tense). -meden önce before. -meden without.',[['İstanbul\'a gelince…','On arriving in İstanbul…'],['Yemeğini yedikten sonra uyudu.','She slept after eating her meal.']]],
['Verbs with -le and -leş','-lemek makes a verb (temiz → temizlemek). -leşmek means to become (iyi → iyileşmek).',[['hazır → hazırlamak','ready → prepare']]],
['Paired words','hem… hem both… and, ya… ya either… or, ne… ne neither… nor.',[['Ya çarşamba ya perşembe.','Either Wednesday or Thursday.']]]],
tip:'Turks use -miş all the time to distance themselves from what they are saying. English has no tense that does the same.',
vocab:[['şikâyet','complaint'],['şikâyet etmek','to complain'],['özür dilemek','to apologise'],['çok özür dilerim','I am very sorry'],['felaket','disaster'],['gürültülü','noisy'],['berbat','terrible'],['tatsız','tasteless'],['iğrenç','disgusting'],['kirli','dirty'],['müdür','manager'],['geri almak','to take back'],['hemen şimdi','right now'],['en kısa zamanda','as soon as possible'],['pişman olmak','to regret'],['teklif','offer'],['müşteri','customer'],['sakin','quiet, calm'],['manzara','view'],['rezervasyon','booking'],['lüks','luxurious'],['dönmek','to return'],['devam etmek','to continue'],['saçma','nonsense'],['üzülmek','to be sorry'],['en sonunda','finally'],['temiz','clean'],['temizlemek','to clean'],['hazır','ready'],['hazırlamak','to prepare'],['iyileşmek','to get better'],['zayıf','thin, weak'],['ya… ya…','either… or…'],['hem… hem…','both… and…'],['ne… ne…','neither… nor…']],
drills:[
{t:'mc',q:'"Apparently she came."',o:['Gelmiş.','Gelmiştir.','Geldi.','Gelmeli.'],a:0,w:'-miş means apparently or reportedly.'},
{t:'ty',q:'"They say it is nice." (güzel + -miş)',a:['güzelmiş','Güzelmiş.'],w:'güzel + miş.'},
{t:'mc',q:'"Apparently you were English." (formal)',o:['İngilizmişsiniz','İngilizdiniz','İngiliz misiniz','İngilizmişim'],a:0,w:'İngiliz + miş + siniz.'},
{t:'mc',q:'"They say it is a very quiet place." (yer)',o:['Çok sakin bir yermiş.','Çok sakin bir yerdi.','Çok sakin bir yerimiş.','Çok sakin yer mi.'],a:0,w:'yer ends in a consonant: yer + miş.'},
{t:'mc',q:'You look out of the window and see wet streets. You say it has rained (just discovered):',o:['Yağmur yağmış!','Yağmur yağıyor.','Yağmur yağacak.','Yağmur yağsın!'],a:0,w:'Discovering something you did not witness uses -miş.'},
{t:'mc',q:'"On arriving in İstanbul…" (gel)',o:['İstanbul\'a gelince','İstanbul\'a gelirken','İstanbul\'a gelmeden','İstanbul\'a geldikten'],a:0,w:'-ince on doing something.'},
{t:'mc',q:'"After eating." (yemek)',o:['yedikten sonra','yeyince sonra','yemeden sonra','yerken sonra'],a:0,w:'-dikten sonra: after.'},
{t:'mc',q:'"While working." (çalış)',o:['çalışırken','çalışınca','çalıştıktan','çalışmadan'],a:0,w:'-ken follows the -r tense: çalışır + ken.'},
{t:'mc',q:'"Before doing the shopping."',o:['alışveriş yapmadan önce','alışveriş yaptıktan sonra','alışveriş yaparken','alışveriş yapınca'],a:0,w:'-meden önce is before.'},

{t:'mc',q:'You want to start a complaint at a travel agency:',o:['Bir şikâyetim var.','Bir ilacım var.','Hoş bulduk.','Şerefe.'],a:0,w:'şikâyet + im + var.'},
{t:'mc',q:'"She must have forgotten." (unut)',o:['Unutmuştur.','Unutacaktır.','Unutuyordur.','Unutsun.'],a:0,w:'-miştir expresses probability.'},
{t:'mc',q:'Which is NOT a use of -miş?',o:['Reporting what someone said','Telling a story','A future promise','Discovering something'],a:2,w:'Promises use the -r tense.'}
]});

ADD({id:'u12',kind:'u',n:12,group:'D',tr:'Aradığınız numara yanlıştır',en:'The number you have dialled is incorrect',pp:'179–192',
short:'Which-clauses (the colour I like), official announcements, chaining actions with -ip, and intensified adjectives like kıpkırmızı.',
scene:'A holiday morning. A woman tries to phone her parents and keeps hitting telephone company recordings, then finally gets through.',
purpose:'This chapter gives you Turkish relative clauses, which put the whole description before the noun: instead of the colour which I like, Turkish says my-liked colour. You learn -dik and -ecek adjectives, how to turn them into nouns, how -en differs from -dik (doer versus object), the -ip ending for chaining actions, and the prefix that intensifies adjectives. You also see the formal -dir and -miştir of announcements.',
can:['Say the book you are holding, the house I live in, the film you will see.','Tell the doer (-en) from the object (-dik).','Use -dik and -ecek forms as nouns.','Chain actions with -ip instead of and.','Read recorded announcements.'],
gram:[['-dik adjectives','Stem + -dik + possessed ending of the doer. The verb need not be in the past: it can mean am, was or did.',[['sevdiğim renk','the colour I like'],['sürdüğü araba','the car he drives'],['oturduğum ev','the house I live in']]],
['The case is built in','When the head noun would take -e, -den or ile, that meaning is folded into the -dik form: gittiği okul (the school he goes to).',[['geldiğiniz köy','the village you come from']]],
['-en versus -dik','-en describes the doer: beni seven kadın. -dik describes the object: sevdiğim kadın.',[['beni seven kadın','the woman who loves me'],['sevdiğim kadın','the woman I love']]],
['-dik and -ecek as nouns','Drop the head noun and move its ending to the end: Yaptığına bak.',[['Aldığımı istiyor musun?','Do you want what I bought?']]],
['-ecek adjectives','The future version: okuyacağım kitap, göreceğiniz film. Also used for doers: Yapacak bu.',[['gideceğim yerler','the places I will go']]],
['-ip','Replaces and between two actions with the same subject and same tense: Bakkala gidip süt al.',[['Oturup ders çalışıyorlar.','They sit down and study.']]],
['Intensifying prefix','Repeat the first two letters and add m, p, s or r: kırmızı → kıpkırmızı.',[['beyaz → bembeyaz','mavi → masmavi'],['siyah → simsiyah','boş → bomboş']]]],
tip:'The Turkish phone message uses the formal -dir (yanlıştır) and -miştir. Both mean nothing more than is and has.',
vocab:[['numara','number'],['yanlış','wrong'],['kontrol etmek','to check'],['abone','subscriber'],['kayıt','recording'],['hat','line'],['bayram','public holiday'],['misafir','guest'],['sohbet etmek','to chat'],['tahmin etmek','to guess'],['çağırmak','to call'],['yürüyüş','walk'],['karışmak','to interfere'],['değişmek','to change'],['yine','again'],['ayrıca','in addition'],['dolu','full'],['meşgul','busy'],['bütün','all, whole'],['rakam','digit'],['kıpkırmızı','bright red'],['bembeyaz','snow white'],['masmavi','clear blue'],['sapsarı','pure yellow'],['yemyeşil','bright green'],['simsiyah','pitch black'],['tertemiz','spotlessly clean'],['bomboş','completely empty'],['dümdüz','straight as a die'],['bambaşka','totally different'],['çırılçıplak','stark naked']],
drills:[
{t:'mc',q:'"The colour which I like." (sev)',o:['sevdiğim renk','seven renk','sevdiği renk','seveceğim renk'],a:0,w:'sev + dik + im: the owner of the liking is I.'},
{t:'mc',q:'"The book you are holding." (sen; tut)',o:['tuttuğun kitap','tutan kitap','tuttun kitap','tutacağın kitap'],a:0,w:'tut + tuk + un, with k softening to ğ.'},
{t:'mc',q:'"The car he drives." (sür)',o:['sürdüğü araba','süren araba','sürdü araba','sürecek araba'],a:0,w:'sür + düğ + ü.'},
{t:'mc',q:'"The house in which I live." (otur)',o:['oturduğum ev','oturan ev','oturacağım ev','oturduk ev'],a:0,w:'The in is folded into the -dik form.'},
{t:'mc',q:'"The school he goes to." (git)',o:['gittiği okul','giden okul','gideceği okul','gittim okul'],a:0,w:'git + tik + i: gittiği.'},
{t:'mc',q:'Which phrase means "the woman who loves me"?',o:['beni seven kadın','sevdiğim kadın','sevdiği kadın','beni sevdiğim kadın'],a:0,w:'The woman does the loving, so use -en.'},
{t:'mc',q:'Which phrase means "the woman I love"?',o:['sevdiğim kadın','beni seven kadın','seven kadın','sevecek kadın'],a:0,w:'The woman receives the love, so use -dik.'},
{t:'ty',q:'"The film you will see." (formal; gör)',a:['göreceğiniz film'],w:'gör + ecek + iniz with k softening: göreceğiniz.'},
{t:'mc',q:'"The book I am going to read." (oku)',o:['okuyacağım kitap','okuduğum kitap','okuyan kitap','okurum kitap'],a:0,w:'oku + y + acak + ım, with k softening.'},
{t:'mc',q:'"Look at what you have done."',o:['Yaptığına bak.','Yaptığın bak.','Yapana bak.','Yapacağını bak.'],a:0,w:'Yaptığın şeye bak shortens to Yaptığına bak: the -e moves onto the -dik word.'},
{t:'mc',q:'"Go to the grocer\'s and buy a litre of milk." (shortened with -ip)',o:['Bakkala gidip bir litre süt al.','Bakkala gitmek bir litre süt al.','Bakkala gidince bir litre süt al.','Bakkala gitti bir litre süt al.'],a:0,w:'-ip replaces and when the subject is the same.'},
{t:'mc',q:'Which sentence cannot be shortened with -ip?',o:['Ali oyun oynuyor ve Hakan televizyon seyrediyor.','Bakkala git ve süt al.','Oturuyorlar ve ders çalışıyorlar.','Sinemaya gidelim ve film seyredelim.'],a:0,w:'-ip needs the same subject doing both things.'},
{t:'ty',q:'"Pitch black." (siyah, intensified)',a:['simsiyah'],w:'si + m + siyah.'},
{t:'mc',q:'"As green as can be." (yeşil)',o:['yemyeşil','yeşyeşil','yeyeşil','yeşşeşil'],a:0,w:'ye + m + yeşil.'},
{t:'mc',q:'"Completely empty." (boş)',o:['bomboş','bobboş','boboş','bosboş'],a:0,w:'bo + m + boş.'},
{t:'mc',q:'The recording says "Aradığınız numara yanlıştır." What does it mean?',o:['The number you called is wrong.','Your phone is broken.','The line is busy.','Please call again later.'],a:0,w:'aradığınız numara is the number you called; yanlıştır is the formal is wrong.'}
]});

ADD({id:'u13',kind:'u',n:13,group:'D',tr:'Ne olduğunu anlatır mısınız?',en:'Could you tell me what happened?',pp:'193–204',
short:'Narrating the past in layers: was happening, had happened, and reporting events with -dik and -ecek noun clauses.',
scene:'A beach in Marmaris. A tourist reports a missing wallet to the tourist police and describes what she did and saw.',
purpose:'This chapter lets you tell a story with the right time layers. The past continuous (-iyordu) gives what was going on, the past perfect (-mişti) gives what had already happened, and -dik and -ecek noun clauses let you report events: I said that I was fine, they heard that you got married. You also get the linking phrases (as, although, because, as far as) and -iş nouns.',
can:['Say what was happening and what had happened before.','Report what was said, heard or guessed.','Link clauses with gibi, halde, için, kadar and zaman.','Tell the difference between a specific event and the idea of doing something.','Build nouns with -iş (giriş, çıkış).'],
gram:[['Past continuous','-iyor + past of to be: yapıyordum, içiyordunuz.',[['Ders çalışıyordum.','I was studying.']]],
['Past perfect -mişti','Had done. It is not the -miş of reports.',[['Sen gitmiştin.','You had gone.'],['Daha önce hiç yememiştim.','I had never eaten it before.']]],
['Reported events','The verb of the reported clause becomes a noun with -dik or -ecek plus a possessed ending and -i.',[['Hasta olduğumu kim söyledi?','Who said that I was ill?'],['Yardım etmeyeceğimizi anlıyorlar.','They understand we won\'t help.']]],
['-diği + a linker','-diği gibi as, -diği halde although, -diği için because, -diği kadar as far as, -diği zaman when.',[['Bildiğim kadar iyiler.','As far as I know they are fine.']]],
['Event or idea','Use -dik / -ecek for a specific event, the short infinitive for the idea or way of doing it.',[['gittiğini söylediler','they said he went'],['gitmesini söylediler','they told him to go']]],
['-iş nouns','kalkış departure, çıkış exit, giriş entry, uçuş flight, yürüyüş walk, alışveriş shopping.',[]],
['Var and yok phrases','Bir varmış bir yokmuş (once upon a time), Ne var? (what is up?), yok olmak (to disappear).',[]]],
tip:'Bilemiyorum (I cannot know) is the very Turkish way to say you cannot tell, because it uses the can\'t form of bilmek.',

ADD({id:'u14',kind:'u',n:14,group:'E',tr:'Güldürme beni!',en:'Don\'t make me laugh!',pp:'205–217',
short:'Used to, causing things to happen, doing things to each other, getting things done, and adverbs of time, place and manner.',
scene:'Two old school friends bump into each other in the street and catch up over eight or nine years.',
purpose:'This chapter lets you reminisce and react. You learn the habitual past (-erdi, used to or would), the causative endings (to make or have someone do something, to stop a car versus to stop), the reciprocal (each other, with birbiri and -iş), and the adverbs of time, place and manner that tell you when, where and how.',
can:['Say what used to happen and what you did not use to do.','Say you make or have someone do something.','Tell a normal verb from its causative (durmak versus durdurmak).','Say each other and do things to one another.','Use the main adverbs of when, where and how.'],
gram:[['Used to: -erdi','Take the -r tense, remove the person ending and add the past of to be: sürerdim, gelirdin.',[['Araba sürerdim.','I used to drive.'],['Futbol oynamazdın.','You didn\'t use to play football.']]],
['Causatives','Endings -dir, -t, -it, -ir, -er cause an action. There is no firm rule; verbs with more than one syllable ending in r, l or a vowel take -t.',[['ölmek → öldürmek','to die → to kill'],['gülmek → güldürmek','to laugh → to make laugh'],['hatırlamak → hatırlatmak','to remember → to remind'],['saçı kestirmek','to have your hair cut']]],
['Stopping something or stopping','Intransitive verbs have a causative twin that takes an object.',[['Durdum.','I stopped.'],['Arabayı durdurdum.','I stopped the car.']]],
['Each other','birbiri (birbirimiz, birbiriniz, birbirleri) is always an object. The -iş ending on a verb also means each other.',[['Birbirimizi seviyoruz.','We love each other.'],['Yarın görüşürüz.','We\'ll see each other tomorrow.']]],
['Adverbs: when','artık now, henüz not yet, hemen straight away, bazen sometimes, nadiren seldom, sık sık often, her zaman always, hiçbir zaman never, sabahları in the mornings, kışın in winter.',[]],
['Adverbs: where and how','ileri ahead, geri back, aşağı down, yukarı up, içeri inside, dışarı outside. Çok, az, böyle, yavaş yavaş, zaman zaman. Adjectives work as adverbs; -ce makes more.',[['Yavaşça sür.','Drive slowly.']]]],
tip:'A pair of adverbs goes when first, then how. They sit directly in front of the verb.',
vocab:[['sürpriz','surprise'],['şaşırmak','to be surprised'],['görünmek','to look, appear'],['görüşmek','to see each other'],['eskiden','in the past'],['evli','married'],['ev hanımı','housewife'],['öğretmen','teacher'],['hatırlamak','to remember'],['hatırlatmak','to remind'],['itiraf etmek','to confess'],['beraber','together'],['okul','school'],['bitirmek','to finish'],['yavaş','slow'],['hemen','immediately'],['henüz','not yet'],['hiçbir zaman','never'],['nadiren','seldom'],['bazen','sometimes'],['sık sık','often'],['her zaman','always'],['sabahları','in the mornings'],['geceleri','at night'],['kışın','in winter'],['yazın','in summer'],['öldürmek','to kill'],['güldürmek','to make laugh'],['uyandırmak','to wake someone'],['durdurmak','to stop (something)'],['pişirmek','to cook (something)'],['değiştirmek','to change (something)'],['birbiri','each other'],['saçı kestirmek','to have your hair cut']],
drills:[
{t:'mc',q:'"I used to drive." (sür)',o:['Araba sürerdim.','Araba sürüyordum.','Araba sürdüm.','Araba sürecektim.'],a:0,w:'-r tense stem + past of to be.'},
{t:'mc',q:'"You used to come on Sunday." (sen)',o:['Pazar günü gelirdin.','Pazar günü geliyordun.','Pazar günü geldin.','Pazar günü gelmiştin.'],a:0,w:'gelir + din.'},
{t:'ty',q:'"I didn\'t use to drive."',a:['Araba sürmezdim','araba sürmezdim.'],w:'sür + mez + dim.'},
{t:'mc',q:'"They used to work a lot."',o:['Çok çalışırlardı.','Çok çalıştılar.','Çok çalışıyorlar.','Çok çalışmışlar.'],a:0,w:'çalışırlardı (or çalışırdılar).'},
{t:'mc',q:'"To kill" is the causative of ölmek. It is:',o:['öldürmek','ölmek','ölemek','öltmek'],a:0,w:'öl + dür + mek.'},
{t:'mc',q:'"To remind" is the causative of hatırlamak:',o:['hatırlatmak','hatırlamak','hatırdırmak','hatırlaşmak'],a:0,w:'Longer stems ending in a vowel or l take -t.'},
{t:'mc',q:'"To wake someone up" (uyanmak):',o:['uyandırmak','uyanmak','uyandamak','uyandatmak'],a:0,w:'uyan + dır + mak.'},
{t:'mc',q:'"I stopped the car."',o:['Arabayı durdurdum.','Arabayı durdum.','Araba durdum.','Arabada durdum.'],a:0,w:'When there is an object, use the causative durdurmak.'},
{t:'mc',q:'"He is cooking the chicken." (tavuk)',o:['Tavuğu pişiriyor.','Tavuk pişiyor.','Tavuğa pişiyor.','Tavuk pişirir mi.'],a:0,w:'pişmek is to cook (by itself), pişirmek is to cook something.'},
{t:'mc',q:'"We love each other."',o:['Birbirimizi seviyoruz.','Birbirimiz seviyoruz.','Birbirini seviyoruz.','Biz birbiriz seviyoruz.'],a:0,w:'birbirimiz + -i as the object.'},
{t:'mc',q:'"Help each other!" (formal)',o:['Birbirinize yardım edin!','Birbirimize yardım edin!','Birbirlerine yardım edin!','Birbirini yardım edin!'],a:0,w:'The you form of birbiri is birbiriniz; add -e.'},
{t:'mc',q:'"We\'ll see each other tomorrow." (görüşmek)',o:['Yarın görüşürüz.','Yarın görürüz.','Yarın görüşelim mi.','Yarın birbirimiz görürüz.'],a:0,w:'-iş marks the reciprocal.'},
{t:'mc',q:'Which word means "seldom"?',o:['bazen','nadiren','hemen','sık sık'],a:1,w:'nadiren seldom, bazen sometimes, sık sık often.'},
{t:'mc',q:'"Drive slowly."',o:['Yavaşça sür.','Yavaş sürme.','Yavaşı sür.','Sürme yavaş.'],a:0,w:'-ça makes the adverb; it sits before the verb.'},
{t:'ty',q:'"I had my hair cut." (saç, kes)',a:['saçımı kestirdim','Saçımı kestirdim.'],w:'kes + tir + di + m.'},
{t:'mc',q:'A friend teases you about an old claim. You say "Güldürme beni!" What does it mean?',o:['Don\'t make me laugh!','Don\'t laugh at me!','Let him laugh.','I am laughing.'],a:0,w:'güldürmek is to make someone laugh; -me is the informal negative command.'}
]});

ADD({id:'u15',kind:'u',n:15,group:'E',tr:'Burası ne zaman inşa edilmiş?',en:'When was this place built?',pp:'218–233',
short:'The passive, saying by whom, was going to, reflexives (myself, himself), and nouns and adjectives built from verb stems.',
scene:'A tavern in Çiçek Pasajı, an old arcade in İstanbul. A host tells his friend how the building was built and why it has its name.',
purpose:'This chapter teaches you to say what was done without saying who did it: the passive. It adds tarafından for by, the passive signs you see everywhere (Girilmez, Kahvaltı verilir), the past future for was going to, the reflexive (kendi, -in verbs), and a large family of noun and adjective endings built from verb stems. It is the chapter that makes Turkish signs readable.',
can:['Say that something was done, is done or will be done.','Say by whom with tarafından.','Read common passive signs.','Say was going to.','Use kendi and reflexive verbs.','Recognise nouns built from verb stems.'],
gram:[['The passive','Stem + -il, or -in after a stem ending in l, or -n after a vowel. Then add the tense.',[['Kapı açıldı.','The door was opened.'],['Araba yıkanacak.','The car will be washed.'],['Cüzdan çalındı.','The purse was stolen.']]],
['By: tarafından','Used for inventions, discoveries and processes. For ordinary actions use the active.',[['Bu bina Türkler tarafından inşa edildi.','This building was built by Turks.']]],
['Signs','Passive forms state what is done or not done.',[['Girilmez.','No entry.'],['Sigara içilmez.','No smoking.'],['Kahvaltı verilir.','Breakfast served.']]],
['Past future -ecekti','Future stem + past of to be: yapacaktım, I was going to.',[['Sana telefon edecektim.','I was going to phone you.']]],
['Kendi','Self. Kendim, kendin, kendisi, kendimiz, kendiniz, kendileri. Kendi kendime means by myself.',[['Kendine iyi bak.','Look after yourself.']]],
['Reflexive verbs','-in on the stem: yıkanmak (wash yourself), giyinmek (get dressed), dinlenmek (relax). Some are identical to the passive: context decides.',[['giymek → giyinmek','to put on → to get dressed']]],
['Verb stems to nouns','-im, -in, -gi, -gin, -gen, -i, and more: bilmek → bilgi, bilim; üzmek → üzgün; çalışmak → çalışkan.',[['saymak → sayı, sayın, saygı','to count → number, esteemed, respect']]]],
tip:'When someone bothers you, Rahatsız etmeyin! is a polite request, Sataşmayın! is stronger, and Çok ayıp! shames them.',
vocab:[['inşa etmek','to build'],['inşa edilmek','to be built'],['mimar','architect'],['çizmek','to draw'],['han','large commercial building'],['pasaj','arcade, passage'],['meyhane','tavern'],['çiçek','flower'],['asker','soldier'],['sayı','number'],['ihtilal','revolution'],['keşfetmek','to discover'],['kapı','door'],['açılmak','to be opened'],['yazılmak','to be written'],['satılmak','to be sold'],['yapılmak','to be made'],['verilmek','to be given'],['girilmez','no entry'],['içilmez','not smoked, no smoking'],['kendi','self, own'],['yıkanmak','to wash oneself'],['giyinmek','to get dressed'],['dinlenmek','to relax'],['taşınmak','to move house'],['bilgi','knowledge'],['bilim','science'],['sorun','problem'],['saygı','respect'],['duygu','feeling'],['üzgün','sad'],['çalışkan','hard-working'],['unutkan','forgetful'],['rahatsız etmek','to disturb'],['sataşmak','to harass'],['ayıp','shame']],
drills:[
{t:'mc',q:'"The door was opened." (aç)',o:['Kapı açıldı.','Kapı açtı.','Kapıyı açıldı.','Kapı açtırdı.'],a:0,w:'aç + ıl + dı. The subject has no object ending.'},
{t:'mc',q:'"The car will be washed." (yıka)',o:['Araba yıkanacak.','Araba yıkılacak.','Arabayı yıkanacak.','Araba yıkayacak.'],a:0,w:'yıka ends in a vowel, so the passive is -n.'},
{t:'mc',q:'"The purse was stolen." (çal)',o:['Cüzdan çalındı.','Cüzdan çalıldı.','Cüzdan çaldı.','Cüzdanı çalındı.'],a:0,w:'çal ends in l, so the passive is -ın.'},
{t:'mc',q:'"The table is being wiped." (sil)',o:['Masa siliniyor.','Masa siliyor.','Masayı siliniyor.','Masa silecek.'],a:0,w:'sil ends in l, so -in: silin + iyor.'},
{t:'ty',q:'Passive of yemek ("to be eaten"):',a:['yenmek'],w:'ye ends in a vowel: ye + n + mek.'},
{t:'mc',q:'"Hamlet was written by Shakespeare."',o:['Hamlet Şekspir tarafından yazıldı.','Hamlet Şekspir yazıldı.','Hamlet Şekspir yazdı.','Hamlet Şekspir\'e yazıldı.'],a:0,w:'tarafından is by.'},
{t:'mc',q:'A sign says "Girilmez." What does it mean?',o:['No entry.','Entry free.','Closed for repairs.','Enter here.'],a:0,w:'Passive of girmek: it is not entered.'},
{t:'mc',q:'A sign says "Kahvaltı verilir." What does it mean?',o:['Breakfast served.','Breakfast wanted.','No breakfast.','Breakfast included in price.'],a:0,w:'It is given: breakfast is served.'},
{t:'mc',q:'"I was going to phone you." (telefon etmek)',o:['Sana telefon edecektim.','Sana telefon ediyordum.','Sana telefon ettim.','Sana telefon ederdim.'],a:0,w:'Future stem + past of to be: -ecektim.'},
{t:'mc',q:'"I chose it myself."',o:['Kendim seçtim.','Ben kendi seçtim.','Kendini seçtim.','Kendimi seçtim.'],a:0,w:'kendim: myself, as subject.'},
{t:'mc',q:'"Look after yourself." (informal)',o:['Kendine iyi bak.','Kendini iyi bak.','Kendin iyi bak.','Kendinde iyi bak.'],a:0,w:'bakmak takes -e, so kendine.'},
{t:'mc',q:'"To get dressed" is the reflexive of giymek:',o:['giyinmek','giyilmek','giydirmek','giyişmek'],a:0,w:'Reflexive uses -in.'},
{t:'mc',q:'"To relax" is the reflexive of dinlemek:',o:['dinlenmek','dinlemek','dinletmek','dinlişmek'],a:0,w:'Literally to listen to yourself.'},
{t:'mc',q:'"Knowledge" is built from bilmek with:',o:['-gi (bilgi)','-in (bilin)','-iş (biliş)','-miş (bilmiş)'],a:0,w:'bilmek → bilgi.'},
{t:'ty',q:'"Hard-working" (çalışmak + -kan)',a:['çalışkan'],w:'çalış + kan.'},
{t:'mc',q:'A sign says "Sigara içilmez." What does it mean?',o:['Smoking forbidden.','Cigarettes sold.','Smoking area.','Light your cigarette.'],a:0,w:'Passive of içmek, negative -mez.'}
]});

ADD({id:'u16',kind:'u',n:16,group:'E',tr:'Fiyatları bilseydim orada yemezdik',en:'If I had known the prices we wouldn\'t have eaten there',pp:'234–246',
short:'Unlikely and past conditionals, expressing regret with keşke, saying as soon as, and nouns and adjectives built from verb stems.',
scene:'A neighbour describes a family holiday on a Marmara island and a birthday fish dinner whose bill nearly ruined it.',
purpose:'This is the last grammar chapter, and it pulls together what came before. You learn the -seydi conditional for things that are unlikely or that did not happen (If I had known…), the regret word keşke, yapar yapmaz for as soon as, and another set of verb-stem endings that build nouns and adjectives. If you can say these, you can speak about possibility and the past in the same breath.',
can:['Say what you would do in an unlikely situation.','Say what you would have done if things had been different.','Express regret with keşke.','Say as soon as.','Recognise more noun and adjective endings.'],
gram:[['The -seydi conditional','Stem + -se + past of to be: gelseydim, yapsaydın, otursaydık. The main clause uses the -erdi form.',[['Yerinde olsaydım giderdim.','If I were you I would go.'],['Fiyatları bilseydim yemezdik.','If I had known the prices we would not have eaten.']]],
['Unlikely versus past','The same form covers an improbable present or future and an impossible past. Context decides.',[['Daha serin olsaydı giderdik.','If it had been cooler we would have gone.']]],
['Real versus unreal','gelirsen memnun olurum is a plain condition. gelseydin memnun olurdum signals doubt.',[]],
['Keşke','If only… with the -seydi form.',[['Keşke gitmeseydin.','I wish you hadn\'t gone.'],['Keşke hiç tanışmasaydık.','I wish we had never met.']]],
['Yapar yapmaz','Positive then negative -r tense means as soon as.',[['Eve gelir gelmez banyo yapacağım.','As soon as I get home I will bathe.']]],
['More stem endings','-mez, -ç, -gıç, -ik, -ek, -it, -ıntı: inanılmaz (unbelievable), kazanç (profit), başlangıç (start), uçak (aeroplane), akıntı (current).',[['inanmak → inanılmaz','to believe → unbelievable']]]],
tip:'The same -erdi form that meant used to now means would. Do not translate it as used to inside an if-sentence.',
vocab:[['keşke','if only'],['yerinde olmak','to be in someone\'s place'],['dikkat etmek','to pay attention'],['pişman','regretful'],['şok olmak','to be shocked'],['hesap','bill'],['ada','island'],['vapur','ferry'],['deniz otobüsü','sea bus'],['sürmek','to take (time)'],['serin','cool'],['gezmek','to tour, stroll'],['balık','fish'],['ısmarlamak','to order'],['ertesi sabah','the next morning'],['yeterince','enough'],['yarısı','half of it'],['bile','even'],['patron','boss'],['fark etmek','to notice'],['öldürmek','to kill'],['yüzünden','because of'],['inanılmaz','unbelievable'],['görünmez','invisible'],['değişmez','unchanging'],['kazanç','profit'],['utanç','shame'],['başlangıç','start'],['uçak','aeroplane'],['akıntı','current'],['söylenti','rumour'],['uyanık','alert, awake'],['karışık','mixed'],['bozuk','broken'],['kaçak','fugitive']],
drills:[
{t:'mc',q:'"If I had come." (gel)',o:['gelseydim','gelirsem','gelsem','gelecektim'],a:0,w:'gel + se + ydi + m, written gelseydim.'},
{t:'mc',q:'"If you had done it." (sen; yap)',o:['yapsaydın','yaparsan','yaptıysan','yapacaktın'],a:0,w:'yap + sa + ydı + n.'},
{t:'ty',q:'"If we had sat down." (otur)',a:['otursaydık'],w:'otur + say + dı + k.'},
{t:'mc',q:'"If I had known the prices, we wouldn\'t have eaten there."',o:['Fiyatları bilseydim orada yemezdik.','Fiyatları bilirsem orada yemeyiz.','Fiyatları biliyorsam orada yemezdik.','Fiyatları bilmiştim orada yemezdik.'],a:0,w:'-seydi in the if clause, -erdi in the main clause.'},
{t:'mc',q:'"If I were you, I would go."',o:['Yerinde olsaydım giderdim.','Yerinde olursam giderim.','Yerinde olmuşum giderdim.','Yerinde olacaktım gideriz.'],a:0,w:'olsaydım + giderdim.'},
{t:'mc',q:'"I wish you hadn\'t gone."',o:['Keşke gitmeseydin.','Keşke gitmedin.','Keşke gitmezsin.','Keşke gitme.'],a:0,w:'keşke takes the -seydi form.'},
{t:'mc',q:'"If only I were prettier." (daha güzel)',o:['Keşke daha güzel olsaydım.','Keşke daha güzelim.','Keşke daha güzel olurum.','Keşke daha güzeldim.'],a:0,w:'olsaydım after keşke.'},
{t:'mc',q:'"As soon as I get home I\'ll have a bath."',o:['Eve gelir gelmez banyo yapacağım.','Eve geldikten sonra banyo yaptım.','Eve gelince gelmez banyo yapacağım.','Eve gelmeden banyo yaparım.'],a:0,w:'gelir gelmez: positive then negative -r tense.'},
{t:'mc',q:'"Answer straight away when the phone rings."',o:['Telefon çalar çalmaz cevap ver!','Telefon çalarken cevap vermedin.','Telefon çalınca çalmaz cevap ver!','Telefon çalmadan cevap ver!'],a:0,w:'çalar çalmaz = as soon as it rings.'},
{t:'mc',q:'"Unbelievable" (inanmak + passive + -maz)',o:['inanılmaz','inanamaz','inanmaz','inanılış'],a:0,w:'inan + ıl + maz.'},
{t:'mc',q:'"Aeroplane" (uçmak + -ak)',o:['uçak','uçık','uçek','uçuk'],a:0,w:'uç + ak.'},
{t:'ty',q:'Type the noun meaning "start" (built from başlamak).',a:['başlangıç'],w:'başlamak gives başlangıç, one of the nouns built with the -gıç family of endings.'},
{t:'mc',q:'What is the difference between "gelirsen memnun olurum" and "gelseydin memnun olurdum"?',o:['The second suggests doubt that it will happen','The second is formal','The first is past','No difference'],a:0,w:'The -seydi form implies the situation is unlikely or did not happen.'},
{t:'ty',q:'"Profit" (kazanmak + -ç)',a:['kazanç'],w:'kazan + ç.'},
{t:'mc',q:'"If she had seen the bill, she would have killed me."',o:['Hesabı görseydi beni öldürürdü.','Hesabı görürse beni öldürür.','Hesabı gördüyse beni öldürdü.','Hesabı görsün beni öldürsün.'],a:0,w:'görseydi + öldürürdü.'},
{t:'mc',q:'"If the children had been older, we would have toured."',o:['Çocuklar daha büyük olsaydı gezerdik.','Çocuklar daha büyük olursa gezeriz.','Çocuklar daha büyük olmuş gezdik.','Çocuklar büyük olsunlar gezdik.'],a:0,w:'olsaydı (3rd person) + gezerdik.'}
]});

</script>
<script>
(function(){
'use strict';
var SECTIONS=window.SECTIONS||[];
var GROUPS={
  O:['Orientation','How the course works, what makes Turkish different, and the sounds you need before unit 1.'],
  A:['First contact','Units 1 to 3. Shops, passports and restaurants: ask, answer, order and instruct with the smallest working toolkit.'],
  B:['The four everyday tenses','Units 4 to 7. Now, past, future and the all-purpose -r tense, plus possession and polite requests.'],
  C:['Ability, obligation and conditions','Units 8 to 10. Can, might, let us, must, and if: the grammar of plans, advice and bargaining.'],
  D:['Reporting and describing','Units 11 to 13. Say what others said, build which-clauses, and narrate events in the right time layer.'],
  E:['Stories, passives and what-ifs','Units 14 to 16. Habits, causing and receiving actions, regrets, and hypothetical situations.']
};
var KEY='turkish-training-ground-v1';
var P={};
try{P=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){P={}}
if(!P.s)P.s={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
function rec(id){if(!P.s[id])P.s[id]={best:0,att:0,k:{}};return P.s[id]}

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var trLower=function(s){return String(s).replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase()};
var strip=function(s){return trLower(s).replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')};
var norm=function(s){return trLower(s).replace(/[?!.,;:"“”]/g,'').replace(/\s+/g,' ').trim()};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function sec(id){for(var i=0;i<SECTIONS.length;i++)if(SECTIONS[i].id===id)return SECTIONS[i];return null}
function label(s){return s.kind==='u'?('Unit '+s.n):('Orientation '+(s.n+1))}
function knownCount(s){var k=rec(s.id).k,c=0;s.vocab.forEach(function(v){if((k[v[0]]||0)>=2)c++});return c}
function pct(s){var r=rec(s.id);var w=s.vocab.length?knownCount(s)/s.vocab.length:0;return Math.round(100*(0.65*r.best+0.35*w))}
function status(s){var p=pct(s);return p>=80?'done':(p>0||rec(s.id).att>0)?'going':'new'}
var speakOK='speechSynthesis' in window;
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
var SPK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

var app,view={name:'home',tab:'purpose',mode:'cards'};

/* ---------- shell ---------- */
function shell(){
  var h='<header class="top"><div class="wrap"><a class="brand" href="#home"><i></i>Turkish Training Ground</a><nav class="nav" aria-label="Main"><a href="../index.html">← back to the map</a>'+
  '<a href="#home" data-nav="home">Map</a><a href="#review" data-nav="review">Mixed review</a><a href="#lab" data-nav="lab">Harmony lab</a><a href="#ladder" data-nav="ladder">Verb ladder</a>'+
  '</nav></div></header><main class="wrap" id="main" tabindex="-1"></main>';
  document.getElementById('app').innerHTML=h;
}
function setNav(n){var a=document.querySelectorAll('.nav a');for(var i=0;i<a.length;i++){if(a[i].getAttribute('data-nav')===n)a[i].setAttribute('aria-current','page');else a[i].removeAttribute('aria-current')}}
function main(){return document.getElementById('main')}

/* ---------- routing ---------- */
function route(){
  var h=(location.hash||'#home').slice(1);
  var m=main();if(!m)return;
  if(h==='review'){setNav('review');viewReview();window.scrollTo(0,0);return}
  if(h==='lab'){setNav('lab');viewLab();window.scrollTo(0,0);return}
  if(h==='ladder'){setNav('ladder');viewLadder();window.scrollTo(0,0);return}
  var s=sec(h);
  if(s){setNav('');if(view.name!==h){view={name:h,tab:'purpose',mode:'cards'}}viewChapter(s);window.scrollTo(0,0);return}
  setNav('home');viewHome();
}

/* ---------- home ---------- */
function viewHome(){
  view={name:'home'};
  var tot=0,done=0,words=0,known=0;
  SECTIONS.forEach(function(s){tot++;if(status(s)==='done')done++;words+=s.vocab.length;known+=knownCount(s)});
  var drills=SECTIONS.reduce(function(a,s){return a+s.drills.length},0);
  var next=null;for(var i=0;i<SECTIONS.length;i++){if(status(SECTIONS[i])!=='done'){next=SECTIONS[i];break}}
  var h='<section class="hero"><span class="eyebrow">Teach Yourself Turkish, chapter by chapter</span><h1>Train every chapter until it is <em>automatic.</em></h1>'+
  '<p class="lead">Each of the 20 stops below covers one chapter of the book. Open a stop to see what it is for, then drill its words and its grammar until you stop having to think about it.</p>'+
  '<div class="row">'+(next?'<a class="btn primary" href="#'+next.id+'">'+(done?'Continue: ':'Start: ')+esc(label(next))+'</a>':'')+'<a class="btn" href="#review">Mixed review</a><a class="btn" href="#lab">Harmony lab</a></div>'+
  '<div class="stats"><div><b>'+done+'/'+tot+'</b><span>stops cleared</span></div><div><b>'+known+'/'+words+'</b><span>words known</span></div><div><b>'+drills+'</b><span>grammar drills</span></div></div></section>';
  var order=['O','A','B','C','D','E'];
  order.forEach(function(g){
    var list=SECTIONS.filter(function(s){return s.group===g});if(!list.length)return;
    h+='<section class="band"><header><h2>'+esc(GROUPS[g][0])+'</h2><p>'+esc(GROUPS[g][1])+'</p></header><div class="line">';
    list.forEach(function(s){
      var p=pct(s);
      h+='<div class="stop" data-st="'+status(s)+'"><div class="node">'+(s.kind==='u'?s.n:'·')+'</div><a class="stopcard" href="#'+s.id+'"><h3>'+esc(s.tr)+'</h3><div class="en">'+esc(s.en)+'</div><div class="why">'+esc(s.short||s.purpose)+'</div>'+
      '<div class="meta"><span class="chip">'+esc(label(s))+' · book p. '+esc(s.pp)+'</span><div class="bar"><i style="width:'+p+'%"></i></div><span class="pct">'+p+'%</span></div></a></div>';
    });
    h+='</div></section>';
  });
  h+='<p class="foot">Progress is saved in this browser only. Built from Pollard and Pollard, Teach Yourself Turkish. Drills and examples are original practice material that follow each chapter\'s targets.</p>';
  main().innerHTML=h;
}

/* ---------- chapter ---------- */
function viewChapter(s){
  var idx=SECTIONS.indexOf(s),prev=SECTIONS[idx-1],nx=SECTIONS[idx+1];
  var h='<div class="chead"><span class="eyebrow">'+esc(GROUPS[s.group][0])+' · book p. '+esc(s.pp)+'</span><div class="big"><span class="num">'+(s.kind==='u'?s.n:'·')+'</span><h1>'+esc(s.tr)+'</h1></div><div class="en">'+esc(s.en)+'</div></div>'+
  '<div class="tabs" role="tablist">'+[['purpose','Purpose'],['words','Words ('+s.vocab.length+')'],['drills','Drills ('+s.drills.length+')']].map(function(t){return '<button role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(view.tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div><div id="pane"></div>'+
  '<div class="nav2">'+(prev?'<a class="btn" href="#'+prev.id+'">← '+esc(prev.tr)+'</a>':'<span></span>')+(nx?'<a class="btn" href="#'+nx.id+'">'+esc(nx.tr)+' →</a>':'<span></span>')+'</div>';
  main().innerHTML=h;
  var tb=document.querySelectorAll('.tabs button');
  for(var i=0;i<tb.length;i++)tb[i].onclick=function(){view.tab=this.getAttribute('data-tab');viewChapter(s)};
  var pane=$('#pane');
  if(view.tab==='purpose')paintPurpose(s,pane);
  else if(view.tab==='words')paintWords(s,pane);
  else paintDrills(s,pane);
}
function paintPurpose(s,el){
  var h='<div class="cols"><div><div class="scene"><b>Situation</b>'+esc(s.scene)+'</div><p class="purpose">'+esc(s.purpose)+'</p><div style="margin-top:20px"><h2 style="font-size:1.1rem;font-family:var(--f-body);font-weight:700">By the end you can</h2><ul class="can">'+s.can.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul></div>'+
  '<div class="row" style="margin-top:22px"><button class="btn primary" type="button" data-go="drills">Start the drills</button><button class="btn" type="button" data-go="words">Practise the words</button></div></div>'+
  '<div class="side">'+(s.tip?'<div class="tip"><b>Field note</b>'+esc(s.tip)+'</div>':'')+'<h2>Grammar and sounds trained here</h2><div class="gram">'+
  s.gram.map(function(g){return '<div class="gcard"><h3>'+esc(g[0])+'</h3><p>'+esc(g[1])+'</p>'+(g[2]&&g[2].length?'<div class="ex">'+g[2].map(function(e){return '<div>'+esc(e[0])+' <span>'+esc(e[1])+'</span></div>'}).join('')+'</div>':'')+'</div>'}).join('')+'</div></div></div>';
  el.innerHTML=h;
  var b=el.querySelectorAll('[data-go]');for(var i=0;i<b.length;i++)b[i].onclick=function(){view.tab=this.getAttribute('data-go');viewChapter(s)};
}

/* ---------- words ---------- */
function paintWords(s,el){
  var modes=[['cards','Flashcards'],['match','Match pairs'],['type','Type it']];
  el.innerHTML='<div class="modes" role="group" aria-label="Word practice mode">'+modes.map(function(m){return '<button type="button" data-m="'+m[0]+'" aria-pressed="'+(view.mode===m[0])+'">'+m[1]+'</button>'}).join('')+'</div><div class="stage" id="stage"></div>';
  var b=el.querySelectorAll('[data-m]');for(var i=0;i<b.length;i++)b[i].onclick=function(){view.mode=this.getAttribute('data-m');paintWords(s,el)};
  var st=$('#stage');
  if(view.mode==='cards')cards(s,st);else if(view.mode==='match')match(s,st);else typer(s,st);
}
function box(s,w,d){var k=rec(s.id).k;k[w]=Math.max(0,Math.min(3,(k[w]||0)+d));save()}
function cards(s,st){
  var q=shuffle(s.vocab.slice()),i=0,flipped=false,seen=0;
  function paint(){
    if(!q.length){st.innerHTML='<div class="sum"><div class="score">'+knownCount(s)+'/'+s.vocab.length+'</div><p>words marked as known. Words you miss come back sooner next time.</p><div class="row"><button class="btn primary" type="button" id="again">Go again</button></div></div>';$('#again').onclick=function(){cards(s,st)};return}
    var c=q[0];
    st.innerHTML='<div class="flash"><div class="qtop"><span>'+(s.vocab.length-q.length+1>s.vocab.length?s.vocab.length:Math.min(s.vocab.length,seen+1))+' of '+s.vocab.length+'</span><span>box '+(rec(s.id).k[c[0]]||0)+'/3</span></div>'+
    '<div class="fc'+(flipped?' back':'')+'" id="fc" tabindex="0" role="button" aria-label="Flip card"><div class="w">'+esc(flipped?c[1]:c[0])+'</div><div class="hint">'+(flipped?'':'Tap to reveal the meaning')+'</div></div>'+
    '<div class="row">'+(speakOK?'<button class="btn sm" type="button" id="spk" aria-label="Hear it">'+SPK+' Hear it</button>':'')+(flipped?'<button class="btn sm" type="button" id="no">Again</button><button class="btn sm primary" type="button" id="yes">Got it</button>':'<button class="btn sm" type="button" id="flip">Show meaning</button>')+'</div></div>';
    var f=function(){flipped=true;paint()};
    $('#fc').onclick=function(){flipped=!flipped;paint()};$('#fc').onkeydown=function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();flipped=!flipped;paint()}};
    if($('#flip'))$('#flip').onclick=f;
    if($('#spk'))$('#spk').onclick=function(e){e.stopPropagation();speak(c[0])};
    if($('#yes'))$('#yes').onclick=function(){box(s,c[0],1);q.shift();seen++;flipped=false;paint()};
    if($('#no'))$('#no').onclick=function(){box(s,c[0],-3);q.push(q.shift());flipped=false;paint()};
  }
  paint();
}
function match(s,st){
  var pool=shuffle(s.vocab.slice()).slice(0,6),L=shuffle(pool.slice()),R=shuffle(pool.slice()),sel=null,done=0,miss=0;
  st.innerHTML='<p class="muted" style="margin-bottom:10px">Pick a Turkish word, then its meaning.</p><div class="match" id="mt"><div style="display:grid;gap:10px" id="lc"></div><div style="display:grid;gap:10px" id="rc"></div></div><div id="mres" style="margin-top:14px"></div>';
  function btn(c,side){var b=document.createElement('button');b.type='button';b.textContent=side==='l'?c[0]:c[1];b.setAttribute('data-id',c[0]);b.setAttribute('data-side',side);
    b.onclick=function(){
      if(b.classList.contains('done'))return;
      if(side==='l'&&speakOK)speak(c[0]);
      var cur=st.querySelector('button.sel[data-side="'+side+'"]');if(cur)cur.classList.remove('sel');
      b.classList.add('sel');
      var l=st.querySelector('button.sel[data-side="l"]'),r=st.querySelector('button.sel[data-side="r"]');
      if(l&&r){
        if(l.getAttribute('data-id')===r.getAttribute('data-id')){l.className='done';r.className='done';box(s,l.getAttribute('data-id'),1);done++;
          if(done===pool.length){$('#mres').innerHTML='<div class="fb ok"><b>All matched.</b>'+(miss?miss+' wrong tries.':'No wrong tries.')+'</div><div class="row" style="margin-top:10px"><button class="btn primary" type="button" id="nr">Another round</button></div>';$('#nr').onclick=function(){match(s,st)}}}
        else{miss++;box(s,l.getAttribute('data-id'),-1);l.classList.add('miss');r.classList.add('miss');setTimeout(function(){l.classList.remove('miss','sel');r.classList.remove('miss','sel')},500)}
      }
    };return b}
  L.forEach(function(c){$('#lc').appendChild(btn(c,'l'))});R.forEach(function(c){$('#rc').appendChild(btn(c,'r'))});
}
var CHARS=['ç','ğ','ı','ö','ş','ü','İ'];
function charBar(inp){var d=document.createElement('div');d.className='chars';d.setAttribute('aria-label','Turkish letters');CHARS.forEach(function(c){var b=document.createElement('button');b.type='button';b.textContent=c;b.onclick=function(){var p=inp.selectionStart||inp.value.length;inp.value=inp.value.slice(0,p)+c+inp.value.slice(inp.selectionEnd||p);inp.focus();inp.selectionStart=inp.selectionEnd=p+1};d.appendChild(b)});return d}
function typer(s,st){
  var q=shuffle(s.vocab.slice()).slice(0,10),i=0,ok=0;
  function paint(){
    if(i>=q.length){st.innerHTML='<div class="sum"><div class="score">'+ok+'/'+q.length+'</div><p>typed correctly. Plain letters count (c for ç), the correct spelling is always shown.</p><div class="row"><button class="btn primary" type="button" id="again">Another ten</button></div></div>';$('#again').onclick=function(){typer(s,st)};return}
    var c=q[i];
    st.innerHTML='<div class="q"><div class="qtop"><span>Word '+(i+1)+' of '+q.length+'</span></div><div class="qtext">'+esc(c[1])+'</div><div class="inrow"><input class="txt" id="ti" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Turkish word"><button class="btn primary" type="button" id="chk">Check</button></div><div id="cb"></div><div id="fb"></div></div>';
    var inp=$('#ti');$('#cb').appendChild(charBar(inp));inp.focus();
    var done=false;
    function check(){
      if(done){i++;paint();return}
      var a=strip(norm(inp.value)),r=strip(norm(c[0]));
      var good=a===r;done=true;inp.disabled=true;
      if(good){ok++;box(s,c[0],1)}else box(s,c[0],-1);
      $('#fb').innerHTML='<div class="fb '+(good?'ok':'no')+'"><b>'+(good?'Correct.':'Not quite.')+'</b>'+esc(c[1])+' = <span class="tr">'+esc(c[0])+'</span></div>';
      $('#chk').textContent=i+1<q.length?'Next':'Finish';$('#chk').focus();
    }
    $('#chk').onclick=check;inp.onkeydown=function(e){if(e.key==='Enter')check()};
  }
  paint();
}

/* ---------- drills ---------- */
function paintDrills(s,el){
  runner(el,s.drills.slice(),{title:s.tr,onDone:function(res){var r=rec(s.id);r.att++;if(res.score>r.best)r.best=res.score;save()},again:function(){paintDrills(s,el)},nextHref:(SECTIONS[SECTIONS.indexOf(s)+1]||{}).id});
}
function runner(el,items,opt){
  var i=0,right=0,missed=[],items0=items.slice();
  function end(){
    var sc=items.length?right/items.length:0;
    if(opt.onDone)opt.onDone({score:sc,right:right,total:items.length});
    el.innerHTML='<div class="sum"><span class="eyebrow">Round complete</span><div class="score">'+right+'/'+items.length+'</div><p>'+(sc>=.8?'Solid. This chapter is in good shape.':sc>=.5?'Getting there. Review the misses below, then go again.':'Re-read the Purpose tab, then try again. The explanations after each answer are the real lesson.')+'</p>'+
    (missed.length?'<div><b>Missed</b><ul class="miss-list" style="list-style:none;padding:0;margin:8px 0 0">'+missed.map(function(m){return '<li><b>'+esc(m.q)+'</b><br><span class="muted">'+esc(m.ans)+'</span></li>'}).join('')+'</ul></div>':'')+
    '<div class="row">'+(missed.length?'<button class="btn primary" type="button" id="rm">Retry missed ('+missed.length+')</button>':'')+'<button class="btn'+(missed.length?'':' primary')+'" type="button" id="ra">Run the full set again</button>'+(opt.nextHref?'<a class="btn" href="#'+opt.nextHref+'">Next chapter</a>':'')+'</div></div>';
    if($('#rm'))$('#rm').onclick=function(){var keep=missed.map(function(m){return m.item});i=0;right=0;missed=[];items=keep;ask()};
    $('#ra').onclick=function(){if(opt.again)opt.again();else runner(el,items0,opt)};
  }
  function ask(){
    if(i>=items.length){end();return}
    var d=items[i];
    var wrap=document.createElement('div');wrap.className='q';
    wrap.innerHTML='<div class="qtop"><span>Question '+(i+1)+' of '+items.length+'</span><span>'+({mc:'Choose',ty:'Type',or:'Build the sentence'}[d.t])+'</span></div><div class="qtext">'+esc(d.q)+'</div><div id="body"></div><div id="fb"></div><div id="nx"></div>';
    el.innerHTML='';el.className='stage';el.appendChild(wrap);
    var body=$('#body',wrap),fb=$('#fb',wrap),nx=$('#nx',wrap),answered=false;
    function finish(good,ansText){
      if(answered)return;answered=true;
      if(good)right++;else missed.push({item:d,q:d.q,ans:ansText});
      fb.innerHTML='<div class="fb '+(good?'ok':'no')+'"><b>'+(good?'Correct.':'Not this time.')+'</b>'+(good?'':'Answer: <span class="tr">'+esc(ansText)+'</span><br>')+esc(d.w||'')+'</div>';
      nx.innerHTML='<div class="row" style="margin-top:6px"><button class="btn primary" type="button" id="nb">'+(i+1<items.length?'Next question':'See results')+'</button></div>';
      var nb=$('#nb',nx);nb.onclick=function(){i++;ask()};nb.focus();
    }
    if(d.t==='mc'){
      var order=shuffle(d.o.map(function(t,k){return {t:t,c:k===d.a}}));
      body.className='opts';
      order.forEach(function(o,k){
        var b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML='<span class="k">'+'ABCDEF'[k]+'</span><span>'+esc(o.t)+'</span>';
        b.onclick=function(){if(answered)return;var all=body.querySelectorAll('.opt');for(var z=0;z<all.length;z++){all[z].disabled=true;if(order[z].c)all[z].classList.add('ok')}
          if(!o.c)b.classList.add('no');finish(o.c,d.o[d.a])};
        body.appendChild(b);
      });
    }else if(d.t==='ty'){
      body.innerHTML='<div class="inrow"><input class="txt" id="ti" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Your answer"><button class="btn primary" type="button" id="chk">Check</button></div><div id="cb" style="margin-top:8px"></div>';
      var inp=$('#ti',body);$('#cb',body).appendChild(charBar(inp));inp.focus();
      var go=function(){
        if(answered)return;
        var v=norm(inp.value);if(!v)return;
        var good=false,loose=false;
        d.a.forEach(function(a){if(norm(a)===v)good=true;else if(!d.s&&strip(norm(a))===strip(v))loose=true});
        inp.disabled=true;$('#chk',body).disabled=true;
        finish(good||loose,d.a[0]);
        if(loose&&!good)fb.firstChild.firstChild.textContent='Correct, but check the letters: '+d.a[0]+'. ';
      };
      $('#chk',body).onclick=go;inp.onkeydown=function(e){if(e.key==='Enter')go()};
    }else{
      var toks=d.a.replace(/[?!.]+$/,'').split(' ').concat(d.x||[]);
      var pool=shuffle(toks.map(function(t,k){return {t:trLower(t),id:k}})),ans=[];
      body.innerHTML='<div class="answer" id="ans" aria-label="Your sentence"></div><div class="pool" id="pl"></div><div class="row"><button class="btn primary" type="button" id="chk">Check</button><button class="btn" type="button" id="clr">Clear</button></div>';
      var A=$('#ans',body),Pl=$('#pl',body);
      function draw(){
        A.innerHTML='';Pl.innerHTML='';
        ans.forEach(function(o,k){var b=document.createElement('button');b.type='button';b.className='tok';b.textContent=o.t;b.onclick=function(){if(answered)return;ans.splice(k,1);pool.push(o);draw()};A.appendChild(b)});
        pool.forEach(function(o,k){var b=document.createElement('button');b.type='button';b.className='tok';b.style.borderColor='var(--line)';b.textContent=o.t;b.onclick=function(){if(answered)return;pool.splice(k,1);ans.push(o);draw()};Pl.appendChild(b)});
      }
      draw();
      $('#clr',body).onclick=function(){if(answered)return;pool=pool.concat(ans);ans=[];draw()};
      $('#chk',body).onclick=function(){
        if(answered)return;var got=ans.map(function(o){return o.t}).join(' ');
        var good=[d.a].concat(d.alt||[]).some(function(a){return norm(a)===got});
        $('#chk',body).disabled=true;finish(good,d.a);
      };
    }
  }
  ask();
}

/* ---------- harmony lab ---------- */
var VOW='aeıioöuü',FRONT='eiöü',VLESS='çfhkpsşt',ROUND='ouöü';
var LOAN={saat:'e',meşgul:'ü',hâlâ:'a'};
function lastV(w){var f=LOAN[w];if(f)return f;for(var i=w.length-1;i>=0;i--)if(VOW.indexOf(w[i])>-1)return w[i];return ''}
function eV(w){return FRONT.indexOf(lastV(w))>-1?'e':'a'}
function iV(w){var v=lastV(w);return {a:'ı',ı:'ı',e:'i',i:'i',o:'u',u:'u',ö:'ü',ü:'ü'}[v]||'i'}
function endsV(w){return VOW.indexOf(w[w.length-1])>-1}
function vless(w){return VLESS.indexOf(w[w.length-1])>-1}
function soft(w){var n=0;for(var i=0;i<w.length;i++)if(VOW.indexOf(w[i])>-1)n++;return (n>1&&w[w.length-1]==='k')?w.slice(0,-1)+'ğ':w}
var SUFS=[
 ['Plural -ler / -lar','Unit 1',function(w){return w+'l'+eV(w)+'r'}],
 ['In, at, on: -de / -da / -te / -ta','Unit 3',function(w){return w+(vless(w)?'t':'d')+eV(w)}],
 ['From: -den / -dan / -ten / -tan','Unit 3',function(w){return w+(vless(w)?'t':'d')+eV(w)+'n'}],
 ['To: -e / -a','Unit 3',function(w){return soft(w)+(endsV(w)?'y':'')+eV(w)}],
 ['The (direct object): -i / -ı / -u / -ü','Unit 3',function(w){return soft(w)+(endsV(w)?'y':'')+iV(w)}],
 ['I am: -im / -ım / -um / -üm','Unit 2',function(w){return w+(endsV(w)?'y':'')+iV(w)+'m'}],
 ['Was (I): -dim / -dım / -tim ...','Unit 5',function(w){return w+(vless(w)?'t':'d')+iV(w)+'m'}],
 ['My: -im / -ım / -m','Unit 2',function(w){return endsV(w)?w+'m':soft(w)+iV(w)+'m'}],
 ['Your (formal): -iniz / -nız','Unit 2',function(w){return endsV(w)?w+'n'+iV(w)+'z':soft(w)+iV(w)+'n'+iV(w)+'z'}],
 ['His, her, its (possessed): -i / -si','Unit 4',function(w){return endsV(w)?w+'s'+iV(w):soft(w)+iV(w)}],
 ['Possessor, of: -in / -nin','Unit 4',function(w){return soft(w)+(endsV(w)?'n':'')+iV(w)+'n'}],
 ['With: -li / -lı / -lu / -lü','Unit 4',function(w){return w+'l'+iV(w)}],
 ['Without: -siz / -sız / -suz / -süz','Unit 4',function(w){return w+'s'+iV(w)+'z'}],
 ['Person or job: -ci / -çi ...','Intro, Unit 4',function(w){return w+(vless(w)?'ç':'c')+iV(w)}],
 ['-ness, for: -lik / -lık / -luk / -lük','Unit 9',function(w){return w+'l'+iV(w)+'k'}]
];
function qWord(w){return w+' m'+iV(w)}
function viewLab(){
  view={name:'lab'};
  main().innerHTML='<div class="chead"><span class="eyebrow">Tool · units 1 to 5 and beyond</span><div class="big"><h1>Harmony lab</h1></div><div class="en">Type any Turkish word. See which vowel drives the endings and what each regular ending turns into.</div></div>'+
  '<div class="labin"><input class="txt" id="lw" type="text" value="ev" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Turkish word" style="max-width:260px"><div id="lc"></div></div><div id="lo"></div>'+
  '<p class="foot" style="margin-top:24px">The lab shows the regular pattern. Real words have exceptions (some loan words and a few one-syllable words), so treat it as a coach, not a dictionary. Words ending in k lose it to ğ only when they have more than one syllable.</p>';
  var inp=$('#lw');$('#lc').appendChild(charBar(inp));
  function go(){
    var w=trLower(inp.value.trim().split(/\s+/)[0]||'');
    if(!w||!lastV(w)){$('#lo').innerHTML='<div class="fb no"><b>No vowel found.</b>Type a Turkish word, for example kitap, göz or okul.</div>';return}
    var v=lastV(w),e=eV(w),i=iV(w);
    var grid=[['a','ı','o','u'],['e','i','ö','ü']].map(function(row){return row.map(function(x){return '<div class="'+(x===v?'on':'')+'">'+x+'<small>'+({a:'back',ı:'back',o:'back',u:'back',e:'front',i:'front',ö:'front',ü:'front'}[x])+(ROUND.indexOf(x)>-1?', round':', flat')+'</small></div>'}).join('')}).join('');
    var h='<p>Last vowel of <b class="tr">'+esc(w)+'</b> is <b>'+esc(v)+'</b>'+(LOAN[w]?' (this loan word is pronounced with a front vowel)':'')+'. It is '+(FRONT.indexOf(v)>-1?'a front':'a back')+', '+(ROUND.indexOf(v)>-1?'rounded':'unrounded')+' vowel.</p><div class="vow">'+grid+'</div>'+
    '<p style="margin-bottom:14px"><b>e-type endings</b> use <span class="mono">'+e+'</span> &nbsp; <b>i-type endings</b> use <span class="mono">'+i+'</span> &nbsp; Last sound is '+(vless(w)?'<b>voiceless</b>, so d becomes t and c becomes ç':'not voiceless, so d and c stay')+'.</p>';
    h+='<div class="tw"><table><thead><tr><th>Ending</th><th>Result</th><th>Taught in</th></tr></thead><tbody>';
    SUFS.forEach(function(s){var r=s[2](w);var p=0;while(p<w.length&&p<r.length&&w[p]===r[p])p++;h+='<tr><td>'+esc(s[0])+'</td><td class="suf">'+esc(r.slice(0,p))+'<b>'+esc(r.slice(p))+'</b></td><td class="muted">'+s[1]+'</td></tr>'});
    h+='<tr><td>Question word: mı / mi / mu / mü</td><td class="suf">'+esc(w)+' <b>m'+i+'</b>?</td><td class="muted">Unit 1</td></tr></tbody></table></div>';
    $('#lo').innerHTML=h;
  }
  inp.oninput=go;go();
}

 ['gel!','come! (informal)','3','Stem alone is the informal command.'],['gelin! / geliniz!','come! (formal / very formal)','3','Add -in or -iniz.'],['gelme!','don\'t come!','3','-me after the stem.'],['gelmek','to come','3','Dictionary form, stem + -mek.'],
 ['geliyorum','I am coming','4','Stem + -iyor + person.'],['gelmiyorum','I am not coming','4','-me- before -iyor.'],['geliyor musunuz?','are you coming?','4','mı/mi goes in the middle.'],['gelmek istiyorum','I want to come','4','Infinitive + istiyorum.'],
 ['geldim','I came','5','Stem + -di + person.'],['gelmedim','I did not come','5','-me- before -di.'],['geldin mi?','did you come?','5','mı/mi after the ending.'],

 ['gelebilirim','I can / might come','8','-ebil- before the tense.'],['gelemem','I cannot come','8','-e- before -me-.'],['geleyim / gelelim / gelsin','let me / let us / let him come','8','Let forms.'],
 ['gelmeli','he must come','9','-meli.'],['gelmem lazım','I need to come','9','Short infinitive + possessed + lazım.'],['gelmeyi seviyorum','I like coming','9','Short infinitive + -i.'],
 ['gelirsem','if I come','10','-r tense + -se- + person.'],['gelirse memnun olurum','if he comes I will be glad','10','If clause then -r tense.'],

 ['geliyordum','I was coming','13','Past continuous.'],['gelmiştim','I had come','13','Past perfect.'],['geldiğimi söyledi','he said I came','13','-dik noun + -i.'],
